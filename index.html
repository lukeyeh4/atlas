<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css">
<style>
  :root{
    --paper:#F7F7F5;
    --surface:#FFFFFF;
    --ink:#15181A;
    --ink-2:#585F61;
    --ink-3:#8B9294;
    --rule:#D8DBDA;
    --rule-soft:#E9EBEA;
    --land:#E7E9E7;
    --landline:#CDD1CF;
    --water:#DDE3E4;
    --space:#FFFFFF;
    --map-label:#8C9495;
    --map-label-on:#4F5757;         /* labels over a coloured layer */
    --label-halo:rgba(255,255,255,.82);
    --state-line:rgba(21,24,26,.34);
    --country-line:rgba(21,24,26,.5);   /* country borders: a step above state lines */
    --nodata:#D6D9D8;
    --nodata-line:#F2F3F2;
    --hs-shadow:rgba(40,46,46,.30);
    --hs-light:rgba(255,255,255,.35);
    --accent:#17706B;
    --accent-soft:#D9E9E7;
    --ramp0:#EFF0EC;
    --ramp1:#8A7F6C;
    --r-ci0:#F4F2E4;   --r-ci1:#9C8730;
    --r-ws0:#E7EDF2;   --r-ws1:#3C6A8B;
    --r-aq0:#EFEFEE;   --r-aq1:#6C7272;
    --r-land0:#E9EFE8; --r-land1:#4C6F51;
    --warn:#9A6B2F;
    /* connections diagram: one hue per kind of link, plus the chokepoint mark */
    --e-phys:#B07A55; --e-data:#3A8A84; --e-money:#AE9444; --e-policy:#8674AC; --e-loop:#4A88A6; --choke:#C0634E;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#111313;
      --surface:#171A1A;
      --ink:#E9EBEA;
      --ink-2:#A7AEAE;
      --ink-3:#757C7C;
      --rule:#313636;
      --rule-soft:#232727;
      --land:#222626;
      --landline:#3A4140;
      --water:#0C0F10;
      --space:#171A1A;
      --map-label:#5F6767;
      --map-label-on:#B2B9B8;
      --label-halo:rgba(17,19,19,.82);
      --state-line:rgba(233,235,234,.34);
      --country-line:rgba(233,235,234,.48);
      --nodata:#2E3232;
      --nodata-line:#4A5050;
      --hs-shadow:rgba(0,0,0,.55);
      --hs-light:rgba(233,235,234,.09);
      --accent:#6CC9BF;
      --accent-soft:#1C2E2C;
      --ramp0:#1F2322;
      --ramp1:#8E8471;
      --r-ci0:#23241B;   --r-ci1:#8A7A3A;
      --r-ws0:#1A2126;   --r-ws1:#5484A4;
      --r-aq0:#1F2322;   --r-aq1:#878D8D;
      --r-land0:#1C221C; --r-land1:#66896B;
      --warn:#C9A06A;--e-phys:#C99372;--e-data:#6DB5AE;--e-money:#CBB56C;--e-policy:#A597CA;--e-loop:#7AB0C8;--choke:#D98470;
    }
  }
  :root[data-theme="dark"]{
    --paper:#111313;--surface:#171A1A;--ink:#E9EBEA;--ink-2:#A7AEAE;--ink-3:#757C7C;
    --rule:#313636;--rule-soft:#232727;--land:#222626;--landline:#3A4140;
    --water:#0C0F10;--space:#171A1A;--map-label:#5F6767;--map-label-on:#B2B9B8;--label-halo:rgba(17,19,19,.82);--state-line:rgba(233,235,234,.34);--country-line:rgba(233,235,234,.48);--nodata:#2E3232;--nodata-line:#4A5050;--hs-shadow:rgba(0,0,0,.55);--hs-light:rgba(233,235,234,.09);
    --accent:#6CC9BF;--accent-soft:#1C2E2C;--ramp0:#1F2322;--ramp1:#8E8471;--warn:#C9A06A;--e-phys:#C99372;--e-data:#6DB5AE;--e-money:#CBB56C;--e-policy:#A597CA;--e-loop:#7AB0C8;--choke:#D98470;
    --r-ci0:#23241B;--r-ci1:#8A7A3A;--r-ws0:#1A2126;--r-ws1:#5484A4;
    --r-aq0:#1F2322;--r-aq1:#878D8D;--r-land0:#1C221C;--r-land1:#66896B;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:"Source Serif 4",Georgia,serif;font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  button,input{font:inherit;color:inherit}
  .mono,.m-lbl,.m-val,.meta,.bar-txt{font-family:"IBM Plex Mono",ui-monospace,monospace}
  .tnum{font-variant-numeric:tabular-nums}

  .app{display:flex;flex-direction:column;height:100dvh;background:var(--surface)}

  /* ---------- top hairline ---------- */
  .top{
    display:flex;align-items:center;gap:18px;padding:0 14px;height:46px;flex:0 0 auto;
    border-bottom:1px solid var(--rule);position:relative;z-index:30;background:var(--surface)
  }
  .mark{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.26em;text-transform:uppercase;white-space:nowrap}
  .search{position:relative;flex:0 1 220px;min-width:140px;display:flex;align-items:center;gap:7px}
  .search svg{flex:0 0 auto;opacity:.5}
  .search input{
    width:100%;background:none;border:0;outline:none;padding:5px 0;
    font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.02em;color:var(--ink);
    border-bottom:1px solid transparent;
  }
  .search input::placeholder{color:var(--ink-3)}
  .search input:focus{border-bottom-color:var(--accent)}
  .results{
    position:absolute;top:34px;left:0;width:290px;background:var(--surface);
    border:1px solid var(--rule);box-shadow:0 14px 30px -20px rgba(0,0,0,.55);
    max-height:300px;overflow-y:auto;display:none;z-index:40
  }
  .results.open{display:block}
  .results button{
    display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid var(--rule-soft);padding:8px 11px;cursor:pointer;color:var(--ink-2)
  }
  .results button:last-child{border-bottom:0}
  .results button:hover,.results button.cursor{background:var(--rule-soft);color:var(--ink)}
  .results .rn{font-size:14.5px}
  .results .rs{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
  .results .empty{padding:10px 11px;font-size:13px;color:var(--ink-3);font-style:italic}

  /* scenario menu: same quiet underline button as the layer switch, dropping down */
  .scen{position:relative;flex:0 0 auto}
  .scen > button{
    background:none;border:0;cursor:pointer;padding:3px 0;color:var(--ink-2);white-space:nowrap;
    font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    border-bottom:1px solid var(--rule)
  }
  .scen > button:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .scen > button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .scen > button:focus-visible{outline:none;border-bottom-color:var(--accent)}
  .scen-menu{
    position:absolute;top:28px;left:0;width:264px;background:var(--surface);border:1px solid var(--rule);
    box-shadow:0 14px 30px -20px rgba(0,0,0,.55);display:none;z-index:40
  }
  .scen-menu.open{display:block}
  .scen-menu button{
    display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule-soft);
    padding:8px 11px;cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;color:var(--ink-2)
  }
  .scen-menu button:last-child{border-bottom:0}
  .scen-menu button:hover,.scen-menu button:focus{background:var(--rule-soft);outline:none}
  .scen-menu button[aria-checked="true"]{color:var(--accent)}
  .scen-menu .sub{display:block;margin-top:2px;font-size:9px;letter-spacing:.02em;color:var(--ink-3)}
  .scen-note{color:var(--accent)}
  /* ---------- key: stages and connections, inline in the bar, folding to one button ---------- */
  .key{display:flex;align-items:center;gap:12px;margin-left:auto;flex:0 0 auto}
  .key > button{
    display:inline-flex;align-items:center;gap:6px;background:none;border:0;border-bottom:1px solid var(--rule);
    padding:3px 0;cursor:pointer;color:var(--ink-2);white-space:nowrap;flex:0 0 auto;
    font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase
  }
  .key > button:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .key > button.on{color:var(--accent);border-bottom-color:var(--accent)}   /* something is hidden */
  .key .kcar{fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease}
  .key > button[aria-expanded="true"] .kcar{transform:rotate(180deg)}      /* ‹ opens leftward, › folds away */
  .key-menu{display:flex;align-items:center;gap:11px;transform-origin:right center;
            transition:opacity .18s ease,transform .18s ease}
  .key:not(.open) .key-menu{display:none}
  .key.open .key-menu{animation:key-in .18s cubic-bezier(.2,0,0,1)}
  @keyframes key-in{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
  .stages,.key-flows{display:flex;gap:11px;align-items:center}
  .stages button,.key-flows button{
    background:none;border:0;padding:3px 0;cursor:pointer;color:var(--ink-3);
    display:inline-flex;align-items:center;gap:5px;
    font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    border-bottom:1px solid transparent;white-space:nowrap
  }
  .stages button[aria-pressed="true"],.key-flows button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  .stages button:hover,.key-flows button:hover{color:var(--ink)}
  .stages button[aria-pressed="false"] .gl,.key-flows button[aria-pressed="false"] svg{opacity:.45}
  .key-div{width:1px;height:14px;background:var(--rule);flex:0 0 auto}
  .key-sub{
    display:inline-flex;align-items:center;gap:5px;background:none;border:0;padding:3px 0;cursor:pointer;
    color:var(--ink-3);white-space:nowrap;
    font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase
  }
  .key-sub:hover{color:var(--ink-2)}
  .key-sub .car{font-size:10px;transition:transform .15s ease}
  .key-sub[aria-expanded="true"] .car{transform:rotate(180deg)}
  .key-flows[hidden]{display:none}
  button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:1px solid var(--accent);outline-offset:3px}

  /* ---------- map ---------- */
  .mapbox{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
  .gl-host{position:absolute;inset:0;background:var(--space)}
  .mk{cursor:pointer;line-height:0}
  .mk svg{display:block;width:14px;height:14px;overflow:visible}
  .mk.sel svg,.mk.cmp svg{width:18px;height:18px}
  .nd{cursor:pointer}
  .nd path{
    fill:#000;stroke:#FFF;stroke-width:2.2px;vector-effect:non-scaling-stroke;
    paint-order:stroke fill;stroke-linejoin:round;fill-rule:evenodd
  }
  .pc circle{
    fill:none;stroke:#FFF;stroke-width:3.4px;vector-effect:non-scaling-stroke;
    paint-order:stroke;cursor:pointer
  }
  .pc circle.dot{stroke:#000;stroke-width:1.5px;stroke-dasharray:2.4 2.2}
  .pc{cursor:pointer}
  .pc.sel circle.dot{stroke:var(--accent);stroke-dasharray:none;stroke-width:2.2px}
  .pc path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round}
  .pc path.ph{stroke:#FFF;stroke-width:3.2px}
  .pc path.pb{stroke:#000;stroke-width:1.7px}
  .pc.sel path.pb{stroke:var(--accent)}
  .addrow{display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--rule-soft)}
  .addrow button{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid var(--rule-soft);padding:8px 2px;cursor:pointer;color:var(--ink-2);font-size:14.5px
  }
  .addrow button:hover{color:var(--ink)}
  .addrow button .plus{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
  .addrow button:hover .plus{color:var(--accent)}
  .addrow button:focus-visible{outline:none;box-shadow:inset 2px 0 0 var(--accent)}
  .addrow button.back{
    padding:7px 2px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-3)
  }
  .addrow button.back:hover{color:var(--ink)}
  .addrow button.type{padding-left:12px}
  .p-actions button.danger{color:var(--ink-3)}
  .p-actions button.danger:hover{color:var(--warn);border-bottom-color:var(--warn)}
  .nd:hover path{fill:var(--accent)}
  .nd.rel path{fill:var(--accent);opacity:.82}
  .nd.sel path{fill:var(--accent);stroke-width:2.6px}
  .nd.cmp path{fill:var(--warn);stroke-width:2.6px}
  .gl{flex:0 0 auto;vertical-align:-1px}
  .gl path{fill:var(--ink)}
  .stages button .gl path{fill:currentColor}
  .results .gl path{fill:var(--ink-2)}
  .eyebrow .gl path{fill:currentColor}
  .overlay{position:absolute;inset:0;pointer-events:none}
  .tip{
    position:absolute;transform:translate(-50%,-165%);white-space:nowrap;font-style:italic;font-size:13px;
    color:var(--ink);background:color-mix(in srgb,var(--surface) 86%,transparent);padding:0 5px;display:none
  }
  /* Mapbox requires its logo and attribution; keep them, just quiet */
  .mapboxgl-ctrl-bottom-right .mapboxgl-ctrl-attrib{
    background:color-mix(in srgb,var(--surface) 78%,transparent);
    font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.04em;color:var(--ink-3)
  }
  .mapboxgl-ctrl-attrib a{color:var(--ink-3)}

  /* ---------- panel ---------- */
  .panel{
    position:absolute;left:0;top:0;bottom:0;width:302px;max-width:88%;background:var(--surface);
    border-right:1px solid var(--rule);padding:18px 17px 14px;display:flex;flex-direction:column;gap:14px;
    transform:translateX(-101%);transition:transform .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1);
    pointer-events:auto;overflow-y:auto;z-index:20
  }
  .panel.open{transform:none}
  .panel.wide{width:452px}
  .p-close{position:absolute;top:13px;right:13px;background:none;border:0;cursor:pointer;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:12px;z-index:2}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);display:block}
  .p-name{margin:2px 0 3px;font-size:22px;font-weight:600;letter-spacing:-.012em;line-height:1.14;padding-right:22px}
  .p-place{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-2);letter-spacing:.02em}
  .p-note{margin:0;font-size:14px;color:var(--ink-2);font-style:italic;line-height:1.45}
  .p-note.p-prof{font-size:12.5px;color:var(--ink-3)}

  .sec-lbl{display:flex;align-items:baseline;gap:8px}
  .sec-lbl button{background:none;border:0;padding:0;margin-left:auto;cursor:pointer;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
  .sec-lbl button[aria-pressed="true"]{color:var(--accent)}

  .metrics{display:flex;flex-direction:column;border-top:1px solid var(--rule-soft)}
  .m{padding:8px 0;border-bottom:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:3px}
  .m-top{display:flex;align-items:baseline;gap:8px}
  .m-lbl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
  .m-dots{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-3px);min-width:8px}
  .m-val{font-size:13px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
  .m-val .u{color:var(--ink-3);font-size:10px;letter-spacing:.04em;margin-left:3px}
  .m-bar{height:2px;background:var(--rule-soft);position:relative}
  .m-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.62;display:block}
  .m-f{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3);letter-spacing:.01em;display:none}
  .metrics.show-f .m-f{display:block}

  .inputs{font-family:"IBM Plex Mono",monospace;font-size:9.5px;line-height:1.7;color:var(--ink-3);letter-spacing:.02em}
  .inputs b{color:var(--ink-2);font-weight:500}
  /* location inputs with the level each came from (US-TX / US) and its confidence */
  .prov{display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;border-top:1px solid var(--rule-soft);padding-top:6px;
        font-family:"IBM Plex Mono",monospace;font-size:9.5px;line-height:1.75;color:var(--ink-3);letter-spacing:.02em}
  .prov b{color:var(--ink-2);font-weight:500}
  .prov .lv{text-align:right;white-space:nowrap}
  .prov a{color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
  .prov a:hover{color:var(--ink-2)}
  .prov .sample{color:var(--warn)}
  .chain{display:flex;flex-direction:column;gap:4px}
  .chain .lk{display:flex;gap:8px;align-items:baseline;font-size:14px;color:var(--ink-2);cursor:pointer;background:none;border:0;padding:1px 0;text-align:left;width:100%}
  .chain .lk .ar{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--accent);width:11px;flex:0 0 11px}
  .chain .lk:hover{color:var(--ink)}
  .p-actions{margin-top:auto;padding-top:12px;border-top:1px solid var(--rule-soft);display:flex;gap:16px;flex-wrap:wrap}
  .p-actions button{
    background:none;border:0;padding:0;cursor:pointer;color:var(--ink-2);
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
    border-bottom:1px solid var(--rule)
  }
  .p-actions button:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .p-actions button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}

  /* compare */
  .cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .cmp-col{display:flex;flex-direction:column;gap:8px;min-width:0}
  .cmp-col.b .p-name{color:var(--warn)}
  .cmp-hint{font-size:13.5px;font-style:italic;color:var(--ink-3);border:1px dashed var(--rule);padding:10px;line-height:1.4}
  /* ---------- connections diagram ---------- */
  .viz{position:absolute;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column}
  .viz[hidden]{display:none}
  .viz-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 48px 10px 16px;
           border-bottom:1px solid var(--rule);background:var(--surface);position:relative}
  .viz-key{display:flex;flex-wrap:wrap;gap:6px}
  .viz-key button{
    display:inline-flex;align-items:center;gap:7px;background:none;border:1px solid var(--rule);padding:4px 9px;cursor:pointer;
    font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);
    transition:opacity .15s ease
  }
  .viz-key button:hover{color:var(--ink);border-color:var(--ink-3)}
  .viz-key button[aria-pressed="false"]{opacity:.4}
  .viz-key svg{flex:0 0 auto}
  .viz-note{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
            letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .viz-used{display:inline-block;width:2px;height:11px;background:var(--accent)}
  .viz-reset{background:none;border:0;border-bottom:1px solid var(--rule);padding:3px 0;cursor:pointer;
             font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
  .viz-reset:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .viz-close{position:absolute;right:14px;top:50%;transform:translateY(-50%)}
  .viz-canvas{flex:1 1 auto;min-height:0;overflow:auto;padding:14px 16px 20px}
  .viz-canvas svg{display:block;width:100%;min-width:1000px;height:auto}
  .viz .choke{fill:var(--choke)}
  .viz .colh{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;fill:var(--ink-3)}
  .viz .band{stroke:var(--rule);stroke-dasharray:2 4}
  .viz .vn rect.box{fill:var(--surface);stroke:var(--rule);stroke-width:1}
  .viz .vn .t{font-family:"Source Serif 4",Georgia,serif;font-size:13.5px;font-weight:600;fill:var(--ink-2)}
  .viz .vn .s{font-family:"Source Serif 4",Georgia,serif;font-size:11px;font-style:italic;fill:var(--ink-3)}
  .viz .vn .cnt{font-family:"IBM Plex Mono",monospace;font-size:10px;fill:var(--accent);text-anchor:end}

  /* --------------------------- data center size --------------------------
     Data centers vary far more in size than any other node, so their power
     is the user's to set, within bounds a little wider than the sourced
     typical range (training 200–1,200 MW, inference 10–100 MW). The slider
     is logarithmic, so both ends get useful resolution.
     ----------------------------------------------------------------------- */
  var SIZE_RANGE = {'dc-training': [50, 2000], 'dc-inference': [5, 200]};
  function niceMW(v){ return v < 20 ? Math.round(v) : v < 200 ? Math.round(v / 5) * 5 : Math.round(v / 10) * 10; }
  function sizeBlock(site, onDrag){
    var rng = SIZE_RANGE[site.type];
    if (!rng) return null;
    var T = NODE_TYPES && NODE_TYPES.types[site.type], typical = T && okValue(T.p) ? T.p.v : null;
    var lo = Math.log(rng[0]), hi = Math.log(rng[1]), STEPS = 400;
    // the exact value is stored so arrow keys never snap back; rounding is display-only
    function toMW(i){ return Math.exp(lo + (hi - lo) * i / STEPS); }
    function toStep(mw){ return Math.round((Math.log(mw) - lo) / (hi - lo) * STEPS); }

    var d = el('div','size');
    d.appendChild(el('span','eyebrow','Size'));
    var input = el('input'); input.type = 'range'; input.min = 0; input.max = STEPS; input.step = 1;
    input.value = toStep(Math.min(rng[1], Math.max(rng[0], site.in.p)));
    input.setAttribute('aria-label', 'Data center IT power, megawatts');
    d.appendChild(input);
    var out = el('span','v');
    function show(v){
      var mw = niceMW(v);
      out.textContent = (mw >= 1000 ? +(mw / 1000).toFixed(2) : mw) + ' ';
      out.appendChild(unitEl(mw >= 1000 ? 'GW' : 'MW', ''));
      input.setAttribute('aria-valuetext', mw + ' megawatts');
    }
    show(site.in.p);
    d.appendChild(out);

    var foot = el('div','rng');
    foot.appendChild(el('span', null, rng[0] + ' MW'));
    if (typical != null){
      var reset = el('button', null, site.in.p === typical ? 'typical ' + typical + ' MW' : '↺ typical ' + typical + ' MW');
      reset.type = 'button';
      reset.disabled = site.in.p === typical;
      reset.title = 'Back to the sourced typical size for this type';
      reset.addEventListener('click', function(ev){ ev.stopPropagation(); site.in.p = typical; refresh(); });
      foot.appendChild(reset);
    }
    foot.appendChild(el('span', null, (rng[1] >= 1000 ? rng[1] / 1000 + ' GW' : rng[1] + ' MW')));
    d.appendChild(foot);

    input.addEventListener('input', function(){
      site.in.p = toMW(+input.value);
      show(site.in.p);
      onDrag();
    });
    // on release, redraw everything the size feeds (bars scale, deltas, compare)
    input.addEventListener('change', function(){
      refresh();
      var again = pbody.querySelector('.size input'); if (again) again.focus();
    });
    input.addEventListener('click', function(ev){ ev.stopPropagation(); });
    return d;
  }

  /* ------------------------- compare locations ---------------------------
     The same node — same type and inputs — at reference places on other
     grids: carbon, water and air against where it is now. Each place is a
     real point, so it takes its own cell (people nearby) and grid, exactly
     as a dropped point would.
     ----------------------------------------------------------------------- */
  var CMP_PLACES = [
    {n:'Ashburn, VA',   iso1:'US', iso2:'US-VA', c:[-77.49, 39.04], country:'United States'},
    {n:'Abilene, TX',   iso1:'US', iso2:'US-TX', c:[-99.73, 32.45], country:'United States'},
    {n:'The Dalles, OR',iso1:'US', iso2:'US-OR', c:[-121.18, 45.60], country:'United States'},
    {n:'Dublin',        iso1:'IE', iso2:null,    c:[-6.26, 53.35],  country:'Ireland'},
    {n:'Luleå',         iso1:'SE', iso2:null,    c:[22.15, 65.58],  country:'Sweden'},
    {n:'Frankfurt',     iso1:'DE', iso2:null,    c:[8.68, 50.11],   country:'Germany'},
    {n:'Hsinchu',       iso1:'TW', iso2:null,    c:[121.00, 24.78], country:'Taiwan'},
    {n:'Singapore',     iso1:'SG', iso2:null,    c:[103.70, 1.33],  country:'Singapore'},
    {n:'Tokyo',         iso1:'JP', iso2:null,    c:[139.65, 35.68], country:'Japan'},
    {n:'Mumbai',        iso1:'IN', iso2:'IN-MH', c:[72.88, 19.08],  country:'India'},
    {n:'São Paulo',     iso1:'BR', iso2:null,    c:[-46.63, -23.55],country:'Brazil'}
  ];
  var cmpResolved = null;   // [{n, c, r, pop}] once locale data and cells are in
  function resolveCmpPlaces(){
    return Promise.all(CMP_PLACES.map(function(p){
      return cellFor(p.c).then(function(cell){
        return {n: p.n, c: p.c, r: regionAt(p.iso1, p.iso2, p.c, p.country, cell),
                pop: cell && cell.vals.pop ? cell.vals.pop.v : null};
      });
    })).then(function(list){
      list = list.filter(function(p){ return p.r; });
      if (LOCALES && CELL_INDEX) cmpResolved = list;   // cache only the sourced answer
      return list;
    });
  }

  // A collapsible panel section: a › eyebrow header, closed by default, open
  // or closed remembered per viewer under atlas.<key>.
  var openSections = {};
  function disclosure(key, label, title){
    if (!(key in openSections)){
      var v = null;
      try { v = localStorage.getItem('atlas.' + key); } catch (e) {}
      openSections[key] = v === 'open';
    }
    var open = openSections[key], wrap = el('div');
    var head = el('button','locs-head'); head.type = 'button';
    head.dataset.key = key;
    head.setAttribute('aria-expanded', String(open));
    head.appendChild(el('span','car','›'));
    head.appendChild(el('span','eyebrow', label));
    if (title) head.title = title;
    head.addEventListener('click', function(ev){
      ev.stopPropagation();
      openSections[key] = !open;
      try { localStorage.setItem('atlas.' + key, open ? 'closed' : 'open'); } catch (e) {}
      renderPanel();
      var h = pbody.querySelector('.locs-head[data-key="' + key + '"]'); if (h) h.focus();
    });
    wrap.appendChild(head);
    return {wrap: wrap, open: open};
  }

  // Location inputs with their level, confidence and source, folded away.
  function provSection(R){
    if (!R || !R.loc) return null;
    var d = disclosure('locationInputs', 'Location inputs · ' + R.n, 'Each input with where it came from and how sure it is');
    if (d.open){ var pb = provBlock(R); pb.style.marginTop = '6px'; d.wrap.appendChild(pb); }
    return d.wrap;
  }

  function locsBlock(site){
    var d = disclosure('compareLocations', 'Compare locations', 'This node, with the same inputs, at other places');
    var wrap = d.wrap;
    if (!d.open) return wrap;

    var grid = el('div','locs');
    wrap.appendChild(grid);
    if (!cmpResolved){
      grid.appendChild(el('span','foot','Loading places…'));
      resolveCmpPlaces().then(function(list){
        if (!cmpResolved) cmpResolved = list;   // offline: use the fallback answer for now
        if (state.selected === site.id) renderPanel();
      });
      return wrap;
    }

    var me = metrics(site, state.year);
    function variant(p){
      var s = Object.assign({}, site, {r: p.r, in: Object.assign({}, site.in)});
      if (p.pop != null) s.in.pop = p.pop;
      return metrics(s, state.year);
    }
    function pct(a, b){ return b ? (a - b) / b * 100 : 0; }
    function deltaEl(d){
      var cls = Math.abs(d) < 0.5 ? '' : d < 0 ? 'lo' : 'hi';
      // past double, a multiple reads better than +1210%
      // past ten times, the exact multiple mostly reflects a near-zero "here"
      return el('span', cls, Math.abs(d) < 0.5 ? '±0%' : d >= 900 ? '×10+' : d >= 100 ? '×' + (1 + d / 100).toFixed(1)
                           : (d > 0 ? '+' : '−') + Math.abs(d).toFixed(0) + '%');
    }
    ['', 'Carbon', 'Water', 'Air'].forEach(function(h){ grid.appendChild(el('span','h', h)); });

    var hereName = site.n + ' (here)';
    grid.appendChild(el('span','me', hereName));
    [[fCarbon(me.C)], [fWater(me.W)], [fAir(me.Araw)]].forEach(function(x){
      var s = el('span','me', x[0][0] + ' '); s.appendChild(unitEl(x[0][1], '')); grid.appendChild(s);
    });

    cmpResolved
      .filter(function(p){ return d3.geoDistance(p.c, site.c) * 6371 > 50; })   // skip where it already is
      .map(function(p){ var m = variant(p); return {p: p, dC: pct(m.C, me.C), dW: pct(m.W, me.W), dA: pct(m.Araw, me.Araw)}; })
      .sort(function(a, b){ return a.dC - b.dC; })
      .forEach(function(x){
        grid.appendChild(el('span', null, x.p.n));
        grid.appendChild(deltaEl(x.dC));
        grid.appendChild(deltaEl(x.dW));
        grid.appendChild(deltaEl(x.dA));
      });
    var foot = el('span','foot', 'Same node and inputs on each place’s grid, water and population.' +
      (me.R.loc ? '' : ' This site still runs on sample grid values, so the gaps are indicative.'));
    grid.appendChild(foot);
    return wrap;
  }

  // Under a scenario: what changed for this site against baseline.
  function scenarioNote(site){
    if (SCEN.k === 'base') return null;
    var now = metrics(site, state.year), was = metrics(site, state.year, SCENARIOS[0]);
    var parts = [['energy','E'], ['carbon','C'], ['water','W'], ['air','Araw']].map(function(p){
      var d = was[p[1]] ? (now[p[1]] - was[p[1]]) / was[p[1]] * 100 : 0;
      return Math.abs(d) < 0.5 ? null : p[0] + ' ' + (d > 0 ? '+' : '−') + Math.abs(d).toFixed(0) + '%';
    }).filter(Boolean);
    var d = el('div','inputs');
    d.appendChild(el('span','scen-note', 'Scenario · ' + SCEN.label));
    d.appendChild(document.createElement('br'));
    d.appendChild(document.createTextNode(parts.length ? 'vs baseline · ' + parts.join(' · ') : 'No change for this site'));
    return d;
  }

  function singleView(site){
    pbody.innerHTML = '';
    var eb = el('span','eyebrow');
    eb.innerHTML = glyphHTML(site.s, 12) + ' ';
    eb.appendChild(document.createTextNode(stageLabel[site.s]));
    pbody.appendChild(eb);
    pbody.appendChild(el('h2','p-name', site.n));
    pbody.appendChild(el('div','p-place', site.p + ' · ' + fmtCoord(site.c)));
    // added nodes describe their place from its data; built-in sites keep
    // their note on what the place does, with the profile under it
    var prof = profileOf(site);
    var note = el('p','p-note', site.added ? prof || site.note : site.note); note.style.marginTop = '12px';
    pbody.appendChild(note);
    if (prof && !site.added){
      var pp = el('p','p-note p-prof', prof); pp.style.marginTop = '6px';
      pbody.appendChild(pp);
    }

    var lbl = el('div','sec-lbl'); lbl.style.marginTop = '14px';
    lbl.appendChild(el('span','eyebrow','Per year · ' + state.year));
    var fbtn = el('button', null, 'formulas');
    fbtn.type='button'; fbtn.setAttribute('aria-pressed', String(state.formulas));
    fbtn.title = 'Show the equation behind each value · bars are scaled against the largest site';
    fbtn.addEventListener('click', function(){ state.formulas = !state.formulas; renderPanel(); });
    lbl.appendChild(fbtn);
    pbody.appendChild(lbl);

    var mb = metricBlock(site);
    pbody.appendChild(mb);
    var sz = sizeBlock(site, function(){   // while dragging, redraw only the bars
      var nb = metricBlock(site); pbody.replaceChild(nb, mb); mb = nb;
    });

    var sn = scenarioNote(site);
    if (sn){ sn.style.marginTop = '8px'; pbody.appendChild(sn); }
    var lb = locsBlock(site); lb.style.marginTop = '12px';
    pbody.appendChild(lb);
    var ib = inputsBlock(site);
    if (ib){ ib.style.marginTop = '12px'; pbody.appendChild(ib); }
    var ps = provSection(REGIONS[site.r]);
    if (ps){ ps.style.marginTop = '12px'; pbody.appendChild(ps); }

    var ch = chainBlock(site);
    if (ch){

  function compareView(a, b){
    pbody.innerHTML = '';
    var head = el('div','cmp-grid');
    [[a,'a'],[b,'b']].forEach(function(pair){
      var col = el('div','cmp-col ' + pair[1]);
      if (!pair[0]){
        col.appendChild(el('span','eyebrow','Region B'));
        col.appendChild(el('div','cmp-hint','Click any site on the map to compare it against ' + a.n + '.'));
      } else {
        col.appendChild(el('span','eyebrow', stageLabel[pair[0].s]));
        var h = el('h2','p-name', pair[0].n); h.style.fontSize = '19px';
        col.appendChild(h);
        col.appendChild(el('div','p-place', pair[0].p));
      }
      head.appendChild(col);
    });
    pbody.appendChild(head);

    if (b){
      var ra = rows(a, state.year), rb = rows(b, state.year);
      var ma = metrics(a, state.year), mb = metrics(b, state.year);
      var raw = [[ma.E,mb.E],[ma.C,mb.C],[ma.W,mb.W],[ma.Araw,mb.Araw]];
      var grid = el('div','cmp-rows'); grid.style.marginTop = '14px';
      ra.forEach(function(r, i){
        var row = el('div','cmp-row');
        var av = el('span','a-v'); av.textContent = r.d[0];
        var k = el('span','k', r.k);
        var bv = el('span','b-v'); bv.textContent = rb[i].d[0];
        row.appendChild(av); row.appendChild(k); row.appendChild(bv);
        grid.appendChild(row);

        var pct = raw[i][0] === 0 ? 0 : ((raw[i][1] - raw[i][0]) / raw[i][0]) * 100;
        var dl = el('div','cmp-row');
        var sp = el('span','delta ' + (pct >= 0 ? 'up' : 'down'));
        sp.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(0) + '% in ' + b.n;
        sp.style.gridColumn = '1 / -1';
        sp.style.textAlign = 'right';
        dl.style.borderBottom = 'none'; dl.style.padding = '0 0 6px';
        dl.appendChild(sp);
        grid.appendChild(dl);
      });
      pbody.appendChild(grid);

      var foot = el('div','inputs'); foot.style.marginTop = '10px';
      foot.innerHTML = '<b>' + ma.R.n + '</b> ' + ma.ci.toFixed(0) + ' g/kWh · WUE ' + ma.R.wue.toFixed(1) +
                       '<br><b>' + mb.R.n + '</b> ' + mb.ci.toFixed(0) + ' g/kWh · WUE ' + mb.R.wue.toFixed(1);
      pbody.appendChild(foot);
    }
  }

  function renderPanel(){ drawPanel(); syncPadding(); }

  // Keep the map centred in the part the panel leaves visible.
  var padLeft = 0;
  function syncPadding(){
    var w = !panel.classList.contains('open') ? 0
          : Math.min(panel.classList.contains('wide') ? 452 : 302, box.clientWidth * 0.88);
    if (w === padLeft) return;
    padLeft = w;
    map.easeTo({padding: {left: w, top: 0, right: 0, bottom: 0}, duration: ready ? 400 : 0});
  }

  function drawPanel(){
    var id = state.selected;
    if (!id){ panel.classList.remove('open','wide'); return; }
    if (cityById[id]){
      panel.classList.add('open'); panel.classList.remove('wide');
      cityView(cityById[id]);
      pactions.innerHTML = ''; pactions.style.display = 'none';
      return;
    }
    pactions.style.display = '';
    var a = byId[id];
    if (!a){ panel.classList.remove('open','wide'); return; }
    panel.classList.add('open');
    panel.classList.toggle('wide', state.comparing);
    if (state.comparing) compareView(a, state.compare ? byId[state.compare] : null);
    else singleView(a);

    pactions.innerHTML = '';
    var cb = el('button', null, state.comparing ? 'Exit' : 'Compare');
    cb.type='button'; cb.setAttribute('aria-pressed', String(state.comparing));
    cb.addEventListener('click', function(ev){ ev.stopPropagation(); toggleCompare(); });
    pactions.appendChild(cb);
    var ub = el('button', null, 'Upstream');
    ub.type='button';
    ub.addEventListener('click', function(ev){
      ev.stopPropagation();
      var up = FLOWS.filter(function(f){ return f[1]===state.selected && live(f[0]); });
      if (up.length) pick(up[0][0]);
    });
    pactions.appendChild(ub);
    var rb = el('button','danger','Remove');
    rb.type='button';
    rb.title = 'Removes the node and leaves the location on the map';
    rb.addEventListener('click', function(ev){ ev.stopPropagation(); removeNode(a); });
    pactions.appendChild(rb);
  }

  /* ------------------------ add and remove nodes ------------------------- */
  // A node starts from its facility type's typical inputs (data/node-types.json)
  // when there is one, else from the stage's sample set; either way it takes
  // the people within 100 km from its cell when that's known.
  function addNode(city, stage, typeId){
    var T = typeId && NODE_TYPES ? NODE_TYPES.types[typeId] : null, D = DEFAULT_INPUTS[stage];
    function tv(k){ return T && okValue(T[k]) ? T[k].v : D[k]; }
    var cellPop = city.cell && city.cell.vals.pop ? city.cell.vals.pop.v : null;
    var site = {
      id: city.id, n: city.n, p: city.p, s: stage, c: city.c, r: city.r,
      note: T ? 'Added by hand · typical inputs for a ' + T.n.toLowerCase() + '.'
              : 'Added by hand · starting from sample inputs for ' + stageLabel[stage].toLowerCase() + '.',
      in: {p: tv('p'), u: tv('u'), pue: tv('pue'), g: tv('g'), pop: cellPop != null ? cellPop : D.pop},
      popDefault: cellPop == null,
      type: T ? typeId : null, water: T && okValue(T.water) ? T.water.v : null,
      added: true, placed: city.placed, iso1: city.iso1, iso2: city.iso2, mid: city.mid, cell: city.cell
    };
    SITES = SITES.concat([site]);
    byId[site.id] = site;
    CITIES = CITIES.filter(function(c){ return c.id !== city.id; });
    delete cityById[city.id];
    if (!state.active[stage]){
      state.active[stage] = true;
      Array.prototype.forEach.call(stagesHost.children, function(b, i){
        if (STAGES[i].k === stage) b.setAttribute('aria-pressed','true');
      });
    }
    state.selected = site.id;
    refresh();
  }

  function removeNode(site){
    var city = {id:site.id, n:site.n, p:site.p, c:site.c, r:site.r, placed:site.placed,
                iso1:site.iso1, iso2:site.iso2, mid:site.mid, cell:site.cell};
    SITES = SITES.filter(function(x){ return x.id !== site.id; });
    delete byId[site.id];
    CITIES = CITIES.concat([city]);
    cityById[city.id] = city;
    if (state.compare === site.id) state.compare = null;
    state.comparing = false;
    state.selected = city.id;
    refresh();
  }

  // Location inputs for a locale-built region: value, the level it came from
  // (US-TX or US) and its confidence, linked to the source.
  // f formats the number, u is its unit (named on hover).
  var PROV_ROWS = [
    {k:'ci',  lbl:'CI',     u:'g/kWh', f:function(v){ return v.toFixed(0); }},
    {k:'fos', lbl:'Fossil', u:'%',     f:function(v){ return (v * 100).toFixed(0); }},
    {k:'dec', lbl:'Trend',  u:'%/yr',  f:function(v){ return (v >= 0 ? '−' : '+') + Math.abs(v * 100).toFixed(1); }},
    // climate estimate assuming a cooling tower: an upper bound where free cooling is used
    {k:'wue', lbl:'WUE',    u:'L/kWh', f:function(v){ return '≤ ' + v.toFixed(2); }},
    {k:'wue_disclosed', lbl:'Operator', u:'L/kWh', f:function(v){ return v.toFixed(2); }},
    {k:'ws',  lbl:'Stress', u:'0–1',   f:function(v){ return v.toFixed(2); }},
    {k:'pm25', lbl:'PM2.5', u:'µg/m³', f:function(v){ return v.toFixed(0); }},
    {k:'pop', lbl:'People', u:'≤100 km', f:function(v){ return fmtPop(v); }}
  ];
  function fmtPop(m){ return m >= 1 ? m.toFixed(1) + ' M' : m < 0.001 ? '< 1k' : Math.round(m * 1000) + 'k'; }
  function provBlock(R){
    if (!R || !R.loc) return null;
    var g = el('div','prov');
    PROV_ROWS.forEach(function(row){
      var x = R.loc[row.k];
      if (!x) return;
      g.appendChild(el('b', null, row.lbl));
      var val = el('span', null, row.f(x.v));
      if (row.u === '0–1') val.setAttribute('data-unit', '0–1');   // unitless scale: explain on the value
      else { if (row.u !== '%') val.appendChild(document.createTextNode(' ')); val.appendChild(unitEl(row.u, '')); }
      g.appendChild(val);
      var lv = el('span','lv' + (x.conf === 'sample' ? ' sample' : ''));
      var txt = (x.level === 'cell' ? 'local' : x.level) + ' · ' + x.conf;
      var src = sourceOf(x.src);
      if (src && src.url){
        var a = el('a', null, txt); a.href = src.url; a.target = '_blank'; a.rel = 'noopener';
        a.title = [src.title, x.year, x.basis, x.note].filter(Boolean).join(' · ');
        lv.appendChild(a);
      } else lv.textContent = txt;
      g.appendChild(lv);
    });
    if (R.loc.unused){
      var fmtOf = {}; PROV_ROWS.forEach(function(row){ fmtOf[row.k] = row; });
      var u = R.loc.unused, n = el('span', null,
        'Not used · ' + u[0].levelName + ' ' + u.map(function(x){
          var l = fmtOf[x.k].lbl;
          var r = fmtOf[x.k];
          return (l === l.toUpperCase() ? l : l.toLowerCase()) + ' ' + r.f(x.v) +
                 (r.u === '%' ? '%' : r.u === '0–1' ? '' : ' ' + r.u);
        }).join(', ') + ' — its grid data is incomplete, so the grid comes from ' + R.loc.ci.levelName + '.');
      n.style.gridColumn = '1 / -1';
      n.style.marginTop = '3px';
      g.appendChild(n);
    }
    return g;
  }

  // A short description written from the place's own values, so it reads the
  // same for a curated site and a point dropped a minute ago. Only sourced
  // values are described; sample or defaulted ones are left out.
  function profileOf(d){
    var R = REGIONS[d.r];
    if (!R || !R.loc || !R.loc.ci) return null;
    var L = R.loc, out = [], ci = L.ci.v;
    function real(x){ return !!x && x.conf !== 'sample'; }
    // country averages by code (US), subdivisions by name (Texas)
    function avg(x){ return (x.level.length === 2 ? x.level : x.levelName) + ' average'; }
    out.push((ci < 100 ? 'Very clean grid' : ci < 250 ? 'Low-carbon grid' : ci < 450 ? 'Mixed grid'
             : ci < 650 ? 'Fossil-heavy grid' : 'Coal-heavy grid') +
             ' (' + L.ci.levelName + ', ' + Math.round(ci) + ' g/kWh).');
    if (real(L.pop)) out.push(L.pop.v < 0.001 ? 'Almost no one lives within 100 km.'
                            : L.pop.v < 0.5 ? 'Sparsely populated: ' + fmtPop(L.pop.v) + ' people within 100 km.'
                            : fmtPop(L.pop.v) + ' people within 100 km.');
    if (real(L.ws)){
      var ws = L.ws.v;
      out.push((ws >= .8 ? 'Extremely high' : ws >= .6 ? 'High' : ws >= .4 ? 'Medium-high' : ws >= .2 ? 'Low-medium' : 'Low') +
               ' water stress' + (L.ws.level === 'cell' ? ' in its river basin' : ' (' + avg(L.ws) + ')') + '.');
    }
    // cooling water comes from local climate only at the cell level
    if (real(L.wue) && L.wue.level === 'cell'){
      if (L.wue.v >= 1.4) out.push('Warm, humid climate: evaporative cooling uses more water.');
      else if (L.wue.v <= 1.2) out.push('Cool climate: little cooling water needed.');
    }
    if (real(L.pm25)){
      var pm = L.pm25.v;
      out.push((pm > 35 ? 'Very poor' : pm > 15 ? 'Poor' : pm > 5 ? 'Moderate' : 'Clean') +
               ' air (PM2.5 ' + Math.round(pm) + ' µg/m³' + (L.pm25.level === 'cell' ? '' : ', ' + avg(L.pm25)) + ').');
    }
    return out.join(' ');
  }

  var addStage = null;   // {city, stage} while a stage's facility types are open
  function cityView(city){
    var R = REGIONS[city.r];
    pbody.innerHTML = '';
    pbody.appendChild(el('span','eyebrow','Unassigned location'));
    pbody.appendChild(el('h2','p-name', city.n));
    pbody.appendChild(el('div','p-place', city.p + ' · ' + fmtCoord(city.c)));
    var prof = profileOf(city);
    var note = el('p','p-note', !R ? 'No grid data for this place yet, so it can’t be modelled.'
                              : prof || 'No node here yet. Add one to model it on the ' + R.n + ' grid.');
    note.style.marginTop = '12px';
    pbody.appendChild(note);
    if (!R) return;

    // Two levels: the five stages, then the chosen stage's facility types.
    // Without data/node-types.json a stage adds its sample node directly.
    function typesOf(stage){
      return NODE_TYPES ? Object.keys(NODE_TYPES.types).filter(function(id){ return NODE_TYPES.types[id].stage === stage; }) : [];
    }
    var open = addStage && addStage.city === city.id && typesOf(addStage.stage).length ? addStage.stage : null;
    var lbl = el('span','eyebrow', open ? 'Add node · ' + stageLabel[open] : 'Add node'); lbl.style.marginTop = '14px';
    pbody.appendChild(lbl);
    var row = el('div','addrow'); row.style.marginTop = '6px';
    function choice(glyph, label, mark, run, cls){
      var b = el('button', cls); b.type = 'button';
      if (glyph) b.innerHTML = glyphHTML(glyph, 15);
      b.appendChild(el('span', null, label));
      b.appendChild(el('span','plus', mark));
      b.addEventListener('click', function(ev){ ev.stopPropagation(); run(); });
      row.appendChild(b);
    }
    function focusFirst(sel){ var b = pbody.querySelector(sel); if (b) b.focus(); }
    if (!open){
      STAGES.forEach(function(st){
        var types = typesOf(st.k);
        choice(st.k, st.label, types.length ? '›' : '+', function(){
          if (!types.length){ addNode(city, st.k); return; }
          addStage = {city: city.id, stage: st.k};
          renderPanel();
          focusFirst('.addrow button.type');
        });
      });
    } else {
      choice(null, '‹ All stages', '', function(){
        addStage = null;
        renderPanel();
        focusFirst('.addrow button');
      }, 'back');
      typesOf(open).forEach(function(id){
        choice(open, NODE_TYPES.types[id].n, '+', function(){ addStage = null; addNode(city, open, id); }, 'type');
      });
    }
    pbody.appendChild(row);

    var foot = el('div','inputs'); foot.style.marginTop = '10px';
    var ps = provSection(R);
    if (ps){ ps.style.marginTop = '14px'; pbody.appendChild(ps); return; }
    foot.innerHTML = 'Starts from sample inputs · <b>CI</b> ' +
      ciFor(city.r, state.year).toFixed(0) + ' g/kWh · <b>WUE</b> ' +
      R.wue.toFixed(1) + ' L/kWh';
    pbody.appendChild(foot);
  }

  function toggleCompare(){
    state.comparing = !state.comparing;
    if (!state.comparing) state.compare = null;
    drawFlows(); renderPanel();
  }

  function pick(id){
    hideTip();
    if (cityById[id]){ state.comparing = false; state.compare = null; state.selected = id; }
    else if (state.comparing && state.selected && id !== state.selected){ state.compare = id; }
    else { state.selected = id; }
    drawFlows(); renderPanel();
  }
  function select(id){
    state.selected = id;
    if (!id) state.compare = null;
    drawFlows(); renderPanel();
  }

  /* ----------------------------- context menu ----------------------------
     Right-click (or long-press) the map for actions on whatever is under
     the pointer: a site, a placeholder, or open ground.
     ----------------------------------------------------------------------- */
  var ctx = document.getElementById('ctx');
  var toast = document.getElementById('toast');
  var glHost = document.getElementById('gl');
  var ctxOpenedAt = 0;

  // 12px line icons, drawn like the search glyph.
  var CI = {
    open:    'M1.5 2.5h9v7h-9z M4.5 2.5v7',
    add:     'M6 2v8 M2 6h8',
    compare: 'M1.5 4h8.5 M8 2l2 2-2 2 M10.5 8H2 M4 6l-2 2 2 2',
    up:      'M6 10.5V2 M3 5l3-3 3 3',
    zoom:    'M8.4 5a3.4 3.4 0 1 1-6.8 0a3.4 3.4 0 1 1 6.8 0 M7.6 7.6l2.9 2.9 M5 3.5v3 M3.5 5h3',
    copy:    'M4 4h6.5v6.5H4z M2 8V1.5h6.5',
    remove:  'M3 3l6 6 M9 3l-6 6'
  };
  function ctxIcon(k){
    return '<svg class="ci" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="' + CI[k] + '"></path></svg>';
  }

  function closeCtx(){
    if (ctx.hidden) return;
    ctx.hidden = true; ctx.innerHTML = '';
  }

  function openCtx(x, y, head, items, viaKeyboard){
    hideTip(); closeLayer(); closeResults();
    ctx.innerHTML = '';
    var h = el('div','ctx-head');
    if (head.eyebrow){
      var eb = el('span','eyebrow');
      eb.innerHTML = head.glyph || '';
      eb.appendChild(document.createTextNode(head.eyebrow));
      h.appendChild(eb);
    }
    h.appendChild(el('div','ctx-name', head.name));
    if (head.sub) h.appendChild(el('div','ctx-sub', head.sub));
    ctx.appendChild(h);
    ctx.setAttribute('aria-label', head.name);

    items.forEach(function(it){
      if (it === '-'){ ctx.appendChild(el('div','ctx-sep')); return; }
      var b = el('button', it.danger ? 'danger' : null);
      b.type = 'button'; b.tabIndex = -1;
      b.setAttribute('role','menuitem');
      b.innerHTML = ctxIcon(it.icon);
      b.appendChild(el('span','ctx-lbl', it.label));
      if (it.hint) b.appendChild(el('span','ctx-hint', it.hint));
      if (it.disabled) b.setAttribute('aria-disabled','true');
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        if (it.disabled) return;
        closeCtx(); it.run();
      });
      ctx.appendChild(b);
    });

    ctx.hidden = false;
    ctxOpenedAt = Date.now();
    // keep it inside the map; open upward near the bottom edge
    var W = box.clientWidth, H = box.clientHeight, w = ctx.offsetWidth, hh = ctx.offsetHeight;
    var left = Math.max(8, Math.min(x, W - w - 8));
    var up = y + hh > H - 8;
    var top = up ? Math.max(8, y - hh) : y;
    ctx.style.left = left + 'px'; ctx.style.top = top + 'px';
    ctx.style.transformOrigin = (x - left) + 'px ' + (up ? hh + 'px' : '0');
    var first = ctx.querySelector('button:not([aria-disabled])');
    (viaKeyboard && first ? first : ctx).focus({preventScroll: true});
  }

  ctx.addEventListener('keydown', function(e){
    var btns = Array.prototype.filter.call(ctx.querySelectorAll('button'), function(b){
      return !b.hasAttribute('aria-disabled');
    });
    var i = btns.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      var step = e.key === 'ArrowDown' ? 1 : -1;
      var n = i < 0 ? (step > 0 ? 0 : btns.length - 1) : (i + step + btns.length) % btns.length;
      if (btns[n]) btns[n].focus();
    } else if (e.key === 'Home' || e.key === 'End'){
      e.preventDefault();
      if (btns.length) btns[e.key === 'Home' ? 0 : btns.length - 1].focus();
    } else if (e.key === 'Escape' || e.key === 'Tab'){
      e.preventDefault(); e.stopPropagation(); closeCtx();
    }
  });
  ctx.addEventListener('click', function(e){ e.stopPropagation(); });
  ctx.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  var toastTimer = null;
  function showToast(text){
    toast.textContent = text;
    toast.style.marginLeft = (padLeft / 2) + 'px';   // centre in the visible map
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('on'); }, 1600);
  }

  function zoomItem(c){
    return {icon:'zoom', label:'Zoom to', run:function(){ focusOn(c, 5.5); }};
  }
  function copyItem(c){
    return {icon:'copy', label:'Copy coordinates', run:function(){
      var text = c[1].toFixed(4) + ', ' + c[0].toFixed(4);
      var done = function(){ showToast('Copied ' + fmtCoord(c)); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done, function(){ showToast(text); });
      } else showToast(text);
    }};
  }

  function siteItems(d){
    var cur = (state.selected && byId[state.selected] && state.selected !== d.id) ? byId[state.selected] : null;
    var up = FLOWS.filter(function(f){ return f[1] === d.id && live(f[0]); });
    var items = [{icon:'open', label:'Open details', run:function(){ pick(d.id); }}];
    if (cur) items.push({icon:'compare', label:'Compare with ' + cur.n, run:function(){
      state.comparing = true; state.compare = d.id;
      drawFlows(); renderPanel();
    }});
    if (up.length) items.push({icon:'up', label:'Go upstream', hint: byId[up[0][0]].n, run:function(){
      pick(up[0][0]); focusOn(byId[up[0][0]].c);
    }});
    items.push('-', zoomItem(d.c), copyItem(d.c), '-',
      {icon:'remove', label:'Remove node', danger:true, run:function(){ removeNode(d); }});
    return items;
  }

  function cityItems(d){
    var items = [{icon:'add', label:'Add node…', run:function(){ pick(d.id); }},
                 '-', zoomItem(d.c), copyItem(d.c)];
    if (d.placed) items.push('-', {icon:'remove', label:'Remove location', danger:true, run:function(){ dropCity(d); }});
    return items;
  }

  function groundItems(c, country){
    var r = country ? regionAt(country.iso, null, c, country.name) : null;
    var items = [];
    if (country) items.push({icon:'add', label:'Add node here', disabled: !r, hint: r ? null : 'No grid data',
                             run:function(){ placeAt(c, country, r); }}, '-');
    items.push({icon:'zoom', label:'Zoom in here', run:function(){
      map.easeTo({center: c, zoom: Math.min(map.getZoom() + 2, 10), duration: still() ? 0 : 600});
    }}, copyItem(c));
    return items;
  }

  /* ------------------------------- locales -------------------------------
     Sourced location inputs keyed by ISO code, from data/locales.json. The
     database side builds that file; the shape is docs/locale-contract.md.
     Without it (offline, or a file we can't read) points fall back to the
     sample COUNTRY table and the curated REGIONS.
     ----------------------------------------------------------------------- */
  var LOCALE_KEYS = ['ci', 'fos', 'dec', 'wue', 'ws', 'wue_disclosed', 'pm25', 'pop'];
  // India's 2023 ISO codes, in case Mapbox adopts them; the data keeps the old ones.
  var ISO2_ALIAS = {'IN-TS':'IN-TG', 'IN-CG':'IN-CT', 'IN-OD':'IN-OR', 'IN-UK':'IN-UT'};
  var LOCALES = null, NODE_TYPES = null, CELL_INDEX = null;
  function getJSON(url){
    return fetch(url).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
  }
  // Everything the database side produces; each file is optional.
  function loadData(){
    return Promise.all([
      getJSON('data/locales.json').then(function(d){ if (d && d.v === 1 && d.countries) LOCALES = d; }),
      getJSON('data/node-types.json').then(function(d){ if (d && d.v === 1 && d.types) NODE_TYPES = d; }),
      getJSON('data/cells/index.json').then(function(d){
        if (!d || d.v !== 1 || !Array.isArray(d.tiles)) return;
        CELL_INDEX = {}; d.tiles.forEach(function(t){ CELL_INDEX[t] = true; });
        CELL_ABSENT = d.absent && typeof d.absent === 'object' ? d.absent : null;
      })
    ]).then(localizeBuiltIns);
  }

  // Built-in sites and candidate locations on the same data as a searched
  // city: inputs from the facility type, people nearby from the cell, location
  // values cell → subdivision → country. Whatever is missing keeps the inline
  // sample values, so the page still works offline.
  function localizeBuiltIns(){
    var list = SITES.concat(CITIES).filter(function(s){ return SITE_META[s.id] && !s.added && !s.placed; });
    return Promise.all(list.map(function(s){
      return cellFor(s.c).then(function(cell){
        var m = SITE_META[s.id], T = m[0] && NODE_TYPES ? NODE_TYPES.types[m[0]] : null;
        s.iso1 = m[1]; s.iso2 = m[2] || null; s.cell = cell;
        s.r = regionAt(m[1], s.iso2, s.c, null, cell) || s.r;
        if (s.s && T && ['p', 'u', 'pue', 'g'].every(function(k){ return okValue(T[k]); })){
          s.type = m[0];
          s.in = {p: T.p.v, u: T.u.v, pue: T.pue.v, g: T.g.v,
                  pop: cell && cell.vals.pop ? cell.vals.pop.v : s.in.pop};
          s.water = okValue(T.water) ? T.water.v : null;
        }
      });
    })).then(refresh);
  }
  function okValue(x){ return !!x && typeof x.v === 'number' && isFinite(x.v) && !!x.conf; }

  /* -------------------------------- cells --------------------------------
     Location values on a 0.25° grid — people within 100 km, cooling water
     from local climate, basin water stress, PM2.5 — in 10° tiles under
     data/cells/. Fetched per tile, once, only for tiles the index lists.
     ----------------------------------------------------------------------- */
  var CELL_KEYS = ['pop', 'wue', 'ws', 'pm25'];
  var cellTiles = {};
  // What a cell missing from the tiles means, per key, when the index says
  // (pop: fewer than 500 people within 100 km). Without it a missing cell is unknown.
  var CELL_ABSENT = null;
  function absentCell(key){
    var vals = {};
    Object.keys(CELL_ABSENT || {}).forEach(function(k){
      var x = CELL_ABSENT[k];
      if (CELL_KEYS.indexOf(k) >= 0 && okValue(x))
        vals[k] = {v: x.v, conf: x.conf, src: x.src, year: x.year, note: x.note, level: 'cell', levelName: 'this location'};
    });
    return Object.keys(vals).length ? {key: key, vals: vals} : null;
  }
  function cellCentre(x){ return (Math.floor(x / 0.25) * 0.25 + 0.125).toFixed(3); }
  // → Promise of {key, vals: {k: {v, conf, src, year, note, level: 'cell'}}} or null
  function cellFor(c){
    var tile = Math.floor(c[1] / 10) * 10 + '_' + Math.floor(c[0] / 10) * 10;
    var key = cellCentre(c[1]) + ',' + cellCentre(c[0]);
    if (!CELL_INDEX) return Promise.resolve(null);
    if (!CELL_INDEX[tile]) return Promise.resolve(absentCell(key));
    if (!cellTiles[tile]) cellTiles[tile] = getJSON('data/cells/' + tile + '.json');
    return cellTiles[tile].then(function(t){
      if (!t || t.v !== 1 || !t.cells || !Array.isArray(t.keys)) return null;
      var row = t.cells[key], vals = {};
      if (!row) return absentCell(key);
      t.keys.forEach(function(k, i){
        var m = (t.meta || {})[k] || {}, v = row[i];
        if (CELL_KEYS.indexOf(k) < 0 || typeof v !== 'number' || !isFinite(v) || !m.conf) return;
        vals[k] = {v: v, conf: m.conf, src: m.src, year: m.year, note: m.note, level: 'cell', levelName: 'this location'};
      });
      return Object.keys(vals).length ? {key: key, vals: vals} : null;
    });
  }

  // The most specific value: cell → subdivision (US-TX) → country (US). Grid
  // values (ci, fos, dec) never come from cells and travel together: they
  // come from the most specific level that has all three, so carbon and air
  // never mix two grids. Local grid values passed over that way are kept in
  // `unused` for the panel.
  // Each comes back as {v, conf, src, year, basis, note, level, levelName}.
  var GRID_KEYS = ['ci', 'fos', 'dec'];
  function localeFor(iso1, iso2, cell){
    var out = {}, L = LOCALES, levels = [];
    iso2 = ISO2_ALIAS[iso2] || iso2;
    if (L && iso2 && L.subdivisions && L.subdivisions[iso2]) levels.push([iso2, L.subdivisions[iso2]]);
    if (L && iso1 && L.countries[iso1]) levels.push([iso1, L.countries[iso1]]);
    function take(k, lv){
      var x = lv[1][k];
      out[k] = {v: x.v, conf: x.conf, src: x.src, year: x.year, basis: x.basis, note: x.note,
                level: lv[0], levelName: lv[1].n};
    }
    var grid = levels.filter(function(lv){ return GRID_KEYS.every(function(k){ return okValue(lv[1][k]); }); })[0];
    LOCALE_KEYS.forEach(function(k){
      if (cell && cell.vals[k] && GRID_KEYS.indexOf(k) < 0){ out[k] = cell.vals[k]; return; }
      if (grid && GRID_KEYS.indexOf(k) >= 0){ take(k, grid); return; }
      for (var i = 0; i < levels.length; i++){
        if (okValue(levels[i][1][k])){ take(k, levels[i]); return; }
      }
    });
    if (grid) levels.slice(0, levels.indexOf(grid)).forEach(function(lv){
      GRID_KEYS.forEach(function(k){
        if (okValue(lv[1][k])) (out.unused = out.unused || []).push({k: k, v: lv[1][k].v, level: lv[0], levelName: lv[1].n});
      });
    });
    return out;
  }
  function sourceOf(id){ return LOCALES && LOCALES.sources && LOCALES.sources[id] || null; }

  // A grid region built from locale data. Missing keys get the old
  // country-average defaults and are marked sample, so the panel says so.
  function localeRegion(iso1, iso2, countryName, cell){
    var loc = localeFor(iso1, iso2, cell);
    if (!loc.ci) return null;
    iso2 = ISO2_ALIAS[iso2] || iso2;
    var fromSub = !!iso2 && LOCALE_KEYS.some(function(k){ return loc[k] && loc[k].level === iso2; });
    // a cell, or a subdivision with its own values or its own unused-values
    // note, gets its own region
    var key = 'loc-' + (cell ? cell.key : fromSub || (iso2 && loc.unused) ? iso2 : iso1);
    if (REGIONS[key]) return key;
    var ci = loc.ci.v, dflt = {dec: .03, wue: 1.5, ws: (COUNTRY[iso1] || [0, .4])[1], fos: Math.min(.95, ci / 800)};
    Object.keys(dflt).forEach(function(k){
      if (!loc[k]) loc[k] = {v: dflt[k], conf: 'sample', level: 'default'};
    });
    var where = loc.ci.level === iso1 ? (countryName || loc.ci.levelName) : loc.ci.levelName + ', ' + iso1;
    REGIONS[key] = {n: where, ci: ci, dec: loc.dec.v, wue: loc.wue.v, ws: loc.ws.v, fos: loc.fos.v, loc: loc};
    return key;
  }

  // Grid region for a point: sourced locale data when there is any; else the
  // country's curated region (nearest known place when it has several); else
  // a country-average region built from the sample COUNTRY table.
  function regionIso(k){ var p = k.split('-')[0]; return p === 'uk' ? 'GB' : p.toUpperCase(); }
  function regionAt(iso, iso2, c, name, cell){
    var lr = localeRegion(iso, iso2, name, cell);
    if (lr) return lr;
    var keys = Object.keys(REGIONS).filter(function(k){ return !REGIONS[k].loc && regionIso(k) === iso; });
    if (keys.length === 1) return keys[0];
    if (keys.length > 1){
      var best = keys[0], bd = Infinity;
      SITES.concat(CITIES).forEach(function(s){
        if (keys.indexOf(s.r) < 0) return;
        var dd = d3.geoDistance(s.c, c);
        if (dd < bd){ bd = dd; best = s.r; }
      });
      return best;
    }
    var rec = COUNTRY[iso];
    if (!rec) return null;
    var key = 'avg-' + iso;
    if (!REGIONS[key]) REGIONS[key] = {n: name + ' · country average', ci: rec[0], dec: .03, wue: 1.5,
                                       ws: rec[1], fos: Math.min(.95, rec[0] / 800)};
    return key;
  }

  /* ------------------------------ geocoding ------------------------------
     Mapbox Geocoding v6 names searched and placed points and gives their ISO
     codes. Results are shown, never stored (temporary geocoding terms).
     ----------------------------------------------------------------------- */
  function geoPlace(f){
    var p = f.properties || {}, cx = p.context || {}, co = cx.country || {}, rg = cx.region || {};
    return {
      mid: p.mapbox_id, type: p.feature_type,
      n: p.name_preferred || p.name, sub: p.place_formatted || '',
      c: [p.coordinates.longitude, p.coordinates.latitude],
      iso1: (co.country_code || '').toUpperCase() || null,
      iso2: rg.region_code_full || null,
      country: co.name || ''
    };
  }
  function geocode(path, params){
    params.access_token = mapboxgl.accessToken;
    params.language = 'en';
    var qs = Object.keys(params).map(function(k){ return k + '=' + encodeURIComponent(params[k]); }).join('&');
    return fetch('https://api.mapbox.com/search/geocode/v6/' + path + '?' + qs)
      .then(function(r){ return r.ok ? r.json() : {features: []}; })
      .then(function(d){ return (d.features || []).map(geoPlace); })
      .catch(function(){ return []; });
  }

  var placedCount = 0;
  function makeCity(c, n, p, r, codes){
    placedCount += 1;
    var city = {id: 'pt' + placedCount, n: n || 'New site ' + placedCount, p: p,
                c: [+c[0].toFixed(2), +c[1].toFixed(2)], r: r, placed: true,
                iso1: codes.iso1 || null, iso2: codes.iso2 || null, mid: codes.mid || null};
    CITIES = CITIES.concat([city]);
    cityById[city.id] = city;
    state.comparing = false; state.compare = null; state.selected = city.id;
    refresh();
    return city;
  }

  // Right-click → "Add node here": place at once, then name it from reverse
  // geocoding and move it onto its state's data when that comes back.
  function placeAt(c, country, r){
    var city = makeCity(c, null, country.name, r, {iso1: country.iso});
    Promise.all([
      geocode('reverse', {longitude: c[0], latitude: c[1], types: 'place,region', limit: 1}),
      cellFor(city.c)
    ]).then(function(res){
      var g = res[0][0], d = byId[city.id] || cityById[city.id];
      if (!d) return;
      if (g && g.iso1 === country.iso){
        if (g.type === 'place' && /^New site \d+$/.test(d.n)) d.n = g.n;
        d.p = g.sub || d.p;
        d.iso2 = g.iso2;
      }
      localize(d, res[1], country.name);
    });
  }

  // A city chosen from search: reuse its ring if it's already on the map.
  function placeFound(g){
    var have = CITIES.concat(SITES).filter(function(d){ return d.mid && d.mid === g.mid; })[0];
    if (have){ pick(have.id); return have; }
    var city = makeCity(g.c, g.n, g.sub || g.country, regionAt(g.iso1, g.iso2, g.c, g.country), g);
    cellFor(city.c).then(function(cell){
      var d = byId[city.id] || cityById[city.id];
      if (d) localize(d, cell, g.country);
    });
    return city;
  }

  // Put a place on its cell's values once the tile has arrived. A node added
  // in the meantime still gets the local population in place of its default.
  function localize(d, cell, countryName){
    d.cell = cell;
    d.r = regionAt(d.iso1, d.iso2, d.c, countryName, cell) || d.r;
    if (d.in && d.popDefault && cell && cell.vals.pop){ d.in.pop = cell.vals.pop.v; d.popDefault = false; }
    refresh();
  }
  function dropCity(d){
    CITIES = CITIES.filter(function(x){ return x.id !== d.id; });
    delete cityById[d.id];
    if (state.selected === d.id) state.selected = null;
    refresh();
  }

  function contextAt(clientX, clientY, target, viaKeyboard){
    if (Date.now() - ctxOpenedAt < 600 && !ctx.hidden) return;   // long-press + native contextmenu
    var rect = glHost.getBoundingClientRect(), x = clientX - rect.left, y = clientY - rect.top;
    var mk = target && target.closest ? target.closest('.mk') : null;
    var d = mk && marks[mk.dataset.id] ? marks[mk.dataset.id].d : null;
    if (d && d.s){
      openCtx(x, y, {glyph: glyphHTML(d.s, 11) + ' ', eyebrow: stageLabel[d.s], name: d.n, sub: d.p}, siteItems(d), viaKeyboard);
      return;
    }
    if (d){

  // What the map models: built-in sites by id, added nodes by facility type.

    foundry:['hsin','tainan','chand'], hbm:['ptaek','icheon','hiro'], packaging:['kaoh'], assembly:['zheng','taoy'],

  function vizCount(id){

  var VW = 206, VH = 54, VPITCH = 262, VROW = 82, VTOP = 44, VX0 = 20;
  var VGUT = VPITCH - VW;                              // channel between columns
  var VBAND = VTOP + 5 * VROW + 40;                    // the data, people and policy band
  function vizXY(n){ return [VX0 + n.c * VPITCH, n.r === 'b' ? VBAND + 26 : VTOP + n.r * VROW]; }

  /* Links run like a metro map: only through the channels between columns
     and the gaps between rows, never across a box, turning with rounded
     corners. Each link gets its own lane in every channel it uses and its
     own point on a box's edge, so parallel links stay apart.
       forward      right edge → channel → (row gap → channel) → left edge
       same column  right edge → channel → right edge
       backward     left edge → channel → (row gap → channel) → right edge */
  function vizRoutes(list){
    var byN = {}; VIZ_NODES.forEach(function(n){ byN[n.id] = n; });
    var yMid = function(n){ return vizXY(n)[1] + VH / 2; };
    // row gaps a horizontal run can use, free in every column
    var gaps = [];
    for (var k = 1; k <= 4; k++) gaps.push(VTOP + k * VROW - (VROW - VH) / 2);
    gaps.push((VTOP + 4 * VROW + VH + VBAND + 26) / 2);   // between the chain and the band
    gaps.push(VBAND + 26 + VH + 18);                       // under the band

    var R = list.map(function(e){
      var a = byN[e[0]], b = byN[e[1]], dc = b.c - a.c, r = {e: e, a: a, b: b};
      r.sSide = dc >= 0 ? 'R' : 'L';
      r.tSide = dc > 0 ? 'L' : 'R';
      r.g1 = dc >= 0 ? a.c : a.c - 1;                // channel index: g sits right of column g
      r.g2 = dc > 1 ? b.c - 1 : dc < -1 ? b.c : null;
      if (r.g2 !== null){
        var ay = yMid(a), by = yMid(b);
        r.gap = gaps.reduce(function(best, g){
          return Math.abs(g - ay) + Math.abs(g - by) < Math.abs(best - ay) + Math.abs(best - by) ? g : best;
        });
      }
      return r;
    });

    // Bundling: links of one kind that leave the same box share one point on
    // its edge (and arrive together the same way), and in each channel or
    // gap they share one lane with any link of that kind they have an end in
    // common with. A fan-out becomes one trunk that branches; a fan-in, one
    // that gathers.
    var ports = {};   // box side → bundle (direction + kind) → its links
    function portOf(side, bundle, entry){
      var s = ports[side] = ports[side] || {};
      (s[bundle] = s[bundle] || []).push(entry);
    }
    R.forEach(function(r){
      portOf(r.a.id + r.sSide, 'out-' + r.e[2], {r: r, end: 's', y: yMid(r.b)});
      portOf(r.b.id + r.tSide, 'in-' + r.e[2], {r: r, end: 't', y: yMid(r.a)});
    });
    Object.keys(ports).forEach(function(side){
      var groups = Object.keys(ports[side]).map(function(k){
        var g = ports[side][k];
        return {members: g, y: g.reduce(function(s, p){ return s + p.y; }, 0) / g.length};
      }).sort(function(p, q){ return p.y - q.y; });
      groups.forEach(function(g, i){
        g.members.forEach(function(p){ p.r[p.end + 'Off'] = VH * (i + 1) / (groups.length + 1); });
      });
    });

    // lanes: each channel and each row gap splits its width among its bundles
    var lanes = {};
    function claim(key, r, order){ (lanes[key] = lanes[key] || []).push({r: r, order: order}); }
    R.forEach(function(r){
      var sy = vizXY(r.a)[1] + r.sOff;
      claim('g' + r.g1, r, sy);
      if (r.g2 !== null){ claim('g' + r.g2, r, vizXY(r.b)[1] + r.tOff); claim('y' + r.gap, r, sy); }
    });
    // a lane is an offset: from a channel's left edge, or from a gap's centre line
    var laneAt = {}, GAP = VROW - VH;
    Object.keys(lanes).forEach(function(key){
      var entries = lanes[key], parent = entries.map(function(_, i){ return i; });
      function find(i){ return parent[i] === i ? i : (parent[i] = find(parent[i])); }
      entries.forEach(function(p, i){
        entries.forEach(function(q, j){
          if (j <= i || p.r.e[2] !== q.r.e[2]) return;
          if (p.r.e[0] === q.r.e[0] || p.r.e[1] === q.r.e[1]) parent[find(j)] = find(i);
        });
      });
      var bundles = {};
      entries.forEach(function(p, i){
        var b = bundles[find(i)] = bundles[find(i)] || {members: [], order: Infinity};
        b.members.push(p); b.order = Math.min(b.order, p.order);
      });
      var order = Object.keys(bundles).map(function(k){ return bundles[k]; }).sort(function(p, q){ return p.order - q.order; });
      order.forEach(function(b, i){
        var t = (i + 1) / (order.length + 1);
        b.members.forEach(function(p){
          laneAt[key + '|' + R.indexOf(p.r)] = key[0] === 'g' ? 8 + (VGUT - 16) * t : -GAP / 2 + 5 + (GAP - 10) * t;
        });
      });
    });
    function channelX(g, i){ return VX0 + g * VPITCH + VW + laneAt['g' + g + '|' + i]; }

    return R.map(function(r, i){
      var A = vizXY(r.a), B = vizXY(r.b);
      var sx = r.sSide === 'R' ? A[0] + VW : A[0], sy = A[1] + r.sOff;
      var tx = r.tSide === 'R' ? B[0] + VW + 1 : B[0] - 1, ty = B[1] + r.tOff;
      var x1 = channelX(r.g1, i), pts = [[sx, sy], [x1, sy]];
      if (r.g2 === null) pts.push([x1, ty]);
      else {
        var gy = r.gap + laneAt['y' + r.gap + '|' + i], x2 = channelX(r.g2, i);
        pts.push([x1, gy], [x2, gy], [x2, ty]);
      }
      pts.push([tx, ty]);
      return roundedPath(pts, 7);
    });
  }
  // A polyline with its corners rounded (never more than half a segment).
  function roundedPath(pts, rad){
    var d = 'M' + pts[0][0] + ',' + pts[0][1];
    for (var i = 1; i < pts.length - 1; i++){
      var p = pts[i - 1], c = pts[i], n = pts[i + 1];
      var l1 = Math.hypot(c[0] - p[0], c[1] - p[1]), l2 = Math.hypot(n[0] - c[0], n[1] - c[1]);
      var r = Math.min(rad, l1 / 2, l2 / 2);
      if (r < 0.5){ d += ' L' + c[0] + ',' + c[1]; continue; }
      var bx = c[0] - (c[0] - p[0]) / l1 * r, by = c[1] - (c[1] - p[1]) / l1 * r;
      var ax = c[0] + (n[0] - c[0]) / l2 * r, ay = c[1] + (n[1] - c[1]) / l2 * r;
      d += ' L' + bx.toFixed(1) + ',' + by.toFixed(1) + ' Q' + c[0].toFixed(1) + ',' + c[1].toFixed(1) + ' ' + ax.toFixed(1) + ',' + ay.toFixed(1);
    }
    var z = pts[pts.length - 1];
    return d + ' L' + z[0] + ',' + z[1];
  }

  var vizEl = document.getElementById('viz'), vizBtn = document.getElementById('viz-btn');

  function drawViz(){
    var W = VX0 + 5 * VPITCH + VW + VGUT, H = VBAND + 26 + VH + 44;   // right margin: the last channel
    vizCanvas.innerHTML = '';
    var svg = d3.select(vizCanvas).append('svg').attr('viewBox', '0 0 ' + W + ' ' + H)
      .attr('role', 'img').attr('aria-label', 'Diagram of links between the parts of the AI supply chain');

      .attr('class', function(e){ return 've ' + e[2]; })

    // Markers ride each link in its direction of transfer, one per ~320 units

    // step. Shapes follow the kind: square goods, round data, diamond money,
    // a short pill for policy, a ring for feedback. Reduced motion: none.
    var DOT = {

      data:   function(g){ return g.append('circle').attr('r', 2.4); },

      loop:   function(g){ return g.append('circle').attr('r', 2.5); }
    };
    var dots = d3.select(null);
    if (!still()){
      var made = [];
      edges.each(function(e, i){
        var path = this, len = path.getTotalLength(), n = Math.max(1, Math.round(len / 320)), dur = len / 55;
        path.id = 'vp-' + i;
        for (var k = 0; k < n; k++){

             .attr('repeatCount', 'indefinite').attr('rotate', 'auto')

      dots = d3.selectAll(made);
    }

    var nodes = svg.append('g').selectAll('g').data(VIZ_NODES).enter().append('g')
      .attr('transform', function(n){ var p = vizXY(n); return 'translate(' + p[0] + ',' + p[1] + ')'; })
      .each(function(n){
        var g = d3.select(this), count = vizCount(n.id), used = count > 0 || n.id === 'power';
        g.attr('class', 'vn' + (used ? ' used' : '')).attr('tabindex', 0).attr('role', 'button');
        g.append('rect').attr('class', 'box').attr('width', VW).attr('height', VH);
        if (used) g.append('rect').attr('class', 'bar').attr('width', 2).attr('height', VH);
        g.append('text').attr('class', 't').attr('x', 14).attr('y', 23).text(n.n);
        g.append('text').attr('class', 's').attr('x', 14).attr('y', 40).text(n.s);
        var right = VW - 12;
        if (n.choke){ g.append('path').attr('class', 'choke').attr('d', 'M0 -3.6 L3.6 0 L0 3.6 L-3.6 0 Z').attr('transform', 'translate(' + right + ',14)'); right -= 14; }
        if (used) g.append('text').attr('class', 'cnt').attr('x', right).attr('y', 18).text(n.id === 'power' ? 'grid' : count);
        g.attr('aria-label', n.n + (used ? ', on the map' + (count ? ': ' + count + ' site' + (count > 1 ? 's' : '') : ' as each site’s grid') : '') +
                             (n.choke ? ', chokepoint' : '') + '. Press to pin its links.');
      })
      .on('mouseenter', function(ev, n){ if (!vizPin) focusViz(n.id); })
      .on('mouseleave', function(){ focusViz(vizPin); })
      .on('click', function(ev, n){ ev.stopPropagation(); pinViz(vizPin === n.id ? null : n.id); })
      .on('keydown', function(ev, n){
        if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); pinViz(vizPin === n.id ? null : n.id); }
      });

    // highlight one part's links and neighbours, or clear
    function focusViz(id){
      var near = {};
      if (id) near[id] = true;
      svg.classed('focus', !!id);
      edges.classed('hl', function(e){
        var on = !!id && (e[0] === id || e[1] === id);
        if (on){ near[e[0]] = near[e[1]] = true; }
        return on;
      });
      dots.classed('hl', function(e){ return !!id && (e[0] === id || e[1] === id); });

    }

    focusViz(vizPin);
  }

  // legend: one toggle per kind of link, with its line as the swatch
  VIZ_KINDS.forEach(function(k){
    var b = el('button'); b.type = 'button'; b.setAttribute('aria-pressed', String(!vizOff[k.k]));
    b.dataset.kind = k.k;

    b.appendChild(el('span', null, k.label));
    b.addEventListener('click', function(){
      vizOff[k.k] = !vizOff[k.k];
      b.setAttribute('aria-pressed', String(!vizOff[k.k]));
      drawViz();   // re-route: lanes and bundles depend on what's shown
    });
    vizKey.appendChild(b);
  });
  document.getElementById('viz-reset').addEventListener('click', function(){
    vizOff = Object.assign({}, VIZ_DEFAULT_OFF);
    Array.prototype.forEach.call(vizKey.children, function(b){ b.setAttribute('aria-pressed', String(!vizOff[b.dataset.kind])); });
    pinViz(null);
    drawViz();
    vizCanvas.scrollTo(0, 0);
  });
  // clicking anywhere in the diagram area but a part releases a pin
  vizCanvas.addEventListener('click', function(e){ if (!e.target.closest('.vn')) pinViz(null); });
  function openViz(on){
    vizEl.hidden = !on;
    vizBtn.setAttribute('aria-expanded', String(on));
    vizBtn.classList.toggle('on', on);
    if (on){ closeScen(); closeLayer(); closeResults(); closeCtx(); hideTip(); drawViz(); }
  }
  vizBtn.addEventListener('click', function(e){ e.stopPropagation(); openViz(vizEl.hidden); });
  document.getElementById('viz-close').addEventListener('click', function(){ openViz(false); vizBtn.focus(); });
  vizEl.addEventListener('click', function(e){ e.stopPropagation(); });

  /* -------------------------------- boot --------------------------------- */
  if (window.matchMedia){
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onTheme = function(){ applyTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', onTheme);
  }
  document.getElementById('ramp-lo').textContent = LAYERS[0].lo;
  document.getElementById('ramp-hi').textContent = LAYERS[0].hi;
  refresh();
  loadData();
})();
</script>
