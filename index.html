<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css">
<style>
  :root{
    --paper:#F7F7F5;
    --surface:#FFFFFF;
    --ink:#15181A;
    --ink-2:#585F61;
    --ink-3:#8B9294;
    --rule:#D8DBDA;
    --rule-soft:#E9EBEA;
    --land:#E7E9E7;
    --landline:#CDD1CF;
    --water:#DDE3E4;
    --space:#FFFFFF;
    --map-label:#8C9495;
    --map-label-on:#4F5757;         /* labels over a coloured layer */
    --label-halo:rgba(255,255,255,.82);
    --state-line:rgba(21,24,26,.2);
    --country-line:rgba(21,24,26,.3);   /* country borders: a step above state lines */
    --nodata:#D6D9D8;
    --nodata-line:#F2F3F2;
    --hs-shadow:rgba(40,46,46,.30);
    --hs-light:rgba(255,255,255,.35);
    --accent:#17706B;
    --accent-soft:#D9E9E7;
    --ramp0:#EFF0EC;
    --ramp1:#8A7F6C;
    --r-ci0:#F4F2E4;   --r-ci1:#9C8730;
    --r-ws0:#E7EDF2;   --r-ws1:#3C6A8B;
    --r-aq0:#EFEFEE;   --r-aq1:#6C7272;
    --r-land0:#E9EFE8; --r-land1:#4C6F51;
    --warn:#9A6B2F;
    /* connections diagram: one hue per kind of link, plus the chokepoint mark */
    --e-phys:#B07A55; --e-data:#3A8A84; --e-money:#AE9444; --e-policy:#8674AC; --e-loop:#4A88A6; --choke:#C0634E;
    /* footprint bars: energy ochre, carbon charcoal, water blue, air copper */
    --m-e:#B8952F; --m-c:#4A5052; --m-w:#3E78A0; --m-a:#B0673A;
    /* stages in Stats: one hue each */
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#111313;
      --surface:#171A1A;
      --ink:#E9EBEA;
      --ink-2:#A7AEAE;
      --ink-3:#757C7C;
      --rule:#313636;
      --rule-soft:#232727;
      --land:#222626;
      --landline:#3A4140;
      --water:#0C0F10;
      --space:#171A1A;
      --map-label:#5F6767;
      --map-label-on:#B2B9B8;
      --label-halo:rgba(17,19,19,.82);
      --state-line:rgba(233,235,234,.2);
      --country-line:rgba(233,235,234,.28);
      --nodata:#2E3232;
      --nodata-line:#4A5050;
      --hs-shadow:rgba(0,0,0,.55);
      --hs-light:rgba(233,235,234,.09);
      --accent:#6CC9BF;
      --accent-soft:#1C2E2C;
      --ramp0:#1F2322;
      --ramp1:#8E8471;
      --r-ci0:#23241B;   --r-ci1:#8A7A3A;
      --r-ws0:#1A2126;   --r-ws1:#5484A4;
      --r-aq0:#1F2322;   --r-aq1:#878D8D;
      --r-land0:#1C221C; --r-land1:#66896B;
      --warn:#C9A06A;--e-phys:#C99372;--e-data:#6DB5AE;--e-money:#CBB56C;--e-policy:#A597CA;--e-loop:#7AB0C8;--choke:#D98470;--m-e:#D2B45C;--m-c:#B9C0C0;--m-w:#76AAD0;--m-a:#D0906A;
    }
  }
  :root[data-theme="dark"]{
    --paper:#111313;--surface:#171A1A;--ink:#E9EBEA;--ink-2:#A7AEAE;--ink-3:#757C7C;
    --rule:#313636;--rule-soft:#232727;--land:#222626;--landline:#3A4140;
    --water:#0C0F10;--space:#171A1A;--map-label:#5F6767;--map-label-on:#B2B9B8;--label-halo:rgba(17,19,19,.82);--state-line:rgba(233,235,234,.2);--country-line:rgba(233,235,234,.28);--nodata:#2E3232;--nodata-line:#4A5050;--hs-shadow:rgba(0,0,0,.55);--hs-light:rgba(233,235,234,.09);
    --accent:#6CC9BF;--accent-soft:#1C2E2C;--ramp0:#1F2322;--ramp1:#8E8471;--warn:#C9A06A;--e-phys:#C99372;--e-data:#6DB5AE;--e-money:#CBB56C;--e-policy:#A597CA;--e-loop:#7AB0C8;--choke:#D98470;--m-e:#D2B45C;--m-c:#B9C0C0;--m-w:#76AAD0;--m-a:#D0906A;
    --r-ci0:#23241B;--r-ci1:#8A7A3A;--r-ws0:#1A2126;--r-ws1:#5484A4;
    --r-aq0:#1F2322;--r-aq1:#878D8D;--r-land0:#1C221C;--r-land1:#66896B;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:"Source Serif 4",Georgia,serif;font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  button,input{font:inherit;color:inherit}
  .mono,.m-lbl,.m-val,.meta,.bar-txt{font-family:"IBM Plex Mono",ui-monospace,monospace}
  .tnum{font-variant-numeric:tabular-nums}

  .app{display:flex;flex-direction:column;height:100dvh;background:var(--surface)}

  /* ---------- top hairline ---------- */
  .top{
    display:flex;align-items:center;gap:18px;padding:0 14px;height:46px;flex:0 0 auto;
    border-bottom:1px solid var(--rule);position:relative;z-index:45;background:var(--surface)
  }
  .mark{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.26em;text-transform:uppercase;white-space:nowrap}
  /* search: a soft filled field; one accent edge and halo on focus, nothing else */
  .search{position:relative;flex:0 1 260px;min-width:150px;height:32px;display:flex;align-items:center;gap:9px;
          padding:0 8px 0 11px;border:1px solid transparent;
          background:color-mix(in srgb,var(--ink) 6%,var(--surface));
          transition:background .15s ease,border-color .15s ease,box-shadow .15s ease}
  .search:hover{background:color-mix(in srgb,var(--ink) 9%,var(--surface))}
  .search:focus-within{background:var(--surface);border-color:var(--accent);
                       box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
  .search svg{flex:0 0 auto;width:14px;height:14px;color:var(--ink-3);transition:color .15s ease}
  .search:focus-within svg{color:var(--accent)}
  .search input{
    flex:1;min-width:0;height:100%;background:none;border:0;outline:none;padding:0;
    font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;font-weight:500;color:var(--ink)
  }
  .search input:focus-visible{outline:none}
  .search input::placeholder{color:var(--ink-3);font-weight:500}
  .search kbd{flex:0 0 auto;min-width:18px;height:18px;display:grid;place-items:center;border:1px solid var(--rule);
              font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);background:var(--surface);transition:opacity .15s ease}
  .search:focus-within kbd{opacity:0}
  .results{
    position:absolute;top:38px;left:0;width:max(100%,290px);background:var(--surface);
    border:1px solid var(--rule);box-shadow:0 14px 30px -20px rgba(0,0,0,.55);
    max-height:300px;overflow-y:auto;display:none;z-index:40;padding:4px
  }
  .results.open{display:block}
  .results button{
    display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:0;
    border:0;padding:7px 10px;cursor:pointer;color:var(--ink-2);
    font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif
  }
  .results button:hover,.results button.cursor{background:var(--rule-soft);color:var(--ink)}
  .results .rn{font-size:13.5px;line-height:1.35}
  .results .rs{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
  .results .empty{padding:9px 10px;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:13px;color:var(--ink-3)}

  /* scenario menu: same quiet underline button as the layer switch, dropping down */
  .scen{position:relative;flex:0 0 auto}
  .scen > button{
    background:none;border:0;cursor:pointer;padding:3px 0;color:var(--ink-2);white-space:nowrap;
    font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    border-bottom:1px solid var(--rule)
  }
  .scen > button:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .scen > button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .scen > button:focus-visible{outline:none;border-bottom-color:var(--accent)}
  .scen-menu{
    position:absolute;top:40px;left:0;width:264px;background:var(--surface);border:1px solid var(--rule);overflow:hidden;
    box-shadow:0 14px 30px -20px rgba(0,0,0,.55);display:none;z-index:40
  }
  .scen-menu.open{display:block}
  .scen-menu button{
    display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule-soft);
    padding:9px 12px;cursor:pointer;font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13.5px;font-weight:500;color:var(--ink)
  }
  .scen-menu button:last-child{border-bottom:0}
  .scen-menu button:hover,.scen-menu button:focus{background:var(--rule-soft);outline:none}
  .scen-menu button[aria-checked="true"]{color:var(--accent)}
  .scen-menu .sub{display:block;margin-top:2px;font-size:12px;font-weight:400;line-height:1.35;color:var(--ink-3)}
  .scen-note{color:var(--accent)}
  /* ---------- key: one button in the bar, opening a menu of stages and connections ---------- */
  .key{position:relative;margin-left:auto;flex:0 0 auto}
  .key > button{
    display:inline-flex;align-items:center;gap:6px;background:none;border:0;border-bottom:1px solid var(--rule);
    padding:3px 0;cursor:pointer;color:var(--ink-2);white-space:nowrap;flex:0 0 auto;
    font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase
  }
  .key > button:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .key > button.on{color:var(--accent);border-bottom-color:var(--accent)}   /* something is hidden */
  .key .kcar{fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease}
  .key > button[aria-expanded="true"] .kcar{transform:rotate(180deg)}
  .key-menu{
    position:absolute;top:calc(100% + 8px);right:0;width:260px;display:none;flex-direction:column;padding:6px;
    background:var(--surface);border:1px solid var(--rule);box-shadow:0 18px 36px -22px rgba(0,0,0,.6);z-index:40;
    font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif
  }
  .key.open .key-menu{display:flex;animation:pop-in .13s cubic-bezier(.2,0,0,1)}
  .key-h{padding:8px 8px 4px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .stages,.key-flows{display:flex;flex-direction:column}
  .stages button,.key-flows button,.key-all{
    display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:7px 8px;cursor:pointer;
    font:inherit;font-size:13.5px;color:var(--ink);text-align:left;white-space:nowrap
  }
  .stages button:hover,.key-flows button:hover,.key-all:hover{background:var(--rule-soft)}
  .stages button .gl{width:14px;flex:0 0 14px}
  .key-flows button svg{flex:0 0 24px}
  /* on: a check at the right; off: faded */
  .stages button::after,.key-flows button::after,.key-all::after{content:"✓";margin-left:auto;color:var(--accent);font-size:13px}
  .stages button[aria-pressed="false"],.key-flows button[aria-pressed="false"],.key-all[aria-pressed="false"]{color:var(--ink-3)}
  .stages button[aria-pressed="false"]::after,.key-flows button[aria-pressed="false"]::after,.key-all[aria-pressed="false"]::after{content:""}
  .stages button[aria-pressed="false"] .gl,.key-flows button[aria-pressed="false"] svg{opacity:.4}
  .key-div{height:1px;background:var(--rule-soft);margin:6px 2px 2px}
  .key-all:focus-visible,.stages button:focus-visible,.key-flows button:focus-visible{outline:none;background:var(--rule-soft)}
  .key-flows[hidden]{display:none}
  button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:1px solid var(--accent);outline-offset:3px}

  /* ---------- map ---------- */
  .mapbox{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
  .gl-host{position:absolute;inset:0;background:var(--space)}
  .mk{cursor:pointer;line-height:0}
  .mk svg{display:block;width:14px;height:14px;overflow:visible}
  .mk.sel svg,.mk.cmp svg{width:18px;height:18px}
  .nd{cursor:pointer}
  .nd path{
    fill:#000;stroke:#FFF;stroke-width:2.2px;vector-effect:non-scaling-stroke;
    paint-order:stroke fill;stroke-linejoin:round;fill-rule:evenodd
  }
  .pc circle{
    fill:none;stroke:#FFF;stroke-width:3.4px;vector-effect:non-scaling-stroke;
    paint-order:stroke;cursor:pointer
  }
  .pc circle.dot{stroke:#000;stroke-width:1.5px;stroke-dasharray:2.4 2.2}
  .pc{cursor:pointer}
  .pc.sel circle.dot{stroke:var(--accent);stroke-dasharray:none;stroke-width:2.2px}
  .pc path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round}
  .pc path.ph{stroke:#FFF;stroke-width:3.2px}
  .pc path.pb{stroke:#000;stroke-width:1.7px}
  .pc.sel path.pb{stroke:var(--accent)}
  .addrow{display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--rule-soft)}
  .addrow button{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid var(--rule-soft);padding:8px 2px;cursor:pointer;color:var(--ink-2);font-size:14.5px
  }
  .addrow button:hover{color:var(--ink)}
  .addrow button .plus{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
  .addrow button:hover .plus{color:var(--accent)}
  .addrow button:focus-visible{outline:none;box-shadow:inset 2px 0 0 var(--accent)}
  .addrow button.back{
    padding:7px 2px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-3)
  }
  .addrow button.back:hover{color:var(--ink)}
  .addrow button.type{padding-left:12px}
  .p-actions button.danger{color:var(--ink-3)}
  .p-actions button.danger:hover{color:var(--warn);border-bottom-color:var(--warn)}
  .nd:hover path{fill:var(--accent)}
  .nd.rel path{fill:var(--accent);opacity:.82}
  .nd.sel path{fill:var(--accent);stroke-width:2.6px}
  .nd.cmp path{fill:var(--warn);stroke-width:2.6px}
  .gl{flex:0 0 auto;vertical-align:-1px}
  .gl path{fill:var(--ink)}
  .stages button .gl path{fill:currentColor}
  .results .gl path{fill:var(--ink-2)}
  .eyebrow .gl path{fill:currentColor}
  .overlay{position:absolute;inset:0;pointer-events:none}
  .tip{
    position:absolute;transform:translate(-50%,-165%);white-space:nowrap;font-style:italic;font-size:13px;
    color:var(--ink);background:color-mix(in srgb,var(--surface) 86%,transparent);padding:0 5px;display:none
  }
  /* Mapbox requires its logo and attribution; keep them, just quiet */
  .mapboxgl-ctrl-bottom-right .mapboxgl-ctrl-attrib{
    background:color-mix(in srgb,var(--surface) 78%,transparent);
    font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.04em;color:var(--ink-3)
  }
  .mapboxgl-ctrl-attrib a{color:var(--ink-3)}

  /* ---------- panel ---------- */
  .panel{
    position:absolute;left:0;top:0;bottom:0;width:302px;max-width:88%;background:var(--surface);
    border-right:1px solid var(--rule);padding:18px 17px 14px;display:flex;flex-direction:column;gap:14px;
    transform:translateX(-101%);transition:transform .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1);
    pointer-events:auto;overflow-y:auto;z-index:20
  }
  .panel.open{transform:none}
  .panel.wide{width:452px}
  .p-close{position:absolute;top:13px;right:13px;background:none;border:0;cursor:pointer;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:12px;z-index:2}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);display:block}
  .p-name{margin:2px 0 3px;font-size:22px;font-weight:600;letter-spacing:-.012em;line-height:1.14;padding-right:22px}
  .p-place{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);letter-spacing:.02em}
  .p-note{margin:0;font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;color:var(--ink-2);line-height:1.5}

  .sec-lbl{display:flex;align-items:baseline;gap:8px}
  .sec-lbl button{background:none;border:0;padding:0;margin-left:auto;cursor:pointer;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
  .sec-lbl button[aria-pressed="true"]{color:var(--accent)}

  .metrics{display:flex;flex-direction:column;border-top:1px solid var(--rule-soft)}
  .m{padding:8px 0;border-bottom:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:3px}
  .m-top{display:flex;align-items:baseline;gap:8px}
  .m-lbl{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
  .m-dots{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-3px);min-width:8px}
  .m-val{font-size:15.5px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
  .m-val .u{color:var(--ink-3);font-size:10.5px;letter-spacing:.04em;margin-left:3px}
  .m-bar{height:5px;background:var(--rule-soft);position:relative;margin-top:2px}
  .m-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.85;display:block;min-width:2px}
  /* a darker cap marks where the value ends */
  .m-bar i::after{content:"";position:absolute;right:0;top:-2px;bottom:-2px;width:2px;background:inherit;filter:brightness(.7)}
  .m.me-energy .m-bar i{background:var(--m-e)} .m.me-carbon .m-bar i{background:var(--m-c)}
  .m.me-water .m-bar i{background:var(--m-w)}  .m.me-air .m-bar i{background:var(--m-a)}
  .m-f{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3);letter-spacing:.01em;display:none}
  .metrics.show-f .m-f{display:block}

  .inputs{font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.7;color:var(--ink-3);letter-spacing:.02em}
  .inputs b{color:var(--ink-2);font-weight:500}
  /* location inputs with the level each came from (US-TX / US) and its confidence */
  .prov{display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;border-top:1px solid var(--rule-soft);padding-top:6px;
        font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.8;color:var(--ink-3);letter-spacing:.02em}
  .prov b{color:var(--ink-2);font-weight:500}
  .prov .lv{text-align:right;white-space:nowrap}
  .prov a{color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
  .prov a:hover{color:var(--ink-2)}
  .prov .sample{color:var(--warn)}
  .chain{display:flex;flex-direction:column;gap:4px}
  .chain-sub{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:8px 0 2px}
  .chain-sub:first-child{margin-top:0}
  /* titled sections: a quiet header with a hairline, a little air between them */
  .sec{margin-top:22px;padding-top:12px;border-top:1px solid var(--rule)}
  .sec-h{display:flex;align-items:center;gap:7px;margin-bottom:4px}
  .sec-h .eyebrow{font-size:10.5px;color:var(--ink);letter-spacing:.14em}
  /* ⓘ: a hover target for a section's explanation, in the unit callout */
  .tip-i{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border:1px solid var(--rule);
         border-radius:50%;font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-size:9px;line-height:1;
         color:var(--ink-3);cursor:help;flex:0 0 auto}
  .tip-i:hover{color:var(--ink);border-color:var(--ink-3)}
  .sec-h button{background:none;border:0;padding:0;margin-left:auto;cursor:pointer;color:var(--ink-3);
                font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
  .sec-h button:hover{color:var(--ink)}
  .sec-h button[aria-pressed="true"]{color:var(--accent)}
  .sec .metrics{border-top:0}
  .chain .lk{display:flex;gap:8px;align-items:baseline;font-size:14px;color:var(--ink-2);cursor:pointer;background:none;border:0;padding:1px 0;text-align:left;width:100%}

  .viz .vn .cnt{font-family:"IBM Plex Mono",monospace;font-size:10px;fill:var(--accent);text-anchor:end}

  .viz .vk{opacity:.85;transition:opacity .15s ease}
  .viz .ve{fill:none;stroke-width:1.25;stroke-linejoin:round;transition:opacity .15s ease}
  .viz .ve.phys{stroke:var(--e-phys)}  .viz .ve.data{stroke:var(--e-data)}  .viz .ve.money{stroke:var(--e-money)}
  /* policy and feedback carry no hue of their own: dots and dashes tell them apart */
  .viz .ve.policy{stroke:var(--e-policy);stroke-dasharray:1 3.5;stroke-linecap:round;stroke-width:1.5}
  .viz .ve.loop{stroke:var(--e-loop);stroke-dasharray:6 4}

  .viz .vk.policy,.viz .vk.loop{opacity:.5}

  .viz .vd.phys{fill:var(--e-phys)} .viz .vd.data{fill:var(--e-data)} .viz .vd.money{fill:var(--e-money)}
  .viz .vd.policy{fill:var(--e-policy)} .viz .vd.loop{fill:none;stroke:var(--e-loop);stroke-width:1.2}

  .viz .arr.phys{stroke:var(--e-phys)} .viz .arr.data{stroke:var(--e-data)} .viz .arr.money{stroke:var(--e-money)}
  .viz .arr.policy{stroke:var(--e-policy)} .viz .arr.loop{stroke:var(--e-loop)}
  .viz .vn{transition:opacity .15s ease;cursor:pointer;outline:none}

  /* since you opened the map: a live, collapsible band at the top */

  .chain .lk.is-auto .nm{text-decoration:underline dotted;text-decoration-color:var(--ink-3);text-underline-offset:3px}
  /* ---------- outlined buttons: anything that acts reads as a button ---------- */
  .scen > button,.layer > button,.key > button,.p-actions button,.sec-h button,.cl-sort button,.size .rng button{
    border:1px solid var(--rule) !important;padding:4px 9px !important;background:none;
    transition:color .15s ease,border-color .15s ease,background-color .15s ease
  }
  .scen > button:hover,.layer > button:hover,.key > button:hover,.p-actions button:hover,.sec-h button:hover,
  .cl-sort button:hover,.size .rng button:hover:not([disabled]){border-color:var(--ink-3) !important;color:var(--ink)}
  .scen > button.on,.key > button.on,.sec-h button[aria-pressed="true"],.cl-sort button[aria-pressed="true"]{
    color:var(--accent) !important;border-color:color-mix(in srgb,var(--accent) 55%,transparent) !important;
    background:color-mix(in srgb,var(--accent) 7%,transparent)
  }
  /* top bar: buttons at the search field's height and shape, in sans */
  .top .scen > button,.top .key > button{
    height:32px;padding:0 13px !important;display:inline-flex;align-items:center;gap:7px;
    font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--surface);
    border:1px solid color-mix(in srgb,var(--ink) 20%,transparent) !important
  }
  .top .scen > button:hover,.top .key > button:hover{background:var(--rule-soft);border-color:color-mix(in srgb,var(--ink) 38%,transparent) !important}
  .top .scen > button[aria-expanded="true"],.top .key > button[aria-expanded="true"]{background:var(--rule-soft)}
  .top .scen > button.on,.top .key > button.on{
    color:var(--accent) !important;border-color:color-mix(in srgb,var(--accent) 60%,transparent) !important;
    background:color-mix(in srgb,var(--accent) 9%,var(--surface))
  }
  .top .key .kcar{width:9px;height:9px;stroke-width:1.5}
  .p-actions button.danger:hover{border-color:var(--warn) !important;color:var(--warn)}
  .size .rng button[disabled]{border-color:transparent !important}
  .cl-sort{gap:6px !important}
  .cmp-pick input{width:100%;background:none;border:1px solid var(--rule);padding:7px 9px;outline:none;margin-top:8px;
                 font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink)}
  .cmp-pick input:focus{border-color:var(--accent)}
  .cmp-pick input::placeholder{color:var(--ink-3)}
  .cmp-hint2{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);margin-top:8px}
  .cmp-change{margin-top:8px;background:none;border:1px solid var(--rule);padding:3px 9px;cursor:pointer;color:var(--ink-3);
              font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  .cmp-change:hover{color:var(--ink);border-color:var(--ink-3)}
  .lyr-h{padding:9px 11px 4px;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
         text-transform:uppercase;color:var(--ink-2)}
  .lyr-h ~ .lyr-h,.layer-menu .lyr-none{border-top:1px solid var(--rule)}
  /* ---------- the place, as a short list of plain facts ---------- */
  .facts{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:7px;margin-top:14px;
         font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.3;color:var(--ink)}
  .facts .k{color:var(--ink-3);font-size:13px;white-space:nowrap}
  .facts .v b{font-weight:500}
  .facts .v b[data-tip]:hover{color:var(--ink-2)}
  .p-plain{margin:12px 0 0;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;line-height:1.4;color:var(--ink-2)}
  /* ---------- supply chain as a flow: suppliers ↓ this site ↓ customers ---------- */
  .flow-step{display:flex;align-items:center;gap:8px;padding:2px 0 2px 2px;font-family:"IBM Plex Mono",monospace;
             font-size:11px;color:var(--ink-3)}
  .flow-step .arw{color:var(--accent);font-size:14px;width:12px;text-align:center;line-height:1}
  .chain .lk.here{cursor:default;color:var(--ink);font-weight:600;background:color-mix(in srgb,var(--accent) 6%,transparent);
                  padding:4px 6px 4px 2px}
  .chain .lk.here .ty{font-weight:400}
  /* data center size: a hairline track with a square handle, mono readout */
  .size{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px}
  .size .v{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;
           min-width:62px;text-align:right}
  .size input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;margin:0;background:none;cursor:pointer}
  .size input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--rule)}
  .size input[type=range]::-moz-range-track{height:1px;background:var(--rule)}
  .size input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;margin-top:-4px;background:var(--accent);border:0;border-radius:0}
  .size input[type=range]::-moz-range-thumb{width:9px;height:9px;background:var(--accent);border:0;border-radius:0}
  .size input[type=range]:focus{outline:none}
  .size input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--accent-soft)}
  .size input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--accent-soft)}
  .size .rng{grid-column:1 / 2;display:flex;justify-content:space-between;margin-top:6px;
             font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;color:var(--ink-3)}
  .size .rng button{background:none;border:0;padding:0;cursor:pointer;font:inherit;letter-spacing:inherit;color:var(--ink-3)}
  .size .rng button:hover,.size .rng button:focus-visible{color:var(--accent);outline:none}
  .size .rng button[disabled]{cursor:default;color:var(--ink-3)}
  /* abbreviated units: a small callout with a hairline stem to the unit */
  [data-unit],[data-tip]{cursor:help}
  [data-unit]:hover{color:var(--ink-2)}
  .utip{
    position:fixed;z-index:70;width:max-content;max-width:270px;padding:7px 10px 8px;pointer-events:none;
    background:var(--surface);border:1px solid var(--rule);box-shadow:0 14px 30px -20px rgba(0,0,0,.55);
    opacity:0;transform:translateY(3px);transition:opacity .12s ease,transform .12s ease
  }
  .utip.below{transform:translateY(-3px)}
  .utip.on{opacity:1;transform:none}
  .utip::after{content:"";position:absolute;left:var(--stem,50%);top:100%;width:1px;height:9px;background:var(--rule)}
  .utip.below::after{top:auto;bottom:100%}
  .utip .uh{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.03em;color:var(--ink-3);line-height:1.45}
  .utip .uh b{color:var(--ink);font-weight:500;letter-spacing:.04em}
  .utip .ul{height:1px;background:var(--rule-soft);margin:6px 0 5px}
  .utip .up{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13.5px;line-height:1.45;color:var(--ink-2)}

  /* thin, quiet scrollbars for the panel and the menus */
  .panel,.panel *,.results,.layer-menu,.scen-menu{scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
  .panel ::-webkit-scrollbar,.panel::-webkit-scrollbar,.results::-webkit-scrollbar,
  .layer-menu::-webkit-scrollbar,.scen-menu::-webkit-scrollbar{width:5px;height:5px}
  .panel ::-webkit-scrollbar-track,.panel::-webkit-scrollbar-track,.results::-webkit-scrollbar-track{background:transparent}
  .panel ::-webkit-scrollbar-thumb,.panel::-webkit-scrollbar-thumb,.results::-webkit-scrollbar-thumb,
  .layer-menu::-webkit-scrollbar-thumb,.scen-menu::-webkit-scrollbar-thumb{background:var(--rule)}
  .panel ::-webkit-scrollbar-thumb:hover,.panel::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
  /* compare locations: the same node on other grids, collapsible under the bars */
  .locs-head{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;padding:0;cursor:pointer;
             color:var(--ink-3);text-align:left}
  .locs-head .eyebrow{font-size:10.5px;color:var(--ink-2);letter-spacing:.14em}
  .fold{margin-top:22px;padding-top:12px;border-top:1px solid var(--rule)}
  .fold-h{display:flex;align-items:center;gap:7px}
  .fold-h .locs-head{width:auto}
  .locs-head:hover,.locs-head[aria-expanded="true"]{color:var(--ink-2)}
  .locs-head:focus-visible{outline:none;color:var(--accent)}
  .locs-head .car{font-family:"IBM Plex Mono",monospace;font-size:9px;width:8px;transition:transform .15s ease}
  .locs-head[aria-expanded="true"] .car{transform:rotate(90deg)}
  .cl-sbs{display:block;width:100%;margin:10px 0 8px;background:none;border:1px solid var(--rule);padding:7px 10px;cursor:pointer;
          color:var(--ink-2);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-align:center}
  .cl-sbs:hover,.cl-sbs:focus-visible{color:var(--ink);border-color:var(--ink-3);outline:none}
  .cl-sbs.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);
             background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .cl-sort{display:flex;align-items:center;gap:10px;font-family:"IBM Plex Mono",monospace;font-size:11px;
           letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
  .cl-sort button{background:none;border:0;border-bottom:1px solid transparent;padding:2px 0;cursor:pointer;color:var(--ink-3);
                  font:inherit;letter-spacing:inherit;text-transform:inherit}
  .cl-sort button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  .cl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  .cl th{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;
         color:var(--ink-3);text-align:right;padding:4px 0 4px 8px;border-bottom:1px solid var(--rule-soft)}
  .cl th:first-child{text-align:left;padding-left:0}
  .cl td{font-family:"IBM Plex Mono",monospace;font-size:12px;text-align:right;padding:5px 0 5px 8px;
         border-bottom:1px solid var(--rule-soft);color:var(--ink-3);white-space:nowrap}
  .cl td.pl{font-family:"Source Serif 4",Georgia,serif;font-size:14.5px;text-align:left;padding-left:0;color:var(--ink-2);
            white-space:normal;line-height:1.25}
  .cl tr.me td{color:var(--ink);background:color-mix(in srgb,var(--accent) 6%,transparent)}
  .cl tr.me td.pl{padding-left:6px;font-weight:600}
  .cl tr.me td .u{font-size:9.5px;color:var(--ink-3);margin-left:3px}
  .cl .lo{color:var(--accent)} .cl .hi{color:var(--warn)}
  .cl .x{background:none;border:0;padding:0 0 0 4px;cursor:pointer;color:var(--ink-3);font-size:11px;vertical-align:1px}
  .cl .x:hover{color:var(--warn)}
  .cl-key{display:flex;gap:12px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3);margin-top:6px}
  .cl-key .lo{color:var(--accent)} .cl-key .hi{color:var(--warn)}
  .cl-add{position:relative;margin-top:10px}
  .cl-add input{width:100%;background:none;border:0;border-bottom:1px solid var(--rule);padding:6px 0;outline:none;
                font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink)}
  .cl-add input::placeholder{color:var(--ink-3)}
  .cl-add input:focus{border-bottom-color:var(--accent)}
  .cl-sugg{display:flex;flex-direction:column;margin-top:2px}
  .cl-sugg button{background:none;border:0;border-bottom:1px solid var(--rule-soft);padding:6px 0;cursor:pointer;text-align:left;
                  font-size:13px;color:var(--ink-2)}
  .cl-sugg button:hover,.cl-sugg button:focus{color:var(--ink);outline:none;background:var(--rule-soft)}
  .cl-sugg .sub{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3);margin-left:6px}
  .cl-foot{font-family:"IBM Plex Mono",monospace;font-size:9.5px;line-height:1.5;color:var(--ink-3);margin-top:8px}
  .delta{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.04em;color:var(--ink-3)}
  .delta.up{color:var(--warn)}
  .delta.down{color:var(--accent)}
  .cmp-rows{display:flex;flex-direction:column;border-top:1px solid var(--rule-soft)}
  .cmp-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rule-soft)}
  .cmp-row .a-v,.cmp-row .b-v{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-variant-numeric:tabular-nums}
  .cmp-row .b-v{text-align:right}
  .cmp-row .k{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:center}

  /* ---------- bottom hairline ---------- */
  .bottom{
    display:flex;align-items:center;gap:22px;padding:0 14px;min-height:50px;flex:0 0 auto;flex-wrap:wrap;
    border-top:1px solid var(--rule);background:var(--surface);position:relative;z-index:45
  }
  .bar-txt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
  .layer{position:relative}
  .layer > button{
    background:none;border:0;cursor:pointer;padding:3px 0;color:var(--ink);
    font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
    border-bottom:1px solid var(--rule)
  }
  .bottom .layer > button{height:32px;padding:0 13px !important;border-color:color-mix(in srgb,var(--ink) 20%,transparent) !important}
  .bottom .layer > button:hover,.bottom .layer > button[aria-expanded="true"]{background:var(--rule-soft);border-color:color-mix(in srgb,var(--ink) 38%,transparent) !important}
  .layer-menu{
    position:absolute;bottom:40px;left:0;min-width:230px;background:var(--surface);border:1px solid var(--rule);
    box-shadow:0 -12px 28px -20px rgba(0,0,0,.55);display:none;z-index:40
  }
  .layer-menu.open{display:block}
  .layer-menu button{
    display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule-soft);
    padding:9px 12px;cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;color:var(--ink)
  }
  .layer-menu button:last-child{border-bottom:0}
  .layer-menu button[aria-checked="true"]{color:var(--accent)}
  .layer-menu button .tag{float:right;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--rule);padding:0 4px;margin-left:10px}
  .layer-menu button:hover{background:var(--rule-soft)}

  /* ---------- context menu (right-click / long-press on the map) ---------- */
  .ctx{
    position:absolute;min-width:224px;max-width:290px;background:var(--surface);border:1px solid var(--rule);
    box-shadow:0 18px 36px -22px rgba(0,0,0,.6);padding:0 0 4px;z-index:35;outline:none
  }
  .ctx[hidden]{display:none}
  .ctx-head{padding:10px 12px 9px;border-bottom:1px solid var(--rule-soft);margin-bottom:4px}
  .ctx-head .eyebrow{margin-bottom:2px}
  .ctx-name{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.2;color:var(--ink)}
  .ctx-sub{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3);letter-spacing:.02em;margin-top:2px}
  .ctx button{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
    padding:7px 12px;cursor:pointer;color:var(--ink-2);outline:none;
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.05em
  }
  .ctx button .ci{flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
  .ctx button:hover,.ctx button:focus{background:var(--rule-soft);color:var(--ink)}
  .ctx button:focus-visible{outline:none;box-shadow:inset 2px 0 0 var(--accent)}
  .ctx button:hover .ci,.ctx button:focus .ci{opacity:1}
  .ctx button.danger:hover,.ctx button.danger:focus{color:var(--warn)}
  .ctx button[aria-disabled="true"]{color:var(--ink-3);cursor:default;background:none}
  .ctx button[aria-disabled="true"] .ci{opacity:.4}
  .ctx-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ctx-hint{
    margin-left:auto;padding-left:10px;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px
  }
  .ctx-sep{height:1px;background:var(--rule-soft);margin:4px 0}
  .toast{
    position:absolute;left:50%;bottom:18px;transform:translate(-50%,6px);opacity:0;pointer-events:none;
    background:var(--surface);border:1px solid var(--rule);padding:6px 11px;z-index:35;white-space:nowrap;
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;color:var(--ink-2);
    box-shadow:0 14px 30px -20px rgba(0,0,0,.55);transition:opacity .16s ease,transform .16s ease
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- projection switch (globe / flat) ---------- */
  .mapbox.stats-open .proj,.mapbox.stats-open .zoomc{right:314px}
  /* zoom in / out and re-center: a frosted stack above the Mapbox logo */
  .zoomc{
    position:absolute;right:12px;bottom:36px;z-index:25;display:flex;flex-direction:column;
    background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid var(--rule);overflow:hidden;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 10px 24px -18px rgba(0,0,0,.6);
    transition:right .3s cubic-bezier(.4,0,.2,1)
  }
  .zoomc button{width:34px;height:34px;display:grid;place-items:center;background:none;border:0;cursor:pointer;color:var(--ink-2);
                transition:background-color .15s ease,color .15s ease}
  .zoomc button + button{border-top:1px solid var(--rule)}
  .zoomc button:hover{background:var(--rule-soft);color:var(--ink)}
  .zoomc button:focus-visible{outline:none;background:var(--rule-soft);color:var(--accent)}
  .zoomc button:disabled{color:var(--ink-3);opacity:.45;cursor:default;background:none}
  .zoomc svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
  @keyframes live-pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .proj{
    position:absolute;top:12px;right:12px;z-index:25;transition:right .3s cubic-bezier(.4,0,.2,1);display:flex;gap:2px;padding:2px;
    background:color-mix(in srgb,var(--surface) 68%,transparent);border:1px solid var(--rule);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    box-shadow:0 10px 24px -20px rgba(0,0,0,.6)
  }
  .proj button{
    display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:5px 9px;cursor:pointer;
    color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    transition:background-color .15s ease,color .15s ease
  }
  .proj button svg{fill:none;stroke:currentColor;stroke-width:1.1;stroke-linejoin:round}
  .proj button:hover{color:var(--ink)}
  .proj button[aria-checked="true"]{background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink)}
  .proj button:focus-visible{outline:none;box-shadow:inset 0 -1px 0 var(--accent)}

  /* one entrance for every pop-over: search results, layer menu, context menu */
  @keyframes pop-in{from{opacity:0;transform:translateY(-3px) scale(.985)}to{opacity:1;transform:none}}
  .results.open,.layer-menu.open,.scen-menu.open,.ctx:not([hidden]){animation:pop-in .13s cubic-bezier(.2,0,0,1)}
  .ramp{display:flex;align-items:center;gap:7px}
  .ramp.pending .sw{opacity:.28}
  .ramp.pending #ramp-lo{color:var(--warn)}
  .ramp .bar-txt{font-size:11px;color:var(--ink-2)}
  .ramp .sw{display:flex;width:110px;height:9px;border:1px solid var(--rule)}
  .ramp .sw i{flex:1}
  .ramp .nd-key{display:flex;align-items:center;gap:7px;margin-left:9px}
  .ramp .sw-nd{
    width:26px;height:9px;border:1px solid var(--rule);
    background:repeating-linear-gradient(135deg,var(--nodata-line) 0 1px,var(--nodata) 1px 3.5px)
  }
  .ramp.pending .nd-key{display:none}
  .ramp-info{display:inline-flex}
  .ramp-info .tip-i{width:16px;height:16px;font-size:11px}
  .ramp .circ{display:none;align-items:flex-end;gap:5px}
  .ramp .circ i{display:block;border-radius:50%;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 38%,transparent)}
  .ramp .circ i:nth-child(1){width:6px;height:6px}
  .ramp .circ i:nth-child(2){width:11px;height:11px}
  .ramp .circ i:nth-child(3){width:18px;height:18px}
  .ramp.sized .circ{display:flex}
  .ramp [data-unit]{text-transform:none;letter-spacing:.04em}
  .ramp.sized .sw,.ramp.sized .nd-key{display:none}
  .year{display:flex;align-items:center;gap:9px;flex:1 1 210px;min-width:170px}
  .year input[type="range"]{
    flex:1;appearance:none;background:none;height:18px;cursor:pointer;min-width:90px
  }
  .year input[type="range"]::-webkit-slider-runnable-track{height:1px;background:var(--rule)}
  .year input[type="range"]::-moz-range-track{height:1px;background:var(--rule)}
  .year input[type="range"]::-webkit-slider-thumb{
    appearance:none;width:9px;height:9px;border-radius:50%;background:var(--surface);
    border:1.5px solid var(--ink);margin-top:-4px

    g.beginPath();

    g.stroke();

      if (prev) while (p[0] - prev[0] > 180) p[0] -= 360;

      flowAnim = requestAnimationFrame(frame);
      if (now - last < 33) return;
      last = now;
      var feats = [];
      flowArcs.forEach(function(a){
        var dur = Math.min(5000, Math.max(1600, a.angle / 0.3 * 1000));
        var count = Math.min(3, 1 + Math.floor(a.angle / 0.6)), n = a.pts.length - 1;

  function drawFlows(){

    var t = q.value.trim().toLowerCase();
    if (!t){ closeResults(); return; }
    matches = SITES.concat(CITIES).filter(function(d){
      var hay = d.n+' '+d.p+' '+(d.n0 && d.n0 !== d.n ? d.n0+' '+d.p0+' ' : '')+(d.s ? stageLabel[d.s] : 'unassigned location')+' '+

  // Abbreviated units: full name, and one plain sentence for scale. Rough

  var UNITS = {

  /* --------------------------- data center size --------------------------
     Data centers vary far more in size than any other node, so their power
     is the user's to set, within bounds a little wider than the sourced
     typical range (training 200–1,200 MW, inference 10–100 MW). The slider
     is logarithmic, so both ends get useful resolution.
     ----------------------------------------------------------------------- */
  var SIZE_RANGE = {'dc-training': [50, 2000], 'dc-inference': [5, 200]};
  function niceMW(v){ return v < 20 ? Math.round(v) : v < 200 ? Math.round(v / 5) * 5 : Math.round(v / 10) * 10; }
  // How much the active scenario scales this type's size (boom: training ×5).
  function sizeScale(site){
    var t = SCEN.types && SCEN.types[site.type], T = NODE_TYPES && NODE_TYPES.types[site.type];
    return t && t.p && T && okValue(T.p) ? t.p.v / T.p.v : 1;
  }
  // The slider shows and sets the size in use, scenario included; underneath
  // it stores the node's own baseline size (in use ÷ the scenario's scale).
  function sizeBlock(site, onDrag){
    var rng = SIZE_RANGE[site.type];
    if (!rng) return null;
    var k = sizeScale(site);
    var T = NODE_TYPES && NODE_TYPES.types[site.type], typical = T && okValue(T.p) ? T.p.v : null;
    var lo = Math.log(rng[0]), hi = Math.log(rng[1]), STEPS = 400;
    // the exact value is stored so arrow keys never snap back; rounding is display-only
    function toMW(i){ return Math.exp(lo + (hi - lo) * i / STEPS); }
    function toStep(mw){ return Math.round((Math.log(mw) - lo) / (hi - lo) * STEPS); }

    var d = el('div','size');   // titled by its "Size" section
    var input = el('input'); input.type = 'range'; input.min = 0; input.max = STEPS; input.step = 1;
    input.value = toStep(Math.min(rng[1], Math.max(rng[0], site.in.p * k)));
    input.setAttribute('aria-label', 'Data center IT power, megawatts');
    d.appendChild(input);
    var out = el('span','v');
    function show(v){
      var mw = niceMW(v);
      out.textContent = (mw >= 1000 ? +(mw / 1000).toFixed(2) : mw) + ' ';
      out.appendChild(unitEl(mw >= 1000 ? 'GW' : 'MW', ''));
      input.setAttribute('aria-valuetext', mw + ' megawatts');
    }
    show(site.in.p * k);
    d.appendChild(out);

    var foot = el('div','rng');
    if (typical != null){
      var tl = niceMW(typical * k), tt = tl >= 1000 ? +(tl / 1000).toFixed(2) + ' GW' : tl + ' MW';
      var reset = el('button', null, site.in.p === typical ? 'typical ' + tt : '↺ typical ' + tt);
      reset.type = 'button';
      reset.disabled = site.in.p === typical;
      reset.title = 'Back to the sourced typical size for this type' + (k !== 1 ? ', as scaled by the scenario' : '');
      reset.addEventListener('click', function(ev){ ev.stopPropagation(); site.in.p = typical; markEdited(site); refresh(); });
      foot.appendChild(reset);
    }
    d.appendChild(foot);

    input.addEventListener('input', function(){
      site.in.p = toMW(+input.value) / k;
      show(site.in.p * k);
      onDrag();
    });
    // on release, redraw everything the size feeds (bars scale, deltas, compare)
    input.addEventListener('change', function(){
      markEdited(site);
      refresh();
      var again = pbody.querySelector('.size input'); if (again) again.focus();
    });
    input.addEventListener('click', function(ev){ ev.stopPropagation(); });
    return d;
  }

  /* ------------------------- compare locations ---------------------------
     The same node — same type and inputs — at reference places on other
     grids: carbon, water and air against where it is now. Each place is a
     real point, so it takes its own cell (people nearby) and grid, exactly
     as a dropped point would.
     ----------------------------------------------------------------------- */
  var CMP_PLACES = [
    {n:'Ashburn, VA',   iso1:'US', iso2:'US-VA', c:[-77.49, 39.04], country:'United States'},
    {n:'Abilene, TX',   iso1:'US', iso2:'US-TX', c:[-99.73, 32.45], country:'United States'},
    {n:'The Dalles, OR',iso1:'US', iso2:'US-OR', c:[-121.18, 45.60], country:'United States'},
    {n:'Dublin',        iso1:'IE', iso2:null,    c:[-6.26, 53.35],  country:'Ireland'},
    {n:'Luleå',         iso1:'SE', iso2:null,    c:[22.15, 65.58],  country:'Sweden'},
    {n:'Frankfurt',     iso1:'DE', iso2:null,    c:[8.68, 50.11],   country:'Germany'},
    {n:'Hsinchu',       iso1:'TW', iso2:null,    c:[121.00, 24.78], country:'Taiwan'},
    {n:'Singapore',     iso1:'SG', iso2:null,    c:[103.70, 1.33],  country:'Singapore'},
    {n:'Tokyo',         iso1:'JP', iso2:null,    c:[139.65, 35.68], country:'Japan'},
    {n:'Mumbai',        iso1:'IN', iso2:'IN-MH', c:[72.88, 19.08],  country:'India'},
    {n:'São Paulo',     iso1:'BR', iso2:null,    c:[-46.63, -23.55],country:'Brazil'}
  ];
  // Places the viewer added to compare against, remembered in this browser.
  var cmpCustom = [];
  try { cmpCustom = JSON.parse(localStorage.getItem('atlas.cmpCustom') || '[]').filter(function(p){
    return p && typeof p.n === 'string' && Array.isArray(p.c) && p.c.length === 2 && typeof p.iso1 === 'string';
  }); } catch (e) { cmpCustom = []; }
  function saveCustom(){ try { localStorage.setItem('atlas.cmpCustom', JSON.stringify(cmpCustom)); } catch (e) {} }
  var cmpResolved = null;   // [{n, c, r, pop, custom}] once locale data and cells are in
  function resolvePlace(p){
    return cellFor(p.c).then(function(cell){
      return {n: p.n, c: p.c, r: regionAt(p.iso1, p.iso2, p.c, p.country, cell), custom: !!p.custom,
              pop: cell && cell.vals.pop ? cell.vals.pop.v : null};
    });
  }
  function resolveCmpPlaces(){
    return Promise.all(CMP_PLACES.concat(cmpCustom.map(function(p){ return Object.assign({custom: true}, p); })).map(resolvePlace))
      .then(function(list){
        list = list.filter(function(p){ return p.r; });
        if (LOCALES && CELL_INDEX) cmpResolved = list;   // cache only the sourced answer
        return list;
      });
  }
  var cmpSort = 'C';

  // A collapsible panel section: a › eyebrow header, closed by default, open
  // or closed remembered per viewer under atlas.<key>.
  var openSections = {};
  // redraw: what to re-render on toggle (the site panel unless given)
  function disclosure(key, label, title, redraw, tip){
    if (!(key in openSections)){
      var v = null;
      try { v = localStorage.getItem('atlas.' + key); } catch (e) {}
      openSections[key] = v === 'open';
    }
    var open = openSections[key], wrap = el('div');
    var head = el('button','locs-head'); head.type = 'button';
    head.dataset.key = key;
    head.setAttribute('aria-expanded', String(open));
    head.appendChild(el('span','car','›'));
    head.appendChild(el('span','eyebrow', label));
    if (title) head.title = title;
    head.addEventListener('click', function(ev){
      ev.stopPropagation();
      openSections[key] = !open;
      try { localStorage.setItem('atlas.' + key, open ? 'closed' : 'open'); } catch (e) {}
      (redraw || renderPanel)();
      var h = document.querySelector('.locs-head[data-key="' + key + '"]'); if (h) h.focus();
    });
    if (tip){   // header row: the toggle, then its ⓘ
      var row = el('div', 'fold-h'); row.appendChild(head); row.appendChild(tipEl(tip));
      wrap.appendChild(row);
    } else wrap.appendChild(head);
    return {wrap: wrap, open: open};
  }

  // Location inputs with their level, confidence and source, folded away.
  function provSection(R){
    if (!R || !R.loc) return null;
    var d = disclosure('locationInputs', 'Location inputs', null, null,
      'The local facts behind the numbers for ' + R.n + ', like how clean the power is. Each shows whether it describes this spot, the state or the whole country, how reliable it is, and a link to where it comes from.');
    d.wrap.classList.add('fold');
    if (d.open){ var pb = provBlock(R); pb.style.marginTop = '8px'; d.wrap.appendChild(pb); }

  }

  function locsBlock(site){
    var kind = site.type && NODE_TYPES && NODE_TYPES.types[site.type] ? NODE_TYPES.types[site.type].n.toLowerCase() : 'node';
    var d = disclosure('compareLocations', 'Compare locations', null, null,
      'What if this same ' + kind + ' were built somewhere else? Each row shows how its yearly carbon, water and air pollution would change. ' +
      'Teal means better than here, amber worse.');
    var wrap = d.wrap;
    wrap.classList.add('fold');
    if (!d.open) return wrap;

    // side by side with another site on the map (moved here from the panel's bottom bar)
    var sbs = el('button', 'cl-sbs' + (state.comparing ? ' on' : ''),
      state.comparing ? 'Exit side by side' : 'Side by side with a site');
    sbs.title = 'Pick another site on the map to see the two next to each other';
    sbs.type = 'button'; sbs.setAttribute('aria-pressed', String(state.comparing));
    sbs.addEventListener('click', function(ev){ ev.stopPropagation(); toggleCompare(); });
    wrap.appendChild(sbs);
    if (!cmpResolved){
      wrap.appendChild(el('div', 'cl-foot', 'Loading places…'));
      resolveCmpPlaces().then(function(list){
        if (!cmpResolved) cmpResolved = list;   // offline: use the fallback answer for now
        if (state.selected === site.id) renderPanel();
      });
      return wrap;
    }

    var me = metrics(site, state.year);
    function variant(p){
      var s = Object.assign({}, site, {r: p.r, in: Object.assign({}, site.in), _stay: true});
      if (p.pop != null) s.in.pop = p.pop;
      return metrics(s, state.year);
    }
    function pct(a, b){ return b ? (a - b) / b * 100 : 0; }
    function deltaText(d){
      // past double, a multiple reads better than +1210%; past ten times it
      // mostly reflects a near-zero "here"
      return Math.abs(d) < 0.5 ? '±0%' : d >= 900 ? '×10+' : d >= 100 ? '×' + (1 + d / 100).toFixed(1)
           : (d > 0 ? '+' : '−') + Math.abs(d).toFixed(0) + '%';
    }

    // sort control
    var sort = el('div', 'cl-sort'); sort.appendChild(el('span', null, 'Sort'));
    [['C', 'Carbon'], ['W', 'Water'], ['A', 'Air']].forEach(function(t){
      var b = el('button', null, t[1]); b.type = 'button'; b.setAttribute('aria-pressed', String(cmpSort === t[0]));
      b.addEventListener('click', function(ev){ ev.stopPropagation(); cmpSort = t[0]; renderPanel(); });
      sort.appendChild(b);
    });
    wrap.appendChild(sort);

    var table = el('table', 'cl'), head = el('tr');
    ['Place', 'Carbon', 'Water', 'Air'].forEach(function(h){ head.appendChild(el('th', null, h)); });
    table.appendChild(head);
    // "here", with its real values
    var here = el('tr', 'me');
    here.appendChild(el('td', 'pl', 'Here'));
    [fCarbon(me.C), fWater(me.W), fAir(me.Araw)].forEach(function(f){
      var td = el('td', null, f[0]); td.appendChild(unitEl(f[1], 'u')); here.appendChild(td);
    });
    table.appendChild(here);

    var key = {C: 'dC', W: 'dW', A: 'dA'}[cmpSort];
    cmpResolved
      .filter(function(p){ return d3.geoDistance(p.c, site.c) * 6371 > 50; })   // skip where it already is
      .map(function(p){ var m = variant(p); return {p: p, dC: pct(m.C, me.C), dW: pct(m.W, me.W), dA: pct(m.Araw, me.Araw)}; })
      .sort(function(a, b){ return a[key] - b[key]; })
      .forEach(function(x){
        var tr = el('tr'), pl = el('td', 'pl', x.p.n);
        if (x.p.custom){   // one you added: removable
          var rm = el('button', 'x', '✕'); rm.type = 'button'; rm.title = 'Remove ' + x.p.n + ' from the comparison';
          rm.setAttribute('aria-label', 'Remove ' + x.p.n);
          rm.addEventListener('click', function(ev){
            ev.stopPropagation();
            cmpCustom = cmpCustom.filter(function(p){ return p.n !== x.p.n; });
            cmpResolved = cmpResolved.filter(function(p){ return p !== x.p; });
            saveCustom(); renderPanel();
          });
          pl.appendChild(rm);
        }
        tr.appendChild(pl);
        [x.dC, x.dW, x.dA].forEach(function(d){
          tr.appendChild(el('td', Math.abs(d) < 0.5 ? '' : d < 0 ? 'lo' : 'hi', deltaText(d)));
        });
        table.appendChild(tr);
      });
    wrap.appendChild(table);

    // add any city to the comparison
    var add = el('div', 'cl-add'), input = el('input'), sugg = el('div', 'cl-sugg');
    input.type = 'text'; input.placeholder = 'Add a city to compare…'; input.setAttribute('aria-label', 'Add a city to compare');
    input.autocomplete = 'off';
    var timer = null, seq = 0;
    input.addEventListener('click', function(ev){ ev.stopPropagation(); });
    input.addEventListener('input', function(){
      clearTimeout(timer);
      var q = input.value.trim(), my = ++seq;
      sugg.innerHTML = '';
      if (q.length < 3) return;
      timer = setTimeout(function(){
        geocode('forward', {q: q, types: 'place', limit: 4, autocomplete: 'true'}).then(function(list){
          if (my !== seq) return;
          sugg.innerHTML = '';
          list.forEach(function(g){
            var b = el('button', null, g.n); b.type = 'button';
            b.appendChild(el('span', 'sub', g.sub || g.country));
            b.addEventListener('click', function(ev){
              ev.stopPropagation();
              if (!g.iso1) return;
              var p = {n: g.n, c: [+g.c[0].toFixed(2), +g.c[1].toFixed(2)], iso1: g.iso1, iso2: g.iso2, country: g.country};
              cmpCustom = cmpCustom.filter(function(x){ return x.n !== p.n; }).concat([p]);
              saveCustom();
              resolvePlace(Object.assign({custom: true}, p)).then(function(r){
                if (r.r){ cmpResolved = cmpResolved.filter(function(x){ return x.n !== r.n; }).concat([r]); }
                renderPanel();
                var again = pbody.querySelector('.cl-add input'); if (again) again.focus();
              });
            });
            sugg.appendChild(b);
          });
        });
      }, 280);
    });
    add.appendChild(input); add.appendChild(sugg);
    wrap.appendChild(add);

    if (!me.R.loc) wrap.appendChild(el('div', 'cl-foot', 'This site runs on sample grid values, so the gaps are indicative.'));
    return wrap;
  }

  // Under a scenario: what changed for this site against baseline.
  function scenarioNote(site){
    if (SCEN.k === 'base') return null;
    var now = metrics(site, state.year), was = metrics(site, state.year, SCENARIOS[0]);
    var parts = [['energy','E'], ['carbon','C'], ['water','W'], ['air','Araw']].map(function(p){
      var d = was[p[1]] ? (now[p[1]] - was[p[1]]) / was[p[1]] * 100 : 0;
      return Math.abs(d) < 0.5 ? null : p[0] + ' ' + (d > 0 ? '+' : '−') + Math.abs(d).toFixed(0) + '%';
    }).filter(Boolean);
    var d = el('div','inputs');
    d.appendChild(el('span','scen-note', 'Scenario · ' + SCEN.label));
    d.appendChild(document.createElement('br'));
    d.appendChild(document.createTextNode(parts.length ? 'vs baseline · ' + parts.join(' · ') : 'No change for this site'));
    return d;
  }

  // The node's category at the top of its panel: stage and facility type, as
  // a quiet underlined control that opens a menu to switch it in place.
  function catControl(site){
    var wrap = el('div', 'cat');
    var T = site.type && NODE_TYPES ? NODE_TYPES.types[site.type] : null;
    var b = el('button', 'cat-btn'); b.type = 'button';
    b.setAttribute('aria-haspopup', 'true'); b.setAttribute('aria-expanded', 'false');
    // one line: the stage's glyph, then the facility type (the stage when untyped)
    var ty = el('span', 'cat-ty'); ty.innerHTML = glyphHTML(site.s, 12);
    ty.appendChild(document.createTextNode(T ? T.n : stageLabel[site.s]));
    b.appendChild(ty);
    b.setAttribute('aria-label', stageLabel[site.s] + (T ? ': ' + T.n : ''));
    wrap.appendChild(b);
    if (!NODE_TYPES) return wrap;
    ty.insertAdjacentHTML('beforeend', '<svg class="kcar" width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><path d="M1.5 3 L4 5.5 L6.5 3"/></svg>');
    b.title = stageLabel[site.s] + ' · change this node’s category';
    var menu = el('div', 'cat-menu'); menu.setAttribute('role', 'menu');
    STAGES.forEach(function(st){
      var ids = Object.keys(NODE_TYPES.types).filter(function(id){ return NODE_TYPES.types[id].stage === st.k; });
      if (!ids.length) return;
      var h = el('div', 'cat-h'); h.innerHTML = glyphHTML(st.k, 10) + ' ';
      h.appendChild(document.createTextNode(st.label));
      menu.appendChild(h);
      ids.forEach(function(id){
        var o = el('button', null, NODE_TYPES.types[id].n); o.type = 'button';
        o.setAttribute('role', 'menuitemradio'); o.setAttribute('aria-checked', String(id === site.type));
        o.addEventListener('click', function(ev){ ev.stopPropagation(); if (id !== site.type) changeType(site, st.k, id); else closeCat(); });
        menu.appendChild(o);
      });
    });
    wrap.appendChild(menu);
    b.addEventListener('click', function(ev){
      ev.stopPropagation();
      var on = !menu.classList.contains('open');
      closeCat();
      menu.classList.toggle('open', on);
      b.setAttribute('aria-expanded', String(on));
      if (on){ var cur = menu.querySelector('[aria-checked="true"]') || menu.querySelector('button'); if (cur) cur.focus(); }
    });
    menu.addEventListener('keydown', function(e){
      var items = Array.prototype.slice.call(menu.querySelectorAll('button')), i = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
        e.preventDefault();
        items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
      }
    });
    return wrap;
  }
  function closeCat(){
    Array.prototype.forEach.call(document.querySelectorAll('.cat-menu.open'), function(m){
      m.classList.remove('open');
      var b = m.parentNode.querySelector('.cat-btn'); if (b) b.setAttribute('aria-expanded', 'false');
    });
  }
  // Switch a node to another stage and facility type: it takes that type's
  // typical inputs, keeps its place and the people around it.
  function changeType(site, stage, id){
    var T = NODE_TYPES.types[id];
    if (!T) return;
    site.s = stage; site.type = id;
    if (!site.added) site.retyped = !(SITE_META[site.id] && SITE_META[site.id][0] === id);
    relinkAll();
    site.in = {p: T.p.v, u: T.u.v, pue: T.pue.v, g: T.g.v, pop: site.in.pop};
    site.water = okValue(T.water) ? T.water.v : null;
    markEdited(site);
    if (site.added) site.note = 'Added by hand · typical inputs for a ' + T.n.toLowerCase() + '.';
    if (!state.active[stage]){
      state.active[stage] = true;
      Array.prototype.forEach.call(stagesHost.children, function(b, i){
        if (STAGES[i].k === stage) b.setAttribute('aria-pressed', 'true');
      });
    }
    refresh();
    showToast(site.n + ' is now ' + T.n.toLowerCase());
    var again = pbody.querySelector('.cat-btn'); if (again) again.focus();
  }

  function singleView(site){
    pbody.innerHTML = '';
    pbody.appendChild(catControl(site));
    pbody.appendChild(el('h2','p-name', site.n));
    var moved = movedTo(site);
    pbody.appendChild(el('div','p-place', site.p));
    // every site describes its place from its data; before the data loads an
    // added node shows its own note, a built-in site nothing
    var facts = moved ? null : placeFacts(site);
    if (facts) pbody.appendChild(facts);
    else {
      var text = moved ? 'Moved from ' + site.n0 + ', ' + site.p0 + ' to ' + site.n + ', ' + site.p + ' in this scenario, on its grid' + (anyDataCenter(site) ? ' with free-air cooling.' : '.')
                       : site.added ? site.note : null;
      if (text) pbody.appendChild(el('p', 'p-plain', text));
    }

    // a titled section: header (with an optional control on the right), then body
    function section(title, extra, tip){
      var sec = el('div', 'sec'), h = el('div', 'sec-h');
      h.appendChild(el('span', 'eyebrow', title));
      if (tip) h.appendChild(tipEl(tip));
      if (extra){ extra.style.marginLeft = 'auto'; h.appendChild(extra); }
      sec.appendChild(h);
      pbody.appendChild(sec);
      return sec;
    }

    // footprint: the four metrics, the scenario change, the formulas' inputs
    var fbtn = el('button', null, 'formulas');
    fbtn.type='button'; fbtn.setAttribute('aria-pressed', String(state.formulas));
    fbtn.title = 'Show the equation behind each value · bars are scaled against the largest site';
    fbtn.addEventListener('click', function(){ state.formulas = !state.formulas; renderPanel(); });
    var foot = section('Footprint per year', fbtn,
      'How much this site uses and gives off in a year. The bars compare it with the biggest site on the map. Press “formulas” to see how each number is worked out.');
    var mb = metricBlock(site);
    foot.appendChild(mb);
    var sn = scenarioNote(site);
    if (sn){ sn.style.marginTop = '8px'; foot.appendChild(sn); }
    var ib = inputsBlock(site);
    if (ib){ ib.style.marginTop = '8px'; foot.appendChild(ib); }

    // size, for data centers
    var sz = sizeBlock(site, function(){   // while dragging, redraw only the bars
      var nb = metricBlock(site); foot.replaceChild(nb, mb); mb = nb;
    });
    if (sz){
      var R0 = SIZE_RANGE[site.type];
      var ss = section('Size', null, 'How much power the computers inside use, from ' + R0[0] + ' MW to ' + (R0[1] >= 1000 ? R0[1] / 1000 + ' GW' : R0[1] + ' MW') +
        '. A megawatt (MW) is about what 800 US homes use. “Typical” is a normal size for this kind of site.');
      sz.style.marginTop = '6px'; ss.appendChild(sz);
    }

    // where it sits in the chain
    var ch = chainBlock(site);
    if (ch){
      var cs = section('Supply chain', null, 'Where this site gets its supplies, and where it sends what it makes. ' +
        'Names with a dotted underline were linked automatically to the closest match; point at one to see why.');
      ch.style.marginTop = '4px'; cs.appendChild(ch);
    }

    // folded detail
    pbody.appendChild(locsBlock(site));
    var ps = provSection(REGIONS[moved && moved.r ? moved.r : site.r]);   // a moved site shows its new place
    if (ps) pbody.appendChild(ps);
  }

  // The empty side of a side-by-side: type a site on the map, or any city to
  // see this same site placed there. Clicking a site on the map still works.
  function comparePicker(a){
    var box = el('div', 'cmp-pick'), input = el('input'), list = el('div', 'cl-sugg');
    input.type = 'text'; input.placeholder = 'Type a site or city…'; input.autocomplete = 'off';
    input.setAttribute('aria-label', 'Type a site or city to compare with ' + a.n);
    box.appendChild(input); box.appendChild(list);
    box.appendChild(el('div', 'cmp-hint2', 'or click a site on the map'));
    var timer = null, seq = 0;
    function option(label, sub, run){
      var b = el('button', null, label); b.type = 'button';
      if (sub) b.appendChild(el('span', 'sub', sub));
      b.addEventListener('click', function(ev){ ev.stopPropagation(); run(); });
      list.appendChild(b);
    }
    input.addEventListener('click', function(ev){ ev.stopPropagation(); });
    input.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter'){ var first = list.querySelector('button'); if (first) first.click(); }
    });
    input.addEventListener('input', function(){
      clearTimeout(timer);
      var q = input.value.trim().toLowerCase(), my = ++seq;
      list.innerHTML = '';
      if (!q) return;
      // sites on the map first
      SITES.filter(function(s){ return s.id !== a.id && visible(s) && s.n.toLowerCase().indexOf(q) >= 0; }).slice(0, 4)
        .forEach(function(s){ option(s.n, stageLabel[s.s], function(){ state.compare = s.id; state.compareVirtual = null; drawFlows(); renderPanel(); }); });
      if (q.length < 3) return;
      timer = setTimeout(function(){
        geocode('forward', {q: q, types: 'place', limit: 4, autocomplete: 'true'}).then(function(found){
          if (my !== seq) return;
          found.forEach(function(g){
            if (!g.iso1) return;
            option(g.n, (g.sub || g.country) + ' · same site there', function(){
              var c = [+g.c[0].toFixed(2), +g.c[1].toFixed(2)];
              cellFor(c).then(function(cell){
                var r = regionAt(g.iso1, g.iso2, c, g.country, cell);
                if (!r){ showToast('No grid data for ' + g.n + ' yet'); return; }
                var v = Object.assign({}, a, {id: '__cmp', n: g.n, p: g.sub || g.country, c: c, r: r, virtual: true, _stay: true,
                                              in: Object.assign({}, a.in, cell && cell.vals.pop ? {pop: cell.vals.pop.v} : {})});
                state.compareVirtual = v; state.compare = '__cmp';
                drawFlows(); renderPanel();
              });
            });
          });
        });
      }, 280);
    });
    setTimeout(function(){ input.focus(); }, 0);
    return box;
  }

  function compareView(a, b){
    pbody.innerHTML = '';
    var head = el('div','cmp-grid');
    [[a,'a'],[b,'b']].forEach(function(pair){
      var col = el('div','cmp-col ' + pair[1]);
      if (!pair[0]){
        col.appendChild(el('span','eyebrow','Compare with'));
        col.appendChild(comparePicker(a));
      } else {
        col.appendChild(el('span','eyebrow', pair[0].virtual ? 'Same site, in' : stageLabel[pair[0].s]));
        var h = el('h2','p-name', pair[0].n); h.style.fontSize = '19px';
        col.appendChild(h);
        col.appendChild(el('div','p-place', pair[0].p));
        if (pair[1] === 'b'){   // pick again
          var ch = el('button', 'cmp-change', 'Change'); ch.type = 'button';
          ch.addEventListener('click', function(ev){ ev.stopPropagation(); state.compare = null; state.compareVirtual = null; drawFlows(); renderPanel(); });
          col.appendChild(ch);
        }
      }
      head.appendChild(col);
    });
    pbody.appendChild(head);

    if (b){
      var ra = rows(a, state.year), rb = rows(b, state.year);
      var ma = metrics(a, state.year), mb = metrics(b, state.year);
      var raw = [[ma.E,mb.E],[ma.C,mb.C],[ma.W,mb.W],[ma.Araw,mb.Araw]];
      var grid = el('div','cmp-rows'); grid.style.marginTop = '14px';
      ra.forEach(function(r, i){
        var row = el('div','cmp-row');
        var av = el('span','a-v', r.d[0] + ' '); av.appendChild(unitEl(r.d[1]));
        var k = el('span','k', r.k);
        var bv = el('span','b-v', rb[i].d[0] + ' '); bv.appendChild(unitEl(rb[i].d[1]));
        row.appendChild(av); row.appendChild(k); row.appendChild(bv);
        grid.appendChild(row);

        var pct = raw[i][0] === 0 ? 0 : ((raw[i][1] - raw[i][0]) / raw[i][0]) * 100;
        var dl = el('div','cmp-row');
        var same = Math.abs(pct) < 0.5;   // no change reads neutral, not worse
        var sp = el('span','delta ' + (same ? '' : pct > 0 ? 'up' : 'down'));
        sp.textContent = (same ? '±0%' : (pct > 0 ? '+' : '−') + Math.abs(pct).toFixed(0) + '%') + ' in ' + b.n;
        sp.style.gridColumn = '1 / -1';
        sp.style.textAlign = 'right';
        dl.style.borderBottom = 'none'; dl.style.padding = '0 0 6px';
        dl.appendChild(sp);
        grid.appendChild(dl);
      });
      pbody.appendChild(grid);

      var foot = el('div','inputs'); foot.style.marginTop = '10px';
      [[a, ma], [b, mb]].forEach(function(x, i){   // whose power each side runs on
        if (i) foot.appendChild(el('br'));
        foot.appendChild(el('b', null, x[0].n));
        foot.appendChild(document.createTextNode(' runs on the ' + x[1].R.n + ' grid, ' + x[1].ci.toFixed(0) + ' '));
        foot.appendChild(unitEl('g/kWh', ''));
      });
      pbody.appendChild(foot);
    }
  }

  function renderPanel(){ drawPanel(); syncPadding(); }

  // Keep the map centred in the part the panel leaves visible.
  var padLeft = 0;
  var padRight = 0;
  function syncPadding(){
    var w = !panel.classList.contains('open') ? 0
          : Math.min(panel.classList.contains('wide') ? 452 : 302, box.clientWidth * 0.88);
    var r = statsOpen ? Math.min(302, box.clientWidth * 0.88) : 0;
    if (w === padLeft && r === padRight) return;
    padLeft = w; padRight = r;
    map.easeTo({padding: {left: w, top: 0, right: r, bottom: 0}, duration: ready ? 400 : 0});
  }

  function drawPanel(){
    var id = state.selected;
    if (!id){ panel.classList.remove('open','wide'); return; }
    if (isCountryId(id)){
      panel.classList.add('open'); panel.classList.remove('wide');
      countryView(id.slice(2));
      pactions.innerHTML = ''; pactions.style.display = 'none';
      return;
    }
    if (cityById[id]){
      panel.classList.add('open'); panel.classList.remove('wide');
      cityView(cityById[id]);
      // an empty location can be removed from its panel, as a node can
      pactions.innerHTML = ''; pactions.style.display = '';
      var lb = el('button', 'danger', 'Remove');
      lb.type = 'button';
      lb.title = 'Removes this location from the map';
      lb.addEventListener('click', function(ev){ ev.stopPropagation(); dropCity(cityById[id]); });
      pactions.appendChild(lb);
      return;
    }
    pactions.style.display = '';
    var a = byId[id];
    if (!a){ panel.classList.remove('open','wide'); return; }
    panel.classList.add('open');
    panel.classList.toggle('wide', state.comparing);
    if (state.comparing) compareView(a, state.compare === '__cmp' ? state.compareVirtual : state.compare ? byId[state.compare] : null);
    else singleView(a);

    pactions.innerHTML = '';
    if (state.comparing){   // while side by side, the way out stays in reach
      var cb = el('button', null, 'Exit side-by-side');
      cb.type='button'; cb.setAttribute('aria-pressed', 'true');
      cb.addEventListener('click', function(ev){ ev.stopPropagation(); toggleCompare(); });
      pactions.appendChild(cb);
    }
    var ub = el('button', null, 'Upstream');
    ub.type='button';
    ub.addEventListener('click', function(ev){
      ev.stopPropagation();
      var up = allFlows().filter(function(f){ return f[1]===state.selected && live(f[0]); });
      if (up.length) pick(up[0][0]);
    });
    pactions.appendChild(ub);
    var rb = el('button','danger','Remove');
    rb.type='button';
    rb.title = 'Removes the node and its place from the map';
    rb.addEventListener('click', function(ev){ ev.stopPropagation(); removeNode(a); });
    pactions.appendChild(rb);
  }

  /* ------------------------ add and remove nodes ------------------------- */
  // A node starts from its facility type's typical inputs (data/node-types.json)
  // when there is one, else from the stage's sample set; either way it takes
  // the people within 100 km from its cell when that's known.
  function addNode(city, stage, typeId){
    var T = typeId && NODE_TYPES ? NODE_TYPES.types[typeId] : null, D = DEFAULT_INPUTS[stage];
    function tv(k){ return T && okValue(T[k]) ? T[k].v : D[k]; }
    var cellPop = city.cell && city.cell.vals.pop ? city.cell.vals.pop.v : null;
    var site = {
      id: city.id, n: city.n, p: city.p, s: stage, c: city.c, r: city.r,
      note: T ? 'Added by hand · typical inputs for a ' + T.n.toLowerCase() + '.'
              : 'Added by hand · starting from sample inputs for ' + stageLabel[stage].toLowerCase() + '.',
      in: {p: tv('p'), u: tv('u'), pue: tv('pue'), g: tv('g'), pop: cellPop != null ? cellPop : D.pop},
      popDefault: cellPop == null,
      type: T ? typeId : null, water: T && okValue(T.water) ? T.water.v : null,
      added: true, placed: city.placed, iso1: city.iso1, iso2: city.iso2, mid: city.mid, cell: city.cell
    };
    SITES = SITES.concat([site]);
    byId[site.id] = site;
    markEdited(site);
    relinkAll();
    CITIES = CITIES.filter(function(c){ return c.id !== city.id; });
    delete cityById[city.id];
    if (!state.active[stage]){
      state.active[stage] = true;
      Array.prototype.forEach.call(stagesHost.children, function(b, i){
        if (STAGES[i].k === stage) b.setAttribute('aria-pressed','true');
      });
    }
    state.selected = site.id;
    refresh();
  }

  // Remove a node completely: the site and its place leave the map, and its
  // supply links go with it (flows to a missing site aren't drawn). Built-in
  // sites come back on reload, since edits aren't saved yet.
  function removeNode(site){
    markEdited(null);
    SITES = SITES.filter(function(x){ return x.id !== site.id; });
    delete byId[site.id];
    relinkAll();
    if (state.compare === site.id) state.compare = null;
    if (state.selected === site.id){ state.selected = null; state.comparing = false; }
    hideTip();
    refresh();
    showToast('Removed ' + site.n);
  }

  // Location inputs for a locale-built region: value, the level it came from
  // (US-TX or US) and its confidence, linked to the source.
  // f formats the number, u is its unit (named on hover).
  var PROV_ROWS = [
    {k:'ci',  lbl:'Power pollution', u:'g/kWh', f:function(v){ return v.toFixed(0); }},
    {k:'fos', lbl:'Fossil power', u:'%',     f:function(v){ return (v * 100).toFixed(0); }},
    {k:'dec', lbl:'Getting cleaner', u:'%/yr',  f:function(v){ return (v >= 0 ? '−' : '+') + Math.abs(v * 100).toFixed(1); }},
    // climate estimate assuming a cooling tower: an upper bound where free cooling is used
    {k:'wue', lbl:'Cooling water', u:'L/kWh', f:function(v){ return '≤ ' + v.toFixed(2); }},
    {k:'wue_disclosed', lbl:'Company figure', u:'L/kWh', f:function(v){ return v.toFixed(2); }},
    {k:'ws',  lbl:'Water scarcity', u:'0–1',   f:function(v){ return v.toFixed(2); }},
    {k:'pm25', lbl:'Air pollution', u:'µg/m³', f:function(v){ return v.toFixed(0); }},
    {k:'pop', lbl:'People nearby', u:'≤100 km', f:function(v){ return fmtPop(v); }}
  ];
  function fmtPop(m){ return m >= 1 ? m.toFixed(1) + ' M' : m < 0.001 ? '< 1k' : Math.round(m * 1000) + 'k'; }
  function provBlock(R){
    if (!R || !R.loc) return null;
    var g = el('div','prov');
    PROV_ROWS.forEach(function(row){
      var x = R.loc[row.k];
      if (!x) return;
      g.appendChild(el('b', null, row.lbl));
      var val = el('span', null, row.f(x.v));
      if (row.u === '0–1') val.setAttribute('data-unit', '0–1');   // unitless scale: explain on the value
      else { if (row.u !== '%') val.appendChild(document.createTextNode(' ')); val.appendChild(unitEl(row.u, '')); }
      g.appendChild(val);
      var lv = el('span','lv' + (x.conf === 'sample' ? ' sample' : ''));
      var txt = (x.level === 'cell' ? 'local' : x.level) + ' · ' + x.conf;
      var src = sourceOf(x.src);
      if (src && src.url){
        var a = el('a', null, txt); a.href = src.url; a.target = '_blank'; a.rel = 'noopener';
        a.title = [src.title, x.year, x.basis, x.note].filter(Boolean).join(' · ');
        lv.appendChild(a);
      } else lv.textContent = txt;
      g.appendChild(lv);
    });
    if (R.loc.unused){
      var fmtOf = {}; PROV_ROWS.forEach(function(row){ fmtOf[row.k] = row; });
      var u = R.loc.unused, n = el('span', null,
        'Not used · ' + u[0].levelName + ' ' + u.map(function(x){
          var l = fmtOf[x.k].lbl;
          var r = fmtOf[x.k];
          return (l === l.toUpperCase() ? l : l.toLowerCase()) + ' ' + r.f(x.v) +
                 (r.u === '%' ? '%' : r.u === '0–1' ? '' : ' ' + r.u);
        }).join(', ') + ' — its grid data is incomplete, so the grid comes from ' + R.loc.ci.levelName + '.');
      n.style.gridColumn = '1 / -1';
      n.style.marginTop = '3px';
      g.appendChild(n);
    }
    return g;
  }
