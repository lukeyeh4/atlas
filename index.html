  function isCountryId(id){ return typeof id === 'string' && id.indexOf('c:') === 0; }
  var countryNames = {};
  function openCountry(iso, name){
    if (!iso) return;
    if (name) countryNames[iso] = name;
    state.comparing = false; state.compare = null;
    select('c:' + iso);
  }

  // Each value against every country that has it; "better" sets what the bar
  // and the caption count (a share of countries this one beats).
  var RANK_ROWS = [
    {k:'ci',   lbl:'Power pollution', u:'g/kWh', f:function(v){ return v.toFixed(0); }, low:true,  say:'cleaner power than'},
    {k:'fos',  lbl:'Fossil share',  u:'%',     f:function(v){ return (v * 100).toFixed(0); }, low:true, say:'less fossil power than'},
    {k:'dec',  lbl:'Trend',         u:'%/yr',  f:function(v){ return (v >= 0 ? '−' : '+') + Math.abs(v * 100).toFixed(1); }, low:false, say:'decarbonising faster than'},
    {k:'ws',   lbl:'Water scarcity', u:'0–1',   f:function(v){ return v.toFixed(2); }, low:true,  say:'more water to spare than'},
    {k:'wue',  lbl:'Cooling water', u:'L/kWh', f:function(v){ return '≤ ' + v.toFixed(2); }, low:true, say:'needs less cooling water than'},
    {k:'pm25', lbl:'Air pollution', u:'µg/m³', f:function(v){ return v.toFixed(0); }, low:true,  say:'cleaner air than'}
  ];
  function rankOf(k, v, low){
    var vals = [];
    Object.keys(LOCALES.countries).forEach(function(c){ var x = LOCALES.countries[c][k]; if (okValue(x)) vals.push(x.v); });
    var beat = vals.filter(function(w){ return low ? w > v : w < v; }).length;
    return {share: vals.length > 1 ? beat / (vals.length - 1) : 0, n: vals.length};
  }
  // the diagram part a site belongs to (built-in by id, added by type)
  function partOf(site){
    if (site.added || site.retyped) return VIZ_TYPES[site.type] || null;
    for (var id in VIZ_SITES) if (VIZ_SITES[id].indexOf(site.id) >= 0) return id;
    return null;
  }

  function countryView(iso){
    var rec = LOCALES && LOCALES.countries[iso], name = countryNames[iso] || (rec && rec.n) || iso;
    pbody.innerHTML = '';
    // header: a small flag set into the eyebrow line
    var head = el('div', 'c-head');
    var flag = el('img', 'flag'); flag.alt = ''; flag.width = 18; flag.height = 13;
    flag.src = 'https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/flags/4x3/' + iso.toLowerCase() + '.svg';
    flag.addEventListener('error', function(){ flag.remove(); });
    head.appendChild(flag);
    head.appendChild(el('span', 'eyebrow', 'Country · ' + iso));
    pbody.appendChild(head);
    pbody.appendChild(el('h2', 'p-name', name));

    var mine = SITES.filter(function(s){ return s.iso1 === iso; });
    var subs = LOCALES ? Object.keys(LOCALES.subdivisions).filter(function(k){ return k.indexOf(iso + '-') === 0; }) : [];
    var bits = [];
    if (mine.length) bits.push(mine.length + ' site' + (mine.length > 1 ? 's' : '') + ' on the map');
    if (subs.length) bits.push(subs.length + (iso === 'US' ? ' states' : ' states and provinces') + ' with data');
    if (bits.length) pbody.appendChild(el('div', 'p-place', bits.join(' · ')));

    if (COUNTRY_NOTES[iso]){
      var note = el('p', 'p-note', COUNTRY_NOTES[iso]); note.style.marginTop = '12px';
      pbody.appendChild(note);
    }

    // its part in the chain, from its sites: each part once, chokepoints marked
    var parts = [];
    mine.forEach(function(s){ var p = partOf(s); if (p && parts.indexOf(p) < 0) parts.push(p); });
    if (parts.length){
      var role = el('div', 'c-role');
      role.appendChild(el('span', 'eyebrow', 'In the chain'));
      var line = el('div', 'c-parts');
      parts.forEach(function(pid){
        var n = VIZ_NODES.filter(function(x){ return x.id === pid; })[0];
        var chip = el('span', 'c-part' + (n.choke ? ' choke' : ''), n.n);
        if (n.choke) chip.title = 'A chokepoint: few places in the world can do this';
        line.appendChild(chip);
      });
      role.appendChild(line);
      pbody.appendChild(role);
    }

    // values, each with how it ranks
    var have = RANK_ROWS.filter(function(r){ return rec && okValue(rec[r.k]); });
    if (!have.length){
      var none = el('p', 'p-note', 'No grid, water or air values for ' + name + ' in the data yet.');
      none.style.marginTop = '12px';
      pbody.appendChild(none);

    }
    var lbl = el('span', 'eyebrow', 'How it compares'); lbl.style.marginTop = '14px';
    pbody.appendChild(lbl);
    var wrap = el('div', 'metrics c-metrics'); wrap.style.marginTop = '4px';
    have.forEach(function(r){
      var x = rec[r.k], rk = rankOf(r.k, x.v, r.low);
      var m = el('div', 'm'), top = el('div', 'm-top');
      top.appendChild(el('span', 'm-lbl', r.lbl));
      top.appendChild(el('span', 'm-dots'));
      var v = el('span', 'm-val', r.f(x.v));
      if (r.u === '0–1') v.setAttribute('data-unit', '0–1');
      else { if (r.u !== '%') v.appendChild(document.createTextNode(' ')); v.appendChild(unitEl(r.u)); }
      top.appendChild(v);
      m.appendChild(top);
      var bar = el('div', 'm-bar'), fill = el('i'); fill.style.width = (rk.share * 100).toFixed(1) + '%';
      bar.appendChild(fill); m.appendChild(bar);
      m.appendChild(el('div', 'c-cap', r.say + ' ' + Math.round(rk.share * 100) + '% of ' + rk.n + ' countries'));
      wrap.appendChild(m);
    });
    pbody.appendChild(wrap);

    // what a typical training data center here would use in a year
    var R = localeRegion(iso, null, name, null), T = NODE_TYPES && NODE_TYPES.types['dc-training'];
    if (R && T){
      var probe = {id: '__country', s: 'infra', type: 'dc-training', r: R, water: null, added: true,
                   in: {p: T.p.v, u: T.u.v, pue: T.pue.v, g: T.g.v, pop: 0}};
      var mm = metrics(probe, state.year, SCENARIOS[0]), e = fEnergy(mm.E), c = fCarbon(mm.C), w = fWater(mm.W);
      var dc = el('div', 'inputs c-inputs'); dc.style.marginTop = '10px';
      dc.appendChild(document.createTextNode('A typical ' + T.p.v + ' MW training data center here: '));
      [[e, ''], [c, ''], [w, '']].forEach(function(pair, i){
        var b = el('b', null, pair[0][0] + ' '); dc.appendChild(b); dc.appendChild(unitEl(pair[0][1], ''));
        dc.appendChild(document.createTextNode(i < 2 ? ' · ' : ' a year'));
      });
      pbody.appendChild(dc);
    }

    // states or provinces: the cleanest and dirtiest grids
    var withCi = subs.filter(function(k){ return okValue(LOCALES.subdivisions[k].ci); })
      .sort(function(a, b){ return LOCALES.subdivisions[a].ci.v - LOCALES.subdivisions[b].ci.v; });
    if (withCi.length > 1){
      var lo = LOCALES.subdivisions[withCi[0]], hi = LOCALES.subdivisions[withCi[withCi.length - 1]];
      var st = el('div', 'inputs c-inputs'); st.style.marginTop = '6px';
      st.appendChild(document.createTextNode('Cleanest grid: '));
      st.appendChild(el('b', null, lo.n + ' ' + Math.round(lo.ci.v)));
      st.appendChild(document.createTextNode(' · dirtiest: '));
      st.appendChild(el('b', null, hi.n + ' ' + Math.round(hi.ci.v)));
      st.appendChild(document.createTextNode(' '));
      st.appendChild(unitEl('g/kWh', ''));
      pbody.appendChild(st);
    }

    // its sites, as links
    if (mine.length){
      var sl = el('span', 'eyebrow', 'Sites'); sl.style.marginTop = '14px'; sl.style.marginBottom = '5px';
      pbody.appendChild(sl);
      var list = el('div', 'chain');
      mine.forEach(function(s){
        var b = el('button', 'lk'); b.type = 'button';
        var g = el('span', 'ar'); g.innerHTML = glyphHTML(s.s, 10); b.appendChild(g);
        b.appendChild(el('span', 'nm', s.n));
        b.addEventListener('click', function(ev){ ev.stopPropagation(); pick(s.id); focusOn(s.c); });
        list.appendChild(b);
      });
      pbody.appendChild(list);
    }

    // every value with its source and confidence, folded away
    var d = disclosure('countrySources', 'Sources and confidence', 'Each value with its source, year and confidence');
    if (d.open){ var pb = provBlock({loc: localeFor(iso, null)}); if (pb){ pb.style.marginTop = '6px'; d.wrap.appendChild(pb); } }
    d.wrap.style.marginTop = '14px';
    pbody.appendChild(d.wrap);
    if (COUNTRY_NOTES[iso]){
      var fn = el('div', 'c-foot', 'The note above is context summarised from public reporting, not from the data files.');
      pbody.appendChild(fn);
    }
  }

  // The place as a short list of plain facts: power, people, water, air.
  // Only sourced values; each says whether it's local or an average.
  function placeFacts(d){
    var R = REGIONS[d.r];
    if (!R || !R.loc || !R.loc.ci) return null;
    var L = R.loc, rows = [];
    function real(x){ return !!x && x.conf !== 'sample'; }
    function where(x){ return x.level === 'cell' ? 'right here' : (x.level.length === 2 ? (countryNames[x.level] || (LOCALES && LOCALES.countries[x.level] && LOCALES.countries[x.level].n) || x.level) : x.levelName) + ' average'; }
    // [label, verdict, tip head (bold), tip head (rest), unit whose sentence explains it]
    var ci = L.ci.v;
    rows.push(['Power', ci < 100 ? 'Very clean' : ci < 250 ? 'Fairly clean' : ci < 450 ? 'Mixed' : ci < 650 ? 'Mostly fossil' : 'Coal-heavy',
               Math.round(ci) + ' g/kWh', L.ci.levelName, 'g/kWh']);
    if (real(L.pop)) rows.push(['People nearby', L.pop.v < 0.001 ? 'Almost no one' : fmtPop(L.pop.v),
                                fmtPop(L.pop.v) + ' people', 'within 100 km', '≤100 km']);
    if (real(L.ws)){
      var ws = L.ws.v;
      rows.push(['Water', ws >= .8 ? 'Extremely scarce' : ws >= .6 ? 'Scarce' : ws >= .4 ? 'Under pressure' : ws >= .2 ? 'Some pressure' : 'Plenty',
                 'Scarcity ' + ws.toFixed(2), L.ws.level === 'cell' ? 'this river basin' : where(L.ws), '0–1']);
    }
    if (real(L.pm25)){
      var pm = L.pm25.v;
      rows.push(['Air pollution', pm > 35 ? 'Very polluted' : pm > 15 ? 'Polluted' : pm > 5 ? 'Moderate' : 'Clean',
                 Math.round(pm) + ' µg/m³', L.pm25.level === 'cell' ? 'right here' : where(L.pm25), 'µg/m³']);
    }
    var g = el('div', 'facts');
    rows.forEach(function(r){
      g.appendChild(el('span', 'k', r[0]));
      var v = el('span', 'v'), b = el('b', null, r[1]);
      b.setAttribute('data-tip', UNITS[r[4]][1]);
      b.setAttribute('data-tip-b', r[2]);
      b.setAttribute('data-tip-h', r[3]);
      v.appendChild(b);
      g.appendChild(v);
    });
    return g;
  }

  var addStage = null;   // {city, stage} while a stage's facility types are open
  function cityView(city){
    var R = REGIONS[city.r];
    pbody.innerHTML = '';
    pbody.appendChild(el('span','eyebrow','Unassigned location'));
    pbody.appendChild(el('h2','p-name', city.n));
    pbody.appendChild(el('div','p-place', city.p));
    var facts = R ? placeFacts(city) : null;
    if (facts) pbody.appendChild(facts);
    else pbody.appendChild(el('p', 'p-plain', !R ? 'No power data for this place yet, so it can’t be modelled.'
                                                 : 'No node here yet. Add one below.'));
    if (!R) return;

    // Two levels: the five stages, then the chosen stage's facility types.
    // Without data/node-types.json a stage adds its sample node directly.
    function typesOf(stage){
      return NODE_TYPES ? Object.keys(NODE_TYPES.types).filter(function(id){ return NODE_TYPES.types[id].stage === stage; }) : [];
    }
    var open = addStage && addStage.city === city.id && typesOf(addStage.stage).length ? addStage.stage : null;
    var lbl = el('span','eyebrow', open ? 'Add node · ' + stageLabel[open] : 'Add node'); lbl.style.marginTop = '14px';
    pbody.appendChild(lbl);
    var row = el('div','addrow'); row.style.marginTop = '6px';
    function choice(glyph, label, mark, run, cls){
      var b = el('button', cls); b.type = 'button';
      if (glyph) b.innerHTML = glyphHTML(glyph, 15);
      b.appendChild(el('span', null, label));
      b.appendChild(el('span','plus', mark));
      b.addEventListener('click', function(ev){ ev.stopPropagation(); run(); });
      row.appendChild(b);
    }
    function focusFirst(sel){ var b = pbody.querySelector(sel); if (b) b.focus(); }
    if (!open){
      STAGES.forEach(function(st){
        var types = typesOf(st.k);
        choice(st.k, st.label, types.length ? '›' : '+', function(){
          if (!types.length){ addNode(city, st.k); return; }
          addStage = {city: city.id, stage: st.k};
          renderPanel();
          focusFirst('.addrow button.type');
        });
      });
    } else {
      choice(null, '‹ All stages', '', function(){
        addStage = null;
        renderPanel();
        focusFirst('.addrow button');
      }, 'back');
      typesOf(open).forEach(function(id){
        choice(open, NODE_TYPES.types[id].n, '+', function(){ addStage = null; addNode(city, open, id); }, 'type');
      });
    }
    pbody.appendChild(row);

    var foot = el('div','inputs'); foot.style.marginTop = '10px';
    var ps = provSection(R);
    if (ps){ ps.style.marginTop = '14px'; pbody.appendChild(ps); return; }
    foot.innerHTML = 'Starts from sample inputs · <b>CI</b> ' +
      ciFor(city.r, state.year).toFixed(0) + ' g/kWh · <b>WUE</b> ' +
      R.wue.toFixed(1) + ' L/kWh';
    pbody.appendChild(foot);
  }

  function toggleCompare(){
    state.comparing = !state.comparing;
    if (!state.comparing) state.compare = null;
    drawFlows(); renderPanel();
  }

  function pick(id){
    hideTip();
    if (cityById[id]){ state.comparing = false; state.compare = null; state.selected = id; }
    else if (state.comparing && state.selected && id !== state.selected){ state.compare = id; }
    else { state.selected = id; }
    drawFlows(); renderPanel();
  }
  function select(id){
    state.selected = id;
    if (!id) state.compare = null;
    drawFlows(); renderPanel();
  }

  /* ----------------------------- context menu ----------------------------
     Right-click (or long-press) the map for actions on whatever is under
     the pointer: a site, a placeholder, or open ground.
     ----------------------------------------------------------------------- */
  var ctx = document.getElementById('ctx');
  var toast = document.getElementById('toast');
  var glHost = document.getElementById('gl');
  var ctxOpenedAt = 0;

  // 12px line icons, drawn like the search glyph.
  var CI = {
    open:    'M1.5 2.5h9v7h-9z M4.5 2.5v7',
    add:     'M6 2v8 M2 6h8',
    compare: 'M1.5 4h8.5 M8 2l2 2-2 2 M10.5 8H2 M4 6l-2 2 2 2',
    up:      'M6 10.5V2 M3 5l3-3 3 3',
    zoom:    'M8.4 5a3.4 3.4 0 1 1-6.8 0a3.4 3.4 0 1 1 6.8 0 M7.6 7.6l2.9 2.9 M5 3.5v3 M3.5 5h3',
    copy:    'M4 4h6.5v6.5H4z M2 8V1.5h6.5',
    remove:  'M3 3l6 6 M9 3l-6 6'
  };
  function ctxIcon(k){
    return '<svg class="ci" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="' + CI[k] + '"></path></svg>';
  }

  function closeCtx(){
    if (ctx.hidden) return;
    ctx.hidden = true; ctx.innerHTML = '';
  }

  function openCtx(x, y, head, items, viaKeyboard){
    hideTip(); closeLayer(); closeResults();
    ctx.innerHTML = '';
    var h = el('div','ctx-head');
    if (head.eyebrow){
      var eb = el('span','eyebrow');
      eb.innerHTML = head.glyph || '';
      eb.appendChild(document.createTextNode(head.eyebrow));
      h.appendChild(eb);
    }
    h.appendChild(el('div','ctx-name', head.name));
    if (head.sub) h.appendChild(el('div','ctx-sub', head.sub));
    ctx.appendChild(h);
    ctx.setAttribute('aria-label', head.name);

    items.forEach(function(it){
      if (it === '-'){ ctx.appendChild(el('div','ctx-sep')); return; }
      var b = el('button', it.danger ? 'danger' : null);
      b.type = 'button'; b.tabIndex = -1;
      b.setAttribute('role','menuitem');
      b.innerHTML = ctxIcon(it.icon);
      b.appendChild(el('span','ctx-lbl', it.label));
      if (it.hint) b.appendChild(el('span','ctx-hint', it.hint));
      if (it.disabled) b.setAttribute('aria-disabled','true');
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        if (it.disabled) return;
        closeCtx(); it.run();
      });
      ctx.appendChild(b);
    });

    ctx.hidden = false;
    ctxOpenedAt = Date.now();
    // keep it inside the map; open upward near the bottom edge
    var W = box.clientWidth, H = box.clientHeight, w = ctx.offsetWidth, hh = ctx.offsetHeight;
    var left = Math.max(8, Math.min(x, W - w - 8));
    var up = y + hh > H - 8;
    var top = up ? Math.max(8, y - hh) : y;
    ctx.style.left = left + 'px'; ctx.style.top = top + 'px';
    ctx.style.transformOrigin = (x - left) + 'px ' + (up ? hh + 'px' : '0');
    var first = ctx.querySelector('button:not([aria-disabled])');
    (viaKeyboard && first ? first : ctx).focus({preventScroll: true});
  }

  ctx.addEventListener('keydown', function(e){
    var btns = Array.prototype.filter.call(ctx.querySelectorAll('button'), function(b){
      return !b.hasAttribute('aria-disabled');
    });
    var i = btns.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      var step = e.key === 'ArrowDown' ? 1 : -1;
      var n = i < 0 ? (step > 0 ? 0 : btns.length - 1) : (i + step + btns.length) % btns.length;
      if (btns[n]) btns[n].focus();
    } else if (e.key === 'Home' || e.key === 'End'){
      e.preventDefault();
      if (btns.length) btns[e.key === 'Home' ? 0 : btns.length - 1].focus();
    } else if (e.key === 'Escape' || e.key === 'Tab'){
      e.preventDefault(); e.stopPropagation(); closeCtx();
    }
  });
  ctx.addEventListener('click', function(e){ e.stopPropagation(); });
  ctx.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  var toastTimer = null;
  function showToast(text){
    toast.textContent = text;
    toast.style.marginLeft = (padLeft / 2) + 'px';   // centre in the visible map
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('on'); }, 1600);
  }

  function zoomItem(c){
    return {icon:'zoom', label:'Zoom to', run:function(){ focusOn(c, 5.5); }};
  }
  function copyItem(c){
    return {icon:'copy', label:'Copy coordinates', run:function(){
      var text = c[1].toFixed(4) + ', ' + c[0].toFixed(4);
      var done = function(){ showToast('Copied ' + fmtCoord(c)); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done, function(){ showToast(text); });
      } else showToast(text);
    }};
  }

  function siteItems(d){
    var cur = (state.selected && byId[state.selected] && state.selected !== d.id) ? byId[state.selected] : null;
    var up = allFlows().filter(function(f){ return f[1] === d.id && live(f[0]); });
    var items = [{icon:'open', label:'Open details', run:function(){ pick(d.id); }}];
    if (cur) items.push({icon:'compare', label:'Compare with ' + cur.n, run:function(){
      state.comparing = true; state.compare = d.id;
      drawFlows(); renderPanel();
    }});
    if (up.length) items.push({icon:'up', label:'Go upstream', hint: byId[up[0][0]].n, run:function(){
      pick(up[0][0]); focusOn(byId[up[0][0]].c);
    }});
    items.push('-', zoomItem(d.c), copyItem(d.c), '-',
      {icon:'remove', label:'Remove node', danger:true, run:function(){ removeNode(d); }});
    return items;
  }

  function cityItems(d){
    var items = [{icon:'add', label:'Add node…', run:function(){ pick(d.id); }},
                 '-', zoomItem(d.c), copyItem(d.c)];
    items.push('-', {icon:'remove', label:'Remove location', danger:true, run:function(){ dropCity(d); }});
    return items;
  }

  function groundItems(c, country){
    var r = country ? regionAt(country.iso, null, c, country.name) : null;
    var items = [];
    if (country) items.push({icon:'open', label:'Country details', hint: country.iso,
                             run:function(){ openCountry(country.iso, country.name); }},
                            {icon:'add', label:'Add node here', disabled: !r, hint: r ? null : 'No grid data',
                             run:function(){ placeAt(c, country, r); }}, '-');
    items.push({icon:'zoom', label:'Zoom in here', run:function(){
      map.easeTo({center: c, zoom: Math.min(map.getZoom() + 2, 10), duration: still() ? 0 : 600});
    }}, copyItem(c));
    return items;
  }

  /* ------------------------------- locales -------------------------------
     Sourced location inputs keyed by ISO code, from data/locales.json. The
     database side builds that file; the shape is docs/locale-contract.md.
     Without it (offline, or a file we can't read) points fall back to the
     sample COUNTRY table and the curated REGIONS.
     ----------------------------------------------------------------------- */
  var LOCALE_KEYS = ['ci', 'fos', 'dec', 'wue', 'ws', 'wue_disclosed', 'pm25', 'pop'];
  // India's 2023 ISO codes, in case Mapbox adopts them; the data keeps the old ones.
  var ISO2_ALIAS = {'IN-TS':'IN-TG', 'IN-CG':'IN-CT', 'IN-OD':'IN-OR', 'IN-UK':'IN-UT'};
  var LOCALES = null, NODE_TYPES = null, CELL_INDEX = null;
  function getJSON(url){
    return fetch(url).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
  }
  // Everything the database side produces; each file is optional.
  function loadData(){
    return Promise.all([
      getJSON('data/locales.json').then(function(d){ if (d && d.v === 1 && d.countries) LOCALES = d; }),
      getJSON('data/node-types.json').then(function(d){ if (d && d.v === 1 && d.types) NODE_TYPES = d; }),
      getJSON('data/cells/index.json').then(function(d){
        if (!d || d.v !== 1 || !Array.isArray(d.tiles)) return;
        CELL_INDEX = {}; d.tiles.forEach(function(t){ CELL_INDEX[t] = true; });
        CELL_ABSENT = d.absent && typeof d.absent === 'object' ? d.absent : null;
      })
    ]).then(localizeBuiltIns);
  }

  // Built-in sites and candidate locations on the same data as a searched
  // city: inputs from the facility type, people nearby from the cell, location
  // values cell → subdivision → country. Whatever is missing keeps the inline
  // sample values, so the page still works offline.
  function localizeBuiltIns(){
    var list = SITES.concat(CITIES).filter(function(s){ return SITE_META[s.id] && !s.added && !s.placed; });
    return Promise.all(list.map(function(s){
      return cellFor(s.c).then(function(cell){
        var m = SITE_META[s.id], T = m[0] && NODE_TYPES ? NODE_TYPES.types[m[0]] : null;
        s.iso1 = m[1]; s.iso2 = m[2] || null; s.cell = cell;
        s.r = regionAt(m[1], s.iso2, s.c, null, cell) || s.r;
        if (s.s && T && ['p', 'u', 'pue', 'g'].every(function(k){ return okValue(T[k]); })){
          s.type = m[0];
          s.in = {p: T.p.v, u: T.u.v, pue: T.pue.v, g: T.g.v,
                  pop: cell && cell.vals.pop ? cell.vals.pop.v : s.in.pop};
          s.water = okValue(T.water) ? T.water.v : null;
        }
      });
    })).then(function(){ snapBase(); refresh(); });
  }
  function okValue(x){ return !!x && typeof x.v === 'number' && isFinite(x.v) && !!x.conf; }

  /* -------------------------------- cells --------------------------------
     Location values on a 0.25° grid — people within 100 km, cooling water
     from local climate, basin water stress, PM2.5 — in 10° tiles under
     data/cells/. Fetched per tile, once, only for tiles the index lists.
     ----------------------------------------------------------------------- */
  var CELL_KEYS = ['pop', 'wue', 'ws', 'pm25'];
  var cellTiles = {};
  // What a cell missing from the tiles means, per key, when the index says
  // (pop: fewer than 500 people within 100 km). Without it a missing cell is unknown.
  var CELL_ABSENT = null;
  function absentCell(key){
    var vals = {};
    Object.keys(CELL_ABSENT || {}).forEach(function(k){
      var x = CELL_ABSENT[k];
      if (CELL_KEYS.indexOf(k) >= 0 && okValue(x))
        vals[k] = {v: x.v, conf: x.conf, src: x.src, year: x.year, note: x.note, level: 'cell', levelName: 'this location'};
    });
    return Object.keys(vals).length ? {key: key, vals: vals} : null;
  }
  function cellCentre(x){ return (Math.floor(x / 0.25) * 0.25 + 0.125).toFixed(3); }
  // → Promise of {key, vals: {k: {v, conf, src, year, note, level: 'cell'}}} or null
  function cellFor(c){
    var tile = Math.floor(c[1] / 10) * 10 + '_' + Math.floor(c[0] / 10) * 10;
    var key = cellCentre(c[1]) + ',' + cellCentre(c[0]);
    if (!CELL_INDEX) return Promise.resolve(null);
    if (!CELL_INDEX[tile]) return Promise.resolve(absentCell(key));
    if (!cellTiles[tile]) cellTiles[tile] = getJSON('data/cells/' + tile + '.json');
    return cellTiles[tile].then(function(t){
      if (!t || t.v !== 1 || !t.cells || !Array.isArray(t.keys)) return null;
      var row = t.cells[key], vals = {};
      if (!row) return absentCell(key);
      t.keys.forEach(function(k, i){
        var m = (t.meta || {})[k] || {}, v = row[i];
        if (CELL_KEYS.indexOf(k) < 0 || typeof v !== 'number' || !isFinite(v) || !m.conf) return;
        vals[k] = {v: v, conf: m.conf, src: m.src, year: m.year, note: m.note, level: 'cell', levelName: 'this location'};
      });
      return Object.keys(vals).length ? {key: key, vals: vals} : null;
    });
  }

  // The most specific value: cell → subdivision (US-TX) → country (US). Grid
  // values (ci, fos, dec) never come from cells and travel together: they
  // come from the most specific level that has all three, so carbon and air
  // never mix two grids. Local grid values passed over that way are kept in
  // `unused` for the panel.
  // Each comes back as {v, conf, src, year, basis, note, level, levelName}.
  var GRID_KEYS = ['ci', 'fos', 'dec'];
  function localeFor(iso1, iso2, cell){
    var out = {}, L = LOCALES, levels = [];
    iso2 = ISO2_ALIAS[iso2] || iso2;
    if (L && iso2 && L.subdivisions && L.subdivisions[iso2]) levels.push([iso2, L.subdivisions[iso2]]);
    if (L && iso1 && L.countries[iso1]) levels.push([iso1, L.countries[iso1]]);
    function take(k, lv){
      var x = lv[1][k];
      out[k] = {v: x.v, conf: x.conf, src: x.src, year: x.year, basis: x.basis, note: x.note,
                level: lv[0], levelName: lv[1].n};
    }
    var grid = levels.filter(function(lv){ return GRID_KEYS.every(function(k){ return okValue(lv[1][k]); }); })[0];
    LOCALE_KEYS.forEach(function(k){
      if (cell && cell.vals[k] && GRID_KEYS.indexOf(k) < 0){ out[k] = cell.vals[k]; return; }
      if (grid && GRID_KEYS.indexOf(k) >= 0){ take(k, grid); return; }
      for (var i = 0; i < levels.length; i++){
        if (okValue(levels[i][1][k])){ take(k, levels[i]); return; }
      }
    });
    if (grid) levels.slice(0, levels.indexOf(grid)).forEach(function(lv){
      GRID_KEYS.forEach(function(k){
        if (okValue(lv[1][k])) (out.unused = out.unused || []).push({k: k, v: lv[1][k].v, level: lv[0], levelName: lv[1].n});
      });
    });
    return out;
  }
  function sourceOf(id){ return LOCALES && LOCALES.sources && LOCALES.sources[id] || null; }

  // A grid region built from locale data. Missing keys get the old
  // country-average defaults and are marked sample, so the panel says so.
  function localeRegion(iso1, iso2, countryName, cell){
    var loc = localeFor(iso1, iso2, cell);
    if (!loc.ci) return null;
    iso2 = ISO2_ALIAS[iso2] || iso2;
    var fromSub = !!iso2 && LOCALE_KEYS.some(function(k){ return loc[k] && loc[k].level === iso2; });
    // a cell, or a subdivision with its own values or its own unused-values
    // note, gets its own region
    var key = 'loc-' + (cell ? cell.key : fromSub || (iso2 && loc.unused) ? iso2 : iso1);
    if (REGIONS[key]) return key;
    var ci = loc.ci.v, dflt = {dec: .03, wue: 1.5, ws: (COUNTRY[iso1] || [0, .4])[1], fos: Math.min(.95, ci / 800)};
    Object.keys(dflt).forEach(function(k){
      if (!loc[k]) loc[k] = {v: dflt[k], conf: 'sample', level: 'default'};
    });
    var where = loc.ci.level === iso1 ? (countryName || loc.ci.levelName) : loc.ci.levelName + ', ' + iso1;
    REGIONS[key] = {n: where, ci: ci, dec: loc.dec.v, wue: loc.wue.v, ws: loc.ws.v, fos: loc.fos.v, loc: loc};
    return key;
  }

  // Grid region for a point: sourced locale data when there is any; else the
  // country's curated region (nearest known place when it has several); else
  // a country-average region built from the sample COUNTRY table.
  function regionIso(k){ var p = k.split('-')[0]; return p === 'uk' ? 'GB' : p.toUpperCase(); }
  function regionAt(iso, iso2, c, name, cell){
    var lr = localeRegion(iso, iso2, name, cell);
    if (lr) return lr;
    var keys = Object.keys(REGIONS).filter(function(k){ return !REGIONS[k].loc && regionIso(k) === iso; });
    if (keys.length === 1) return keys[0];
    if (keys.length > 1){
      var best = keys[0], bd = Infinity;
      SITES.concat(CITIES).forEach(function(s){
        if (keys.indexOf(s.r) < 0) return;
        var dd = d3.geoDistance(s.c, c);
        if (dd < bd){ bd = dd; best = s.r; }
      });
      return best;
    }
    var rec = COUNTRY[iso];
    if (!rec) return null;
    var key = 'avg-' + iso;
    if (!REGIONS[key]) REGIONS[key] = {n: name + ' · country average', ci: rec[0], dec: .03, wue: 1.5,
                                       ws: rec[1], fos: Math.min(.95, rec[0] / 800)};
    return key;
  }

  /* ------------------------------ geocoding ------------------------------
     Mapbox Geocoding v6 names searched and placed points and gives their ISO
     codes. Results are shown, never stored (temporary geocoding terms).
     ----------------------------------------------------------------------- */
  function geoPlace(f){
    var p = f.properties || {}, cx = p.context || {}, co = cx.country || {}, rg = cx.region || {};
    return {
      mid: p.mapbox_id, type: p.feature_type,
      n: p.name_preferred || p.name, sub: p.place_formatted || '',
      c: [p.coordinates.longitude, p.coordinates.latitude],
      iso1: (co.country_code || '').toUpperCase() || null,
      iso2: rg.region_code_full || null,
      country: co.name || ''
    };
  }
  function geocode(path, params){
    params.access_token = mapboxgl.accessToken;
    params.language = 'en';
    var qs = Object.keys(params).map(function(k){ return k + '=' + encodeURIComponent(params[k]); }).join('&');
    return fetch('https://api.mapbox.com/search/geocode/v6/' + path + '?' + qs)

  function makeCity(c, n, p, r, codes){
    placedCount += 1;

                c: [+c[0].toFixed(2), +c[1].toFixed(2)], r: r, placed: true,
                iso1: codes.iso1 || null, iso2: codes.iso2 || null, mid: codes.mid || null};
    CITIES = CITIES.concat([city]);
    cityById[city.id] = city;
    state.comparing = false; state.compare = null; state.selected = city.id;
    refresh();

  // Right-click → "Add node here": place at once, then name it from reverse
  // geocoding and move it onto its state's data when that comes back.
  function placeAt(c, country, r){
    var city = makeCity(c, null, country.name, r, {iso1: country.iso});
    Promise.all([
      geocode('reverse', {longitude: c[0], latitude: c[1], types: 'place,region', limit: 1}),
      cellFor(city.c)
    ]).then(function(res){
      var g = res[0][0], d = byId[city.id] || cityById[city.id];
      if (!d) return;
      if (g && g.iso1 === country.iso){

        d.p = g.sub || d.p;
        d.iso2 = g.iso2;

      localize(d, res[1], country.name);
    });
  }

    var have = CITIES.concat(SITES).filter(function(d){ return d.mid && d.mid === g.mid; })[0];
    if (have){ pick(have.id); return have; }
    var city = makeCity(g.c, g.n, g.sub || g.country, regionAt(g.iso1, g.iso2, g.c, g.country), g);
    cellFor(city.c).then(function(cell){
      var d = byId[city.id] || cityById[city.id];
      if (d) localize(d, cell, g.country);

  /* --------------------------- automatic links ---------------------------
     A node that is added, or whose type changes, is linked to its nearest
     suppliers and customers. The Connections diagram is the rulebook: for
     each part that feeds this node's part (goods or data, not money or
     policy) take the nearest site of that part, two when the part has
     several; likewise downstream. At most three each way. With nothing found
     one way, fall back to the nearest site of the previous or next stage.
     Automatic links live apart from the built-in ones, so they can be
     regenerated, and a retyped built-in site sets its own built-in links
     aside while it has another role.
     ----------------------------------------------------------------------- */
  var AUTO_FLOWS = {};   // node id → [[from, to, km, reason], ...]
  // The built-in links in effect: those not touching a site that has been retyped.
  function baseFlows(){
    return FLOWS.filter(function(f){
      return !(byId[f[0]] && byId[f[0]].retyped) && !(byId[f[1]] && byId[f[1]].retyped);
    });

  function autoLinks(site){

    var km = function(o){ return d3.geoDistance(site.c, o.c) * 6371; };
    function others(test){ return SITES.filter(function(o){ return o.id !== site.id && test(o); }); }
    function nearest(list, n){ return list.slice().sort(function(a, b){ return km(a) - km(b); }).slice(0, n); }
    function take(dir, partId, o){
      var f = dir === 'up' ? [o.id, site.id] : [site.id, o.id], key = f[0] + '>' + f[1];
      if (seen[key]) return;
      // already a built-in link that's in effect (a retyped site's own are set aside)
      if (baseFlows().some(function(b){ return b[0] === f[0] && b[1] === f[1]; })) return;
      seen[key] = true;
      var name = partId ? VIZ_NODES.filter(function(x){ return x.id === partId; })[0].n.toLowerCase() : null;
      links.push({dir: dir, f: [f[0], f[1], Math.round(km(o)), name ? 'nearest ' + name : 'nearest in the ' + (dir === 'up' ? 'previous' : 'next') + ' stage']});
    }
    ['up', 'down'].forEach(function(dir){
      var picked = [];
      if (part){
        VIZ_EDGES.forEach(function(e){
          if (e[2] !== 'phys' && e[2] !== 'data') return;
          var other = dir === 'up' ? (e[1] === part ? e[0] : null) : (e[0] === part ? e[1] : null);
          if (!other) return;
          var c = others(function(o){ return partOf(o) === other; });
          nearest(c, c.length >= 3 ? 2 : 1).forEach(function(o){ picked.push({o: o, part: other}); });
        });
      }
      if (!picked.length){   // stage order fallback
        var i = STAGES.map(function(x){ return x.k; }).indexOf(site.s) + (dir === 'up' ? -1 : 1);
        if (i >= 0 && i < STAGES.length){
          nearest(others(function(o){ return o.s === STAGES[i].k; }), 1).forEach(function(o){ picked.push({o: o, part: null}); });
        }
      }
      picked.sort(function(a, b){ return km(a.o) - km(b.o); }).slice(0, 3).forEach(function(p){ take(dir, p.part, p.o); });
    });

  /* Links run like a metro map: only through the channels between columns
     and the gaps between rows, never across a box, turning with rounded
     corners. Each link gets its own lane in every channel it uses and its
     own point on a box's edge, so parallel links stay apart.
       forward      right edge → channel → (row gap → channel) → left edge
       same column  right edge → channel → right edge
       backward     left edge → channel → (row gap → channel) → right edge */
  function vizRoutes(list){
    var byN = {}; VIZ_NODES.forEach(function(n){ byN[n.id] = n; });
    var yMid = function(n){ return vizXY(n)[1] + VH / 2; };
    // row gaps a horizontal run can use, free in every column
    var gaps = [];
    for (var k = 1; k <= 4; k++) gaps.push(VTOP + k * VROW - (VROW - VH) / 2);
    gaps.push((VTOP + 4 * VROW + VH + VBAND + 26) / 2);   // between the chain and the band
    gaps.push(VBAND + 26 + VH + 18);                       // under the band

    var R = list.map(function(e){
      var a = byN[e[0]], b = byN[e[1]], dc = b.c - a.c, r = {e: e, a: a, b: b};
      r.sSide = dc >= 0 ? 'R' : 'L';
      r.tSide = dc > 0 ? 'L' : 'R';
      r.g1 = dc >= 0 ? a.c : a.c - 1;                // channel index: g sits right of column g
      r.g2 = dc > 1 ? b.c - 1 : dc < -1 ? b.c : null;
      if (r.g2 !== null){

        r.gap = gaps.reduce(function(best, g){

        });

    // Bundling: links of one kind that leave the same box share one point on
    // its edge (and arrive together the same way), and in each channel or
    // gap they share one lane with any link of that kind they have an end in
    // common with. A fan-out becomes one trunk that branches; a fan-in, one
    // that gathers.
    var ports = {};   // box side → bundle (direction + kind) → its links
    function portOf(side, bundle, entry){
      var s = ports[side] = ports[side] || {};
      (s[bundle] = s[bundle] || []).push(entry);
    }
    R.forEach(function(r){
      portOf(r.a.id + r.sSide, 'out-' + r.e[2], {r: r, end: 's', y: yMid(r.b)});
      portOf(r.b.id + r.tSide, 'in-' + r.e[2], {r: r, end: 't', y: yMid(r.a)});
    });
    Object.keys(ports).forEach(function(side){
      var groups = Object.keys(ports[side]).map(function(k){
        var g = ports[side][k];
        return {members: g, y: g.reduce(function(s, p){ return s + p.y; }, 0) / g.length};
      }).sort(function(p, q){ return p.y - q.y; });
      groups.forEach(function(g, i){
        g.members.forEach(function(p){ p.r[p.end + 'Off'] = VH * (i + 1) / (groups.length + 1); });
      });
    });

    // lanes: each channel and each row gap splits its width among its bundles
    var lanes = {};
    function claim(key, r, order){ (lanes[key] = lanes[key] || []).push({r: r, order: order}); }
    R.forEach(function(r){
      var sy = vizXY(r.a)[1] + r.sOff;
      claim('g' + r.g1, r, sy);
      if (r.g2 !== null){ claim('g' + r.g2, r, vizXY(r.b)[1] + r.tOff); claim('y' + r.gap, r, sy); }
    });
    // a lane is an offset: from a channel's left edge, or from a gap's centre line
    var laneAt = {}, GAP = VROW - VH;
    Object.keys(lanes).forEach(function(key){
      var entries = lanes[key], parent = entries.map(function(_, i){ return i; });
      function find(i){ return parent[i] === i ? i : (parent[i] = find(parent[i])); }
      entries.forEach(function(p, i){
        entries.forEach(function(q, j){
          if (j <= i || p.r.e[2] !== q.r.e[2]) return;
          if (p.r.e[0] === q.r.e[0] || p.r.e[1] === q.r.e[1]) parent[find(j)] = find(i);
        });
      });
      var bundles = {};
      entries.forEach(function(p, i){
        var b = bundles[find(i)] = bundles[find(i)] || {members: [], order: Infinity};
        b.members.push(p); b.order = Math.min(b.order, p.order);
      });
      var order = Object.keys(bundles).map(function(k){ return bundles[k]; }).sort(function(p, q){ return p.order - q.order; });
      order.forEach(function(b, i){
        var t = (i + 1) / (order.length + 1);
        b.members.forEach(function(p){
          laneAt[key + '|' + R.indexOf(p.r)] = key[0] === 'g' ? 8 + (VGUT - 16) * t : -GAP / 2 + 5 + (GAP - 10) * t;
        });
      });
    });
    function channelX(g, i){ return VX0 + g * VPITCH + VW + laneAt['g' + g + '|' + i]; }

    return R.map(function(r, i){
      var A = vizXY(r.a), B = vizXY(r.b);
      var sx = r.sSide === 'R' ? A[0] + VW : A[0], sy = A[1] + r.sOff;
      var tx = r.tSide === 'R' ? B[0] + VW + 1 : B[0] - 1, ty = B[1] + r.tOff;
      var x1 = channelX(r.g1, i), pts = [[sx, sy], [x1, sy]];
      if (r.g2 === null) pts.push([x1, ty]);
      else {
        var gy = r.gap + laneAt['y' + r.gap + '|' + i], x2 = channelX(r.g2, i);
        pts.push([x1, gy], [x2, gy], [x2, ty]);
      }
      pts.push([tx, ty]);
      return roundedPath(pts, 7);
    });
  }
  // A polyline with its corners rounded (never more than half a segment).
  function roundedPath(pts, rad){
    var d = 'M' + pts[0][0] + ',' + pts[0][1];
    for (var i = 1; i < pts.length - 1; i++){
      var p = pts[i - 1], c = pts[i], n = pts[i + 1];
      var l1 = Math.hypot(c[0] - p[0], c[1] - p[1]), l2 = Math.hypot(n[0] - c[0], n[1] - c[1]);
      var r = Math.min(rad, l1 / 2, l2 / 2);
      if (r < 0.5){ d += ' L' + c[0] + ',' + c[1]; continue; }
      var bx = c[0] - (c[0] - p[0]) / l1 * r, by = c[1] - (c[1] - p[1]) / l1 * r;
      var ax = c[0] + (n[0] - c[0]) / l2 * r, ay = c[1] + (n[1] - c[1]) / l2 * r;
      d += ' L' + bx.toFixed(1) + ',' + by.toFixed(1) + ' Q' + c[0].toFixed(1) + ',' + c[1].toFixed(1) + ' ' + ax.toFixed(1) + ',' + ay.toFixed(1);
    }
    var z = pts[pts.length - 1];
    return d + ' L' + z[0] + ',' + z[1];
  }

  var vizEl = document.getElementById('viz'), vizBtn = document.getElementById('viz-btn');
  var vizCanvas = document.getElementById('viz-canvas'), vizKey = document.getElementById('viz-key');

    var edges = groups.selectAll('path').data(function(k){ return shown.filter(function(e){ return e[2] === k.k; }); })
      .enter().append('path')

      .attr('marker-end', function(e){ return 'url(#va-' + e[2] + ')'; });

    groups.selectAll('path.ve-hit').data(function(k){ return shown.filter(function(e){ return e[2] === k.k; }); })
      .enter().append('path').attr('class', 've-hit')
      .attr('d', function(e){ return routes[shown.indexOf(e)]; })
      .on('click', function(ev, e){ ev.stopPropagation(); showLink(e); })
      .append('title').text(function(e){ return vizName(e[0]) + ' to ' + vizName(e[1]) + ': ' + (VIZ_WHAT[e[0] + '>' + e[1]] || ''); });

    // Markers ride each link in its direction of transfer, one per ~320 units
    // of path at an even 55 units a second, staggered so they don't march in
    // step. Shapes follow the kind: square goods, round data, diamond money,
    // a short pill for policy, a ring for feedback. Reduced motion: none.
    var DOT = {
      phys:   function(g){ return g.append('rect').attr('x', -2.3).attr('y', -2.3).attr('width', 4.6).attr('height', 4.6); },
      data:   function(g){ return g.append('circle').attr('r', 2.4); },
      money:  function(g){ return g.append('path').attr('d', 'M0 -3.1 L3.1 0 L0 3.1 L-3.1 0 Z'); },
      policy: function(g){ return g.append('rect').attr('x', -3.2).attr('y', -1.1).attr('width', 6.4).attr('height', 2.2).attr('rx', 1.1); },
      loop:   function(g){ return g.append('circle').attr('r', 2.5); }
    };
    var dots = d3.select(null);
    if (!still()){
      var made = [];
      edges.each(function(e, i){
        var path = this, len = path.getTotalLength(), n = Math.max(1, Math.round(len / 320)), dur = len / 55;
        path.id = 'vp-' + i;
        for (var k = 0; k < n; k++){
          var dot = DOT[e[2]](d3.select(path.parentNode)).attr('class', 'vd ' + e[2]).datum(e);
          var begin = -((k / n) + ((i * 0.37) % 1) / n) * dur;   // stagger along the path
          dot.append('animateMotion').attr('dur', dur.toFixed(2) + 's').attr('begin', begin.toFixed(2) + 's')
             .attr('repeatCount', 'indefinite').attr('rotate', 'auto')
             .append('mpath').attr('href', '#vp-' + i);
          made.push(dot.node());
        }
      });
      dots = d3.selectAll(made);
    }

    var nodes = svg.append('g').selectAll('g').data(VIZ_NODES).enter().append('g')
      .attr('transform', function(n){ var p = vizXY(n); return 'translate(' + p[0] + ',' + p[1] + ')'; })
      .each(function(n){
        var g = d3.select(this), count = vizCount(n.id), used = count > 0 || n.id === 'power';
        g.attr('class', 'vn' + (used ? ' used' : '')).attr('tabindex', 0).attr('role', 'button');
        g.append('rect').attr('class', 'box').attr('width', VW).attr('height', VH);
        if (used) g.append('rect').attr('class', 'bar').attr('width', 2).attr('height', VH);
        g.append('text').attr('class', 't').attr('x', 14).attr('y', 23).text(n.n);
        g.append('text').attr('class', 's').attr('x', 14).attr('y', 40).text(n.s);
        var right = VW - 12;
        if (n.choke){ g.append('path').attr('class', 'choke').attr('d', 'M0 -3.6 L3.6 0 L0 3.6 L-3.6 0 Z').attr('transform', 'translate(' + right + ',14)'); right -= 14; }
        if (used) g.append('text').attr('class', 'cnt').attr('x', right).attr('y', 18).text(n.id === 'power' ? 'grid' : count);
        g.attr('aria-label', n.n + (used ? ', on the map' + (count ? ': ' + count + ' site' + (count > 1 ? 's' : '') : ' as each site’s grid') : '') +
                             (n.choke ? ', chokepoint' : '') + '. Press to learn about this step.');
      })
      .on('mouseenter', function(ev, n){ if (!vizPin && !vizLink) focusViz(n.id); })
      .on('mouseleave', function(){ if (!vizLink) focusViz(vizPin); })
      .on('click', function(ev, n){ ev.stopPropagation(); pinViz(vizPin === n.id ? null : n.id); })
      .on('keydown', function(ev, n){
        if (ev.key === 'Enter' || ev.key === ' '){
          ev.preventDefault(); pinViz(vizPin === n.id ? null : n.id);
          var hh = vizInfo.querySelector('.vi-h'); if (hh && !vizInfo.hidden) hh.focus();
        }
      });

    // highlight one link and its two ends
    function focusLink(link){
      svg.classed('focus', true);
      edges.classed('hl', function(e){ return e === link; }).classed('sel', function(e){ return e === link; });
      dots.classed('hl', function(e){ return e === link; });
      nodes.classed('hl', function(m){ return m.id === link[0] || m.id === link[1]; }).classed('pin', false)
           .attr('aria-pressed', 'false');
    }
    drawViz.focusLink = focusLink;
    // highlight one part's links and neighbours, or clear
    function focusViz(id){
      edges.classed('sel', false);
      var near = {};
      if (id) near[id] = true;
      svg.classed('focus', !!id);
      edges.classed('hl', function(e){
        var on = !!id && (e[0] === id || e[1] === id);
        if (on){ near[e[0]] = near[e[1]] = true; }
        return on;
      });
      dots.classed('hl', function(e){ return !!id && (e[0] === id || e[1] === id); });
      nodes.classed('hl', function(m){ return !!near[m.id]; })
           .classed('pin', function(m){ return m.id === vizPin; })
           .attr('aria-pressed', function(m){ return String(m.id === vizPin); });
    }

    else { vizLink = null; focusViz(vizPin); }
  }

  /* ------------------------- about a part or a link -------------------------

  var vizInfo = document.getElementById('viz-info'), vizLink = null;

    s1.appendChild(l1);

    if (outs.length) outs.forEach(function(e){ viLinkRow(l2, e, e[1]); }); else s2.appendChild(el('p', 'vi-empty', 'Nothing. This is where the chain ends.'));

  function showLink(e, moveFocus){

  // legend: one toggle per kind of link, with its line as the swatch
  VIZ_KINDS.forEach(function(k){
    var b = el('button'); b.type = 'button'; b.setAttribute('aria-pressed', String(!vizOff[k.k]));
    b.dataset.kind = k.k;
    b.innerHTML = '<svg width="22" height="6" aria-hidden="true"><line class="ve ' + k.k + '" x1="1" y1="3" x2="21" y2="3" style="opacity:1"></line></svg>';
    b.appendChild(el('span', null, k.label));
    b.addEventListener('click', function(){
      vizOff[k.k] = !vizOff[k.k];
      b.setAttribute('aria-pressed', String(!vizOff[k.k]));
      drawViz();   // re-route: lanes and bundles depend on what's shown
    });
    vizKey.appendChild(b);
  });
  document.getElementById('viz-reset').addEventListener('click', function(){
    vizOff = Object.assign({}, VIZ_DEFAULT_OFF);
    Array.prototype.forEach.call(vizKey.children, function(b){ b.setAttribute('aria-pressed', String(!vizOff[b.dataset.kind])); });
    pinViz(null);
    drawViz();
    vizCanvas.scrollTo(0, 0);
  });
  // clicking anywhere in the diagram area but a part releases a pin
  vizCanvas.addEventListener('click', function(e){ if (!e.target.closest('.vn') && !e.target.closest('.ve-hit')) pinViz(null); });
  function openViz(on){
    vizEl.hidden = !on;
    document.querySelector('.app').classList.toggle('viz-open', on);
    vizBtn.setAttribute('aria-expanded', String(on));
    vizBtn.classList.toggle('on', on);
    if (on){ closeScen(); closeLayer(); closeResults(); closeCtx(); hideTip(); drawViz(); if (!vizPin && !vizLink) hideInfo(); }
  }
  vizBtn.addEventListener('click', function(e){ e.stopPropagation(); openViz(vizEl.hidden); });
  document.getElementById('viz-close').addEventListener('click', function(){ openViz(false); vizBtn.focus(); });
  vizEl.addEventListener('click', function(e){ e.stopPropagation(); });

  /* ================================ STATS ================================
     Everything on the map totalled and set against the world: energy,
     carbon and water, each with everyday equivalents and a share of a global
     figure. Breakdowns fold away underneath.
     ======================================================================= */
  // Reference figures, rounded. Everyday equivalents match the unit notes.
  var WORLD = {
    dcTWh: 415,        // data centres worldwide, 2024 (IEA, Energy and AI, 2025)
    elecTWh: 30000,    // world electricity generation, 2024 (Ember, Global Electricity Review 2025)
    co2Mt: 37800,      // energy-related CO2, 2024 (IEA, Global Energy Review 2025)
    homeMWh: 10.5,     // a US home's electricity a year (EIA)
    carT: 4.6,         // a petrol car's CO2 a year (US EPA)
    poolM3: 2500,      // an Olympic pool
    nycM3Day: 3.8e6    // New York City's water use a day (~1 billion gallons, NYC DEP)
  };
  var statsEl = document.getElementById('stats'), statsBody = document.getElementById('stats-body');
  var statsBtn = document.getElementById('stats-btn'), statsOpen = false, statsBy = 'C';
  // open by default on a wide screen; a phone starts with the map
  statsOpen = window.innerWidth >= 900;
  try { var sv = localStorage.getItem('atlas.statsPanel'); if (sv) statsOpen = sv === 'open'; } catch (e) {}

  // The baseline is the map as sourced: a copy of each built-in site taken
  // before any edit. Added nodes aren't in it and removed ones stay, so every
  // edit moves "vs baseline".
  var BASE_SITES = {};
  function snapBase(){
    SITES.forEach(function(s){
      if (s.n0 == null){ s.n0 = s.n; s.p0 = s.p; }
      if (!s.added && !s.edited) BASE_SITES[s.id] = Object.assign({}, s, {in: Object.assign({}, s.in)});
    });
  }
  snapBase();
  var BASE_CITIES = CITIES.slice();   // candidate places, before any became a node
  // Everything back to the map as sourced: built-in sites as first loaded,
  // added nodes gone (their places return), removed sites back.
  function resetToBaseline(){
    SITES = baseList().map(function(b){ return Object.assign({}, b, {in: Object.assign({}, b.in)}); });
    Object.keys(byId).forEach(function(id){ delete byId[id]; });
    SITES.forEach(function(x){ byId[x.id] = x; });
    var have = {}; CITIES.forEach(function(c){ have[c.id] = true; });
    CITIES = CITIES.concat(BASE_CITIES.filter(function(c){ return !have[c.id] && !byId[c.id]; }));
    Object.keys(cityById).forEach(function(id){ delete cityById[id]; });
    CITIES.forEach(function(c){ cityById[c.id] = c; });
    relinkAll();
    state.edited = false;
    if (state.compare && !byId[state.compare]){ state.compare = null; state.comparing = false; }
    if (state.selected && !byId[state.selected] && !cityById[state.selected] && !isCountryId(state.selected)) state.selected = null;
  }
  function baseList(){ return Object.keys(BASE_SITES).map(function(id){ return BASE_SITES[id]; }); }
  function baseTotals(){ return totals(SCENARIOS[0], baseList()); }

  function totals(sc, list){
    var t = {E: 0, C: 0, W: 0, dcE: 0, n: 0, rows: []};
    (list || SITES).filter(visible).forEach(function(s){
      var m = metrics(s, state.year, sc);
      t.E += m.E; t.C += m.C; t.W += m.W; t.n += 1;
      if (s.type === 'dc-training' || s.type === 'dc-inference') t.dcE += m.E;
      t.rows.push({s: s, m: m});
    });
    return t;
  }
  function aboutN(n){   // "about 710,000", "about 1.2 million"
    if (n >= 1e6) return 'about ' + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + ' million';
    if (n >= 1e4) return 'about ' + (Math.round(n / 1e3) * 1e3).toLocaleString('en-US');
    if (n >= 100) return 'about ' + (Math.round(n / 10) * 10).toLocaleString('en-US');
    return 'about ' + Math.max(1, Math.round(n));
  }
  function pctOf(x, of){ var p = x / of * 100; return p >= 10 ? p.toFixed(0) + '%' : p >= 1 ? p.toFixed(1) + '%' : p.toFixed(2) + '%'; }

  var MCOL = {E: '--m-e', C: '--m-c', W: '--m-w'};
  function chg(now, base){ return base ? (now - base) / base * 100 : 0; }
  function pctTxt(ch){ return Math.abs(ch) < 0.5 ? '±0%' : (ch > 0 ? '+' : '−') + Math.abs(ch).toFixed(0) + '%'; }
  var liveOpen = true;
  try { liveOpen = localStorage.getItem('atlas.statsLive') !== 'closed'; } catch (e) {}

  function renderStats(){
    var base = baseTotals(), now = totals(SCEN), changed = state.edited || SCEN.k !== 'base';
    var FMT = {E: fEnergy, C: fCarbon, W: fWater};
    statsBody.innerHTML = '';
    var top = el('div', 'st-top');
    top.appendChild(el('span', 'eyebrow', 'Stats · per year'));
    top.appendChild(tipEl('Totals for the sites on the map, one year, from the model. References: data centers worldwide ~415 TWh in 2024 (IEA, Energy and AI, 2025); energy-related CO₂ ~37.8 Gt (IEA, Global Energy Review 2025); a US home ~10,500 kWh a year (EIA); a petrol car ~4.6 t CO₂ a year (US EPA); an Olympic pool 2,500 m³.'));
    statsBody.appendChild(top);
    statsBody.appendChild(el('div', 'st-h', now.n + ' sites on the map'));
    statsBody.appendChild(el('span', 'st-scen-chip' + (changed ? ' on' : ''),
      state.edited ? 'Custom' + (SCEN.k !== 'base' ? ' · ' + SCEN.label : '') : SCEN.label));

    // since you opened the map: live counters, collapsible
    var lv = el('div', 'st-live');
    var lh = el('button', 'st-live-h', 'Since you opened the map'); lh.type = 'button';
    lh.setAttribute('aria-expanded', String(liveOpen));
    lh.title = 'Each site’s yearly total from the model, counted per second since the page opened';
    lh.appendChild(el('span', 'car', '›'));
    lh.addEventListener('click', function(ev){
      ev.stopPropagation(); liveOpen = !liveOpen;
      try { localStorage.setItem('atlas.statsLive', liveOpen ? 'open' : 'closed'); } catch (e) {}
      renderStats(); var h = statsBody.querySelector('.st-live-h'); if (h) h.focus();
    });
    lv.appendChild(lh);
    liveEl = {}; liveShown = {E: '', C: '', W: ''};
    if (liveOpen){
      var lb = el('div', 'st-live-b');
      [['E', 'Energy'], ['C', 'Carbon'], ['W', 'Water']].forEach(function(k){
        var r = el('div', 'st-live-r'), kk = el('span', 'k');
        kk.appendChild(document.createTextNode(k[1]));
        r.appendChild(kk);
        liveEl[k[0]] = el('span', 'v', '0'); r.appendChild(liveEl[k[0]]);
        lb.appendChild(r);
      });
      lv.appendChild(lb);
    }
    statsBody.appendChild(lv);
    if (liveOpen) liveDraw();

    // a yearly total: the figure, its change, now against baseline, and its scale
    function total(key, label, eqN, eqTxt, share){
      var box = el('div', 'st-tot'); box.style.setProperty('--c', 'var(' + MCOL[key] + ')');
      var k = el('div', 'st-k'); k.appendChild(document.createTextNode(label));
      var ch = chg(now[key], base[key]);
      if (changed && Math.abs(ch) >= 0.5) k.appendChild(el('span', 'st-d ' + (ch < 0 ? 'lo' : 'hi'), pctTxt(ch) + ' vs baseline'));
      box.appendChild(k);
      var d = FMT[key](now[key]), v = el('div', 'st-v', d[0]);
      v.appendChild(unitEl(d[1]));
      box.appendChild(v);
      if (changed && base[key]){   // now as a bar, baseline as a tick on the same scale
        var mx = Math.max(now[key], base[key]) * 1.08, cmp = el('div', 'st-cmp'), fill = el('i'), tick = el('b');
        fill.style.width = (now[key] / mx * 100).toFixed(2) + '%';
        tick.style.left = (base[key] / mx * 100).toFixed(2) + '%';
        var bf = FMT[key](base[key]); tick.setAttribute('data-tip', 'Baseline: ' + bf[0] + ' ' + bf[1]);
        cmp.appendChild(fill); cmp.appendChild(tick); box.appendChild(cmp);
      }
      var eq = el('div', 'st-eq'); eq.appendChild(el('strong', null, '≈ ' + aboutN(eqN).replace('about ', '')));
      eq.appendChild(document.createTextNode(eqTxt)); box.appendChild(eq);
      if (share){
        var w = el('div', 'st-share');
        var l = el('div', 'lbl'); l.appendChild(el('b', null, pctOf(share.x, share.of))); l.appendChild(document.createTextNode(' ' + share.text));
        w.appendChild(l);
        var bar = el('div', 'st-bar'), f = el('i'); f.style.width = Math.min(100, share.x / share.of * 100).toFixed(2) + '%';
        bar.appendChild(f); w.appendChild(bar);
        box.appendChild(w);
      }
      statsBody.appendChild(box);
    }
    total('E', 'Energy', now.E / WORLD.homeMWh, 'US homes’ electricity',
      {x: now.dcE / 1e6, of: WORLD.dcTWh, text: 'of the world’s data center power'});
    total('C', 'Carbon', now.C / WORLD.carT, 'petrol cars’ emissions',
      {x: now.C / 1e6, of: WORLD.co2Mt, text: 'of the world’s energy CO₂'});
    total('W', 'Water', now.W / WORLD.poolM3, 'Olympic pools', null);

    // folded detail: each section switches between energy, carbon and water
    function tabs(host){
      var t = el('div', 'st-tabs');
      [['E', 'Energy'], ['C', 'Carbon'], ['W', 'Water']].forEach(function(m){
        var b = el('button', null, m[1]); b.type = 'button'; b.setAttribute('aria-pressed', String(statsBy === m[0]));
        b.addEventListener('click', function(ev){ ev.stopPropagation(); statsBy = m[0]; renderStats(); });
        t.appendChild(b);
      });
      host.appendChild(t);
    }
    function valEl(x){ var f = FMT[statsBy](x), v = el('span', 'v', f[0] + ' '); v.appendChild(unitEl(f[1])); return v; }
    function glyphEl(stage){ var g = el('span'); if (stage) g.innerHTML = glyphHTML(stage, 11); return g.firstChild || g; }
    function barRow(host, row, frac){
      var bar = el('div', 'bar'), fill = el('i'); fill.style.width = (Math.max(0, frac) * 100).toFixed(1) + '%';
      bar.appendChild(fill); row.appendChild(bar); host.appendChild(row);
    }
    var col = 'var(' + MCOL[statsBy] + ')';

    // by stage: packed bubbles, area ∝ share, in shades of the chosen measure's
    // colour (energy ochre, carbon charcoal, water blue; bigger is fuller), the
    // stage named inside when it fits; then a row per stage
    var d1 = disclosure('statsStage', 'By stage', null, renderStats);
    d1.wrap.className = 'st-sec';
    if (d1.open){
      tabs(d1.wrap);
      var byStage = {}; STAGES.forEach(function(st){ byStage[st.k] = 0; });
      now.rows.forEach(function(r){ byStage[r.s.s] += r.m[statsBy]; });
      var tot = now[statsBy] || 1;
      var ranked = STAGES.slice().sort(function(a, b){ return byStage[b.k] - byStage[a.k]; });
      var mc = token(MCOL[statsBy]), shade = d3.interpolateLab(d3.interpolateLab(token('--surface'), mc)(0.3), mc), colOf = {};
      ranked.forEach(function(st, i){ colOf[st.k] = shade(1 - i / Math.max(1, ranked.length - 1)); });
      var W = 268, H = 240;
      var root = d3.hierarchy({children: STAGES.filter(function(st){ return byStage[st.k] > 0; })
        .map(function(st){ return {st: st, v: Math.max(byStage[st.k] / tot, 0.012)}; })}).sum(function(d){ return d.v || 0; });
      d3.pack().size([W, H]).padding(3)(root);
      var NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'st-bub'); svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Share by stage');
      (root.children || []).forEach(function(n){
        var st = n.data.st, share = byStage[st.k] / tot, c = colOf[st.k];
        var ink = d3.lab(c).l > 60 ? '#262318' : '#FFFDF5';
        var g = document.createElementNS(NS, 'g');
        var ci = document.createElementNS(NS, 'circle');
        ci.setAttribute('cx', n.x); ci.setAttribute('cy', n.y); ci.setAttribute('r', n.r); ci.setAttribute('fill', c);
        var f = FMT[statsBy](byStage[st.k]);
        ci.setAttribute('data-tip', st.label + ': ' + (share * 100).toFixed(share < 0.01 ? 1 : 0) + '% · ' + f[0] + ' ' + f[1]);
        g.appendChild(ci);
        // name on up to two lines, sized to the bubble; too small → % only
        var words = st.label.split(' '), longest = d3.max(words, function(w){ return w.length; });
        var fs = Math.min(14, (1.8 * n.r) / (longest * 0.56)), pct = Math.round(share * 100) + '%';
        function txt(y, t, size, cls){
          var e = document.createElementNS(NS, 'text');
          e.setAttribute('x', n.x); e.setAttribute('y', y); e.setAttribute('fill', ink);
          e.setAttribute('font-size', size.toFixed(1)); if (cls) e.setAttribute('class', cls);
          e.textContent = t; g.appendChild(e);
        }
        if (fs >= 8.5 && n.r >= 22){
          var lh = fs * 1.15, y0 = n.y - (words.length * lh) / 2 - fs * 0.35;
          words.forEach(function(w, i){ txt(y0 + lh * (i + 0.5), w, fs, 'n'); });
          txt(y0 + lh * words.length + fs * 0.55, pct, fs * 0.9);
        } else if (n.r >= 11) txt(n.y, pct, Math.min(12, n.r * 0.8));
        svg.appendChild(g);
      });
      d1.wrap.appendChild(svg);
      STAGES.forEach(function(st){
        var row = el('div', 'st-row st-stage'); row.style.setProperty('--c', colOf[st.k]);
        row.appendChild(el('span', 'dot'));
        row.appendChild(el('span', null, st.label));
        row.appendChild(valEl(byStage[st.k]));
        d1.wrap.appendChild(row);
      });
    }
    statsBody.appendChild(d1.wrap);

    // largest sites and countries, by the chosen measure
    var d2 = disclosure('statsTop', 'Largest sites and countries', null, renderStats);
    d2.wrap.className = 'st-sec';
    if (d2.open){
      tabs(d2.wrap);
      var linkRow = function(stage, label, go, x, max){
        var row = el('div', 'st-row'); row.style.setProperty('--c', col);
        row.appendChild(glyphEl(stage));
        var b = el('button', null, label); b.type = 'button';
        b.addEventListener('click', function(ev){ ev.stopPropagation(); go(); });
        row.appendChild(b);
        row.appendChild(valEl(x));
        barRow(d2.wrap, row, x / max);
      };
      var top5 = now.rows.slice().sort(function(a, b){ return b.m[statsBy] - a.m[statsBy]; }).slice(0, 5);
      var mx1 = top5.length ? top5[0].m[statsBy] || 1 : 1;
      top5.forEach(function(r){ linkRow(r.s.s, r.s.n, function(){ pick(r.s.id); focusOn(posOf(r.s)); }, r.m[statsBy], mx1); });
      var byC = {};
      now.rows.forEach(function(r){
        var mv = movedTo(r.s), iso = mv ? mv.iso1 : r.s.iso1;
        if (iso) byC[iso] = (byC[iso] || 0) + r.m[statsBy];
      });
      var cl = el('span', 'eyebrow', 'Countries'); cl.style.margin = '14px 0 2px';
      d2.wrap.appendChild(cl);
      var isos = Object.keys(byC).sort(function(a, b){ return byC[b] - byC[a]; }).slice(0, 5), mx2 = isos.length ? byC[isos[0]] || 1 : 1;
      isos.forEach(function(iso){
        var name = (LOCALES && LOCALES.countries[iso] && LOCALES.countries[iso].n) || countryNames[iso] || iso;
        linkRow(null, name, function(){ openCountry(iso); }, byC[iso], mx2);
      });
    }
    statsBody.appendChild(d2.wrap);

    // every scenario against baseline, as bars either side of zero. Presets
    // run on the map as sourced; "Custom" is the map with your edits.
    var d3s = disclosure('statsScen', 'Scenarios compared', null, renderStats);
    d3s.wrap.className = 'st-sec';
    if (d3s.open){
      tabs(d3s.wrap);
      var srcList = baseList();
      var rowsS = SCENARIOS.slice(1).map(function(sc){
        resolveMoves(sc);
        return {label: sc.label, me: !state.edited && sc === SCEN, ch: chg(totals(sc, srcList)[statsBy], base[statsBy])};
      });
      if (state.edited) rowsS.push({label: 'Custom (your edits)', me: true, ch: chg(now[statsBy], base[statsBy])});
      var span = Math.max(10, d3.max(rowsS, function(r){ return Math.abs(r.ch); }) || 0);
      var br = el('div', 'st-row' + (!changed ? ' me' : '')); br.appendChild(el('span'));
      br.appendChild(el('span', null, 'Baseline')); br.appendChild(valEl(base[statsBy]));
      d3s.wrap.appendChild(br);
      rowsS.forEach(function(r){
        var row = el('div', 'st-row' + (r.me ? ' me' : ''));
        row.appendChild(el('span'));
        row.appendChild(el('span', null, r.label));
        var cls = r.ch < -0.5 ? 'lo' : r.ch > 0.5 ? 'hi' : '';
        row.appendChild(el('span', 'v ' + cls, pctTxt(r.ch)));
        var dv = el('div', 'st-div'), f = el('i', cls), w = Math.min(50, Math.abs(r.ch) / span * 50);
        f.style.width = w.toFixed(1) + '%'; f.style.left = (r.ch < 0 ? 50 - w : 50).toFixed(1) + '%';
        dv.appendChild(f); row.appendChild(dv);
        d3s.wrap.appendChild(row);
      });
    }
    statsBody.appendChild(d3s.wrap);
  }

  /* ------------------------------ live counter ----------------------------
     Running totals for everything on the map since the page opened, at the
     model's yearly rates under the active scenario. The count integrates
     the rate frame by frame, so switching scenarios or editing nodes changes
     its pace without a jump. Reduced motion: once a second.
     ----------------------------------------------------------------------- */
  var SEC_PER_YEAR = 365.25 * 24 * 3600;
  var liveRate = {E: 0, C: 0, W: 0}, liveSum = {E: 0, C: 0, W: 0}, liveLast = null;
  var liveEl = {};   // filled by renderStats while its section is open
  function liveRates(){
    var t = totals(SCEN);
    liveRate = {E: t.E / SEC_PER_YEAR, C: t.C / SEC_PER_YEAR, W: t.W / SEC_PER_YEAR};   // MWh, t, m³ per second
  }
  // the count, in units that grow with it
  var LIVE_FMT = {
    E: function(v){ return v >= 1e6 ? [(v / 1e6).toFixed(3), 'TWh'] : v >= 1e3 ? [(v / 1e3).toFixed(2), 'GWh'] : [v.toFixed(1), 'MWh']; },
    C: function(v){ return v >= 1e6 ? [(v / 1e6).toFixed(3), 'Mt CO₂e'] : v >= 1e3 ? [(v / 1e3).toFixed(2), 'kt CO₂e'] : [v.toFixed(2), 't CO₂e']; },
    W: function(v){ return v >= 1e6 ? [(v / 1e6).toFixed(3), 'Mm³'] : v >= 1e3 ? [(v / 1e3).toFixed(2), 'k m³'] : [v.toFixed(1), 'm³']; }
  };
  var liveShown = {E: '', C: '', W: ''};
  function liveDraw(){
    ['E', 'C', 'W'].forEach(function(k){
      if (!liveEl[k]) return;
      var f = LIVE_FMT[k](liveSum[k]);
      if (f[1] !== liveShown[k]){   // rebuild only when the unit changes
        liveEl[k].innerHTML = '';
        liveEl[k].appendChild(document.createTextNode(''));
        liveEl[k].appendChild(unitEl(f[1]));
        liveShown[k] = f[1];
      }
      liveEl[k].firstChild.nodeValue = Number(f[0]).toLocaleString('en-US', {minimumFractionDigits: f[0].split('.')[1].length});
    });
  }
  function liveTick(now){
    if (liveLast !== null){
      var dt = Math.min(1, (now - liveLast) / 1000);   // a hidden tab doesn't dump a burst on return
      liveSum.E += liveRate.E * dt; liveSum.C += liveRate.C * dt; liveSum.W += liveRate.W * dt;
    }
    liveLast = now;
    liveDraw();
    if (still()) setTimeout(function(){ liveTick(performance.now()); }, 1000);
    else requestAnimationFrame(liveTick);
  }

  function setStats(on){
    statsOpen = on;
    statsEl.classList.toggle('open', on);
    box.classList.toggle('stats-open', on);
    statsBtn.setAttribute('aria-expanded', String(on));
    statsBtn.classList.toggle('on', on);
    try { localStorage.setItem('atlas.statsPanel', on ? 'open' : 'closed'); } catch (e) {}
    if (on) renderStats();
    syncPadding();
  }
  statsBtn.addEventListener('click', function(e){ e.stopPropagation(); setStats(!statsOpen); });
  document.getElementById('stats-close').addEventListener('click', function(){ setStats(false); statsBtn.focus(); });
  statsEl.addEventListener('click', function(e){ e.stopPropagation(); });

  /* -------------------------------- boot --------------------------------- */
  if (window.matchMedia){
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onTheme = function(){ applyTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', onTheme);
  }
  refresh();
  loadData();
  if (statsOpen) setStats(true);
  liveRates(); liveTick(performance.now());
})();
</script>
