<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css">
<style>
  :root{
    --paper:#F7F7F5;
    --surface:#FFFFFF;
    --ink:#15181A;
    --ink-2:#585F61;
    --ink-3:#8B9294;
    --rule:#D8DBDA;
    --rule-soft:#E9EBEA;
    --land:#E7E9E7;
    --landline:#CDD1CF;
    --water:#DDE3E4;
    --space:#FFFFFF;
    --map-label:#7D8586;
    --state-line:rgba(21,24,26,.34);
    --hs-shadow:rgba(40,46,46,.30);
    --hs-light:rgba(255,255,255,.35);
    --accent:#17706B;
    --accent-soft:#D9E9E7;
    --ramp0:#EFF0EC;
    --ramp1:#8A7F6C;
    --r-ci0:#F4F2E4;   --r-ci1:#9C8730;
    --r-ws0:#E7EDF2;   --r-ws1:#3C6A8B;
    --r-aq0:#EFEFEE;   --r-aq1:#6C7272;
    --r-land0:#E9EFE8; --r-land1:#4C6F51;
    --warn:#9A6B2F;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#111313;
      --surface:#171A1A;
      --ink:#E9EBEA;
      --ink-2:#A7AEAE;
      --ink-3:#757C7C;
      --rule:#313636;
      --rule-soft:#232727;
      --land:#222626;
      --landline:#3A4140;
      --water:#0C0F10;
      --space:#171A1A;
      --map-label:#6E7676;
      --state-line:rgba(233,235,234,.34);
      --hs-shadow:rgba(0,0,0,.55);
      --hs-light:rgba(233,235,234,.09);
      --accent:#6CC9BF;
      --accent-soft:#1C2E2C;
      --ramp0:#1F2322;
      --ramp1:#8E8471;
      --r-ci0:#23241B;   --r-ci1:#8A7A3A;
      --r-ws0:#1A2126;   --r-ws1:#5484A4;
      --r-aq0:#1F2322;   --r-aq1:#878D8D;
      --r-land0:#1C221C; --r-land1:#66896B;
      --warn:#C9A06A;
    }
  }
  :root[data-theme="dark"]{
    --paper:#111313;--surface:#171A1A;--ink:#E9EBEA;--ink-2:#A7AEAE;--ink-3:#757C7C;
    --rule:#313636;--rule-soft:#232727;--land:#222626;--landline:#3A4140;
    --water:#0C0F10;--space:#171A1A;--map-label:#6E7676;--state-line:rgba(233,235,234,.34);--hs-shadow:rgba(0,0,0,.55);--hs-light:rgba(233,235,234,.09);
    --accent:#6CC9BF;--accent-soft:#1C2E2C;--ramp0:#1F2322;--ramp1:#8E8471;--warn:#C9A06A;
    --r-ci0:#23241B;--r-ci1:#8A7A3A;--r-ws0:#1A2126;--r-ws1:#5484A4;
    --r-aq0:#1F2322;--r-aq1:#878D8D;--r-land0:#1C221C;--r-land1:#66896B;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:"Source Serif 4",Georgia,serif;font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  button,input{font:inherit;color:inherit}
  .mono,.m-lbl,.m-val,.meta,.bar-txt{font-family:"IBM Plex Mono",ui-monospace,monospace}
  .tnum{font-variant-numeric:tabular-nums}

  .app{display:flex;flex-direction:column;height:100dvh;background:var(--surface)}

  /* ---------- top hairline ---------- */
  .top{
    display:flex;align-items:center;gap:18px;padding:0 14px;height:46px;flex:0 0 auto;
    border-bottom:1px solid var(--rule);position:relative;z-index:30;background:var(--surface)
  }
  .mark{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.26em;text-transform:uppercase;white-space:nowrap}
  .search{position:relative;flex:0 1 250px;display:flex;align-items:center;gap:7px}
  .search svg{flex:0 0 auto;opacity:.5}
  .search input{
    width:100%;background:none;border:0;outline:none;padding:5px 0;
    font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.02em;color:var(--ink);
    border-bottom:1px solid transparent;
  }
  .search input::placeholder{color:var(--ink-3)}
  .search input:focus{border-bottom-color:var(--accent)}
  .results{
    position:absolute;top:34px;left:0;width:290px;background:var(--surface);
    border:1px solid var(--rule);box-shadow:0 14px 30px -20px rgba(0,0,0,.55);
    max-height:300px;overflow-y:auto;display:none;z-index:40
  }
  .results.open{display:block}
  .results button{
    display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid var(--rule-soft);padding:8px 11px;cursor:pointer;color:var(--ink-2)
  }
  .results button:last-child{border-bottom:0}
  .results button:hover,.results button.cursor{background:var(--rule-soft);color:var(--ink)}
  .results .rn{font-size:14.5px}
  .results .rs{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
  .results .empty{padding:10px 11px;font-size:13px;color:var(--ink-3);font-style:italic}

  .stages{display:flex;gap:13px;flex-wrap:wrap;margin-left:auto}
  .stages button{
    background:none;border:0;padding:3px 0;cursor:pointer;color:var(--ink-3);
    display:inline-flex;align-items:center;gap:5px;
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    border-bottom:1px solid transparent;white-space:nowrap
  }
  .stages button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:1px solid var(--accent);outline-offset:3px}

  /* ---------- map ---------- */
  .mapbox{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
  .gl-host{position:absolute;inset:0;background:var(--space)}
  .mk{cursor:pointer;line-height:0}
  .mk svg{display:block;width:14px;height:14px;overflow:visible}
  .mk.sel svg,.mk.cmp svg{width:18px;height:18px}
  .nd{cursor:pointer}
  .nd path{
    fill:#000;stroke:#FFF;stroke-width:2.2px;vector-effect:non-scaling-stroke;
    paint-order:stroke fill;stroke-linejoin:round;fill-rule:evenodd
  }
  .pc circle{
    fill:none;stroke:#FFF;stroke-width:3.4px;vector-effect:non-scaling-stroke;
    paint-order:stroke;cursor:pointer
  }
  .pc circle.dot{stroke:#000;stroke-width:1.5px;stroke-dasharray:2.4 2.2}
  .pc{cursor:pointer}
  .pc.sel circle.dot{stroke:var(--accent);stroke-dasharray:none;stroke-width:2.2px}
  .pc path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round}
  .pc path.ph{stroke:#FFF;stroke-width:3.2px}
  .pc path.pb{stroke:#000;stroke-width:1.7px}
  .pc.sel path.pb{stroke:var(--accent)}
  .addrow{display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--rule-soft)}
  .addrow button{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid var(--rule-soft);padding:8px 2px;cursor:pointer;color:var(--ink-2);font-size:14.5px
  }
  .addrow button:hover{color:var(--ink)}
  .addrow button .plus{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
  .addrow button:hover .plus{color:var(--accent)}
  .p-actions button.danger{color:var(--ink-3)}
  .p-actions button.danger:hover{color:var(--warn);border-bottom-color:var(--warn)}
  .nd:hover path{fill:var(--accent)}
  .nd.rel path{fill:var(--accent);opacity:.82}
  .nd.sel path{fill:var(--accent);stroke-width:2.6px}
  .nd.cmp path{fill:var(--warn);stroke-width:2.6px}
  .gl{flex:0 0 auto;vertical-align:-1px}
  .gl path{fill:var(--ink)}
  .stages button .gl path{fill:currentColor}
  .results .gl path{fill:var(--ink-2)}
  .eyebrow .gl path{fill:currentColor}
  .overlay{position:absolute;inset:0;pointer-events:none}
  .tip{
    position:absolute;transform:translate(-50%,-165%);white-space:nowrap;font-style:italic;font-size:13px;
    color:var(--ink);background:color-mix(in srgb,var(--surface) 86%,transparent);padding:0 5px;display:none
  }
  /* Mapbox requires its logo and attribution; keep them, just quiet */
  .mapboxgl-ctrl-bottom-right .mapboxgl-ctrl-attrib{
    background:color-mix(in srgb,var(--surface) 78%,transparent);
    font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.04em;color:var(--ink-3)
  }
  .mapboxgl-ctrl-attrib a{color:var(--ink-3)}

  /* ---------- panel ---------- */
  .panel{
    position:absolute;left:0;top:0;bottom:0;width:302px;max-width:88%;background:var(--surface);
    border-right:1px solid var(--rule);padding:18px 17px 14px;display:flex;flex-direction:column;gap:14px;
    transform:translateX(-101%);transition:transform .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1);
    pointer-events:auto;overflow-y:auto;z-index:20
  }
  .panel.open{transform:none}
  .panel.wide{width:452px}
  .p-close{position:absolute;top:13px;right:13px;background:none;border:0;cursor:pointer;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:12px;z-index:2}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);display:block}
  .p-name{margin:2px 0 3px;font-size:22px;font-weight:600;letter-spacing:-.012em;line-height:1.14;padding-right:22px}
  .p-place{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-2);letter-spacing:.02em}
  .p-note{margin:0;font-size:14px;color:var(--ink-2);font-style:italic;line-height:1.45}

  .sec-lbl{display:flex;align-items:baseline;gap:8px}
  .sec-lbl button{background:none;border:0;padding:0;margin-left:auto;cursor:pointer;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
  .sec-lbl button[aria-pressed="true"]{color:var(--accent)}

  .metrics{display:flex;flex-direction:column;border-top:1px solid var(--rule-soft)}
  .m{padding:8px 0;border-bottom:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:3px}
  .m-top{display:flex;align-items:baseline;gap:8px}
  .m-lbl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
  .m-dots{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-3px);min-width:8px}
  .m-val{font-size:13px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
  .m-val .u{color:var(--ink-3);font-size:10px;letter-spacing:.04em;margin-left:3px}
  .m-bar{height:2px;background:var(--rule-soft);position:relative}
  .m-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.62;display:block}
  .m-f{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3);letter-spacing:.01em;display:none}
  .metrics.show-f .m-f{display:block}

  .inputs{font-family:"IBM Plex Mono",monospace;font-size:9.5px;line-height:1.7;color:var(--ink-3);letter-spacing:.02em}
  .inputs b{color:var(--ink-2);font-weight:500}
  .chain{display:flex;flex-direction:column;gap:4px}
  .chain .lk{display:flex;gap:8px;align-items:baseline;font-size:14px;color:var(--ink-2);cursor:pointer;background:none;border:0;padding:1px 0;text-align:left;width:100%}
  .chain .lk .ar{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--accent);width:11px;flex:0 0 11px}
  .chain .lk:hover{color:var(--ink)}
  .p-actions{margin-top:auto;padding-top:12px;border-top:1px solid var(--rule-soft);display:flex;gap:16px;flex-wrap:wrap}
  .p-actions button{
    background:none;border:0;padding:0;cursor:pointer;color:var(--ink-2);
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
    border-bottom:1px solid var(--rule)
  }
  .p-actions button:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .p-actions button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}

  /* compare */
  .cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .cmp-col{display:flex;flex-direction:column;gap:8px;min-width:0}
  .cmp-col.b .p-name{color:var(--warn)}
  .cmp-hint{font-size:13.5px;font-style:italic;color:var(--ink-3);border:1px dashed var(--rule);padding:10px;line-height:1.4}
  .delta{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.04em}
  .delta.up{color:var(--warn)}
  .delta.down{color:var(--accent)}
  .cmp-rows{display:flex;flex-direction:column;border-top:1px solid var(--rule-soft)}
  .cmp-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rule-soft)}
  .cmp-row .a-v,.cmp-row .b-v{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-variant-numeric:tabular-nums}
  .cmp-row .b-v{text-align:right}
  .cmp-row .k{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:center}

  /* ---------- bottom hairline ---------- */
  .bottom{
    display:flex;align-items:center;gap:20px;padding:0 14px;min-height:40px;flex:0 0 auto;flex-wrap:wrap;
    border-top:1px solid var(--rule);background:var(--surface);position:relative;z-index:30
  }
  .bar-txt{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
  .layer{position:relative}
  .layer > button{
    background:none;border:0;cursor:pointer;padding:3px 0;color:var(--ink-2);
    font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    border-bottom:1px solid var(--rule)
  }
  .layer-menu{
    position:absolute;bottom:26px;left:0;min-width:200px;background:var(--surface);border:1px solid var(--rule);
    box-shadow:0 -12px 28px -20px rgba(0,0,0,.55);display:none;z-index:40
  }
  .layer-menu.open{display:block}
  .layer-menu button{
    display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule-soft);
    padding:8px 11px;cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;color:var(--ink-2)
  }
  .layer-menu button:last-child{border-bottom:0}
  .layer-menu button[aria-checked="true"]{color:var(--accent)}
  .layer-menu button .tag{float:right;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--rule);padding:0 4px;margin-left:10px}
  .layer-menu button:hover{background:var(--rule-soft)}

  /* ---------- context menu (right-click / long-press on the map) ---------- */
  .ctx{
    position:absolute;min-width:224px;max-width:290px;background:var(--surface);border:1px solid var(--rule);
    box-shadow:0 18px 36px -22px rgba(0,0,0,.6);padding:0 0 4px;z-index:35;outline:none
  }
  .ctx[hidden]{display:none}
  .ctx-head{padding:10px 12px 9px;border-bottom:1px solid var(--rule-soft);margin-bottom:4px}
  .ctx-head .eyebrow{margin-bottom:2px}
  .ctx-name{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.2;color:var(--ink)}
  .ctx-sub{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3);letter-spacing:.02em;margin-top:2px}
  .ctx button{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
    padding:7px 12px;cursor:pointer;color:var(--ink-2);outline:none;
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.05em
  }
  .ctx button .ci{flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
  .ctx button:hover,.ctx button:focus{background:var(--rule-soft);color:var(--ink)}
  .ctx button:focus-visible{outline:none;box-shadow:inset 2px 0 0 var(--accent)}
  .ctx button:hover .ci,.ctx button:focus .ci{opacity:1}
  .ctx button.danger:hover,.ctx button.danger:focus{color:var(--warn)}
  .ctx button[aria-disabled="true"]{color:var(--ink-3);cursor:default;background:none}
  .ctx button[aria-disabled="true"] .ci{opacity:.4}
  .ctx-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ctx-hint{
    margin-left:auto;padding-left:10px;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px
  }
  .ctx-sep{height:1px;background:var(--rule-soft);margin:4px 0}
  .toast{
    position:absolute;left:50%;bottom:18px;transform:translate(-50%,6px);opacity:0;pointer-events:none;
    background:var(--surface);border:1px solid var(--rule);padding:6px 11px;z-index:35;white-space:nowrap;
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;color:var(--ink-2);
    box-shadow:0 14px 30px -20px rgba(0,0,0,.55);transition:opacity .16s ease,transform .16s ease
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* one entrance for every pop-over: search results, layer menu, context menu */
  @keyframes pop-in{from{opacity:0;transform:translateY(-3px) scale(.985)}to{opacity:1;transform:none}}
  .results.open,.layer-menu.open,.ctx:not([hidden]){animation:pop-in .13s cubic-bezier(.2,0,0,1)}
  .ramp{display:flex;align-items:center;gap:7px}
  .ramp.pending .sw{opacity:.28}
  .ramp.pending #ramp-lo{color:var(--warn)}
  .ramp .sw{display:flex;width:74px;height:6px;border:1px solid var(--rule)}
  .ramp .sw i{flex:1}
  .year{display:flex;align-items:center;gap:9px;flex:1 1 210px;min-width:170px}
  .year input[type="range"]{
    flex:1;appearance:none;background:none;height:18px;cursor:pointer;min-width:90px
  }
  .year input[type="range"]::-webkit-slider-runnable-track{height:1px;background:var(--rule)}
  .year input[type="range"]::-moz-range-track{height:1px;background:var(--rule)}
  .year input[type="range"]::-webkit-slider-thumb{
    appearance:none;width:9px;height:9px;border-radius:50%;background:var(--surface);
    border:1.5px solid var(--ink);margin-top:-4px
  }
  .year input[type="range"]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:var(--surface);border:1.5px solid var(--ink)}
  .yv{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums;width:60px}
  .yv .proj{color:var(--warn)}
  .totals{margin-left:auto;display:flex;gap:16px;align-items:baseline}
  .totals .t{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums}
  .totals .t span{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-left:4px}
  .sample{
    font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--warn);border:1px solid currentColor;padding:2px 6px;white-space:nowrap
  }

  @media (max-width:720px){
    .top{height:auto;padding:9px 12px;flex-wrap:wrap;gap:10px 14px}
    .stages{margin-left:0;width:100%;gap:11px}
    .search{flex:1 1 150px}
    .results{width:min(290px,84vw)}
    .totals{margin-left:0;width:100%;justify-content:space-between}
    .panel.wide{width:min(452px,92%)}
    .bottom{padding:8px 12px;gap:10px 14px}
  }
  @media (prefers-reduced-motion:reduce){
    .panel,.toast{transition:none}
    .results.open,.layer-menu.open,.ctx:not([hidden]){animation:none}
  }
</style>

<div class="app">

  <div class="top">
    <span class="mark">Atlas</span>
    <div class="search">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="5" cy="5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="7.8" y1="7.8" x2="11" y2="11" stroke="currentColor" stroke-width="1.2"/></svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search site, region, stage  /" aria-label="Search sites">
      <div class="results" id="results" role="listbox" aria-label="Search results"></div>
    </div>
    <div class="stages" id="stages"></div>
  </div>

  <div class="mapbox" id="map">
    <div class="gl-host" id="gl"></div>
    <div class="overlay" id="ov"><div class="tip" id="tip"></div></div>
    <div class="ctx" id="ctx" role="menu" tabindex="-1" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <aside class="panel" id="panel" aria-live="polite">

         paint:{'text-color': token('--map-label')}},
        {id:'city-label', type:'symbol', source:'streets', 'source-layer':'place_label',
         minzoom: 5, filter:['all', ['==', ['get','class'], 'settlement'], ['<=', ['get','symbolrank'], 9]],
         layout:{'text-field':['coalesce',['get','name_en'],['get','name']], 'text-font': FONT,
                 'text-size': 10.5, 'text-max-width': 8},
         paint:{'text-color': token('--map-label')}},
        {id:'flow', type:'line', source:'flows',
         layout:{'line-cap':'butt'},
         paint:{'line-color': token('--accent'), 'line-width': 1.2, 'line-dasharray': [2.5, 2.5], 'line-opacity': 0.9}}
      ]
    }
  });
  map.addControl(new mapboxgl.AttributionControl({compact: true}), 'bottom-right');
  map.dragRotate.disable();
  map.touchZoomRotate.disableRotation();

  var ready = false;
  map.on('load', function(){ ready = true; applyTheme(); drawFlows(); });
  map.on('click', function(e){
    if (e.originalEvent && e.originalEvent.target.closest && e.originalEvent.target.closest('.mk')) return;
    if (!state.comparing) select(null);

  map.on('movestart', hideTip);

  // Re-read the colour tokens into the style (on load and on theme change).
  function applyTheme(){
    if (!ready) return;
    map.setPaintProperty('ocean', 'background-color', token('--water'));
    map.setPaintProperty('landmass', 'fill-color', token('--land'));
    map.setPaintProperty('water', 'fill-color', token('--water'));
    map.setPaintProperty('relief', 'hillshade-shadow-color', token('--hs-shadow'));
    map.setPaintProperty('relief', 'hillshade-highlight-color', token('--hs-light'));
    map.setPaintProperty('relief', 'hillshade-accent-color', token('--hs-shadow'));
    map.setPaintProperty('borders', 'line-color', token('--landline'));
    map.setPaintProperty('state-borders', 'line-color', token('--state-line'));
    map.setPaintProperty('country-label', 'text-color', token('--map-label'));
    map.setPaintProperty('city-label', 'text-color', token('--map-label'));
    map.setPaintProperty('flow', 'line-color', token('--accent'));
    map.setFog(fog());

  }

  var marks = {};   // id → {m: mapboxgl.Marker, el, d}
  var REL = {};

  function markElement(d){
    var el = document.createElement('div');
    if (d.s){
      el.className = 'mk nd';
      el.dataset.id = d.id;
      el.innerHTML = '<svg viewBox="-9 -9 18 18" aria-hidden="true"><path d="' + ICONS[d.s] + '"></path></svg>';
    } else {
      el.className = 'mk pc';
      el.dataset.id = d.id;
      el.innerHTML = '<svg viewBox="-9 -9 18 18" aria-hidden="true">'
        + '<circle class="halo" r="5.6"></circle><circle class="dot" r="5.6"></circle>'
        + '<path class="ph" d="M-2.7 0 H2.7 M0 -2.7 V2.7"></path><path class="pb" d="M-2.7 0 H2.7 M0 -2.7 V2.7"></path></svg>';
    }
    el.addEventListener('click', function(ev){ ev.stopPropagation(); pick(d.id); });
    el.addEventListener('mouseenter', function(){ showTip(d); });
    el.addEventListener('mouseleave', hideTip);
    return el;
  }

  function renderMarks(){
    var want = {};
    SITES.filter(visible).forEach(function(d){ want[d.id] = d; });
    CITIES.forEach(function(d){ want[d.id] = d; });
    Object.keys(marks).forEach(function(id){
      if (want[id] !== marks[id].d){ marks[id].m.remove(); delete marks[id]; }
    });
    Object.keys(want).forEach(function(id){
      if (marks[id]) return;
      var d = want[id], el = markElement(d);
      marks[id] = {m: new mapboxgl.Marker({element: el}).setLngLat(d.c).addTo(map), el: el, d: d};
    });
    placeNodes();
  }

  function showTip(d){
    if (d.id === state.selected || !ctx.hidden) return;
    var xy = map.project(d.c);
    tip.textContent = d.n; tip.style.display = 'block';
    tip.style.left = xy.x+'px'; tip.style.top = xy.y+'px';
  }
  function hideTip(){ tip.style.display = 'none'; }

  // Ease a site into view, clear of the panel.
  function still(){ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  function focusOn(c, zoom){
    map.easeTo({center: c, zoom: Math.max(map.getZoom(), zoom || 2.4), duration: still() ? 0 : 900});
  }

  function rampColors(layer){
    var k = layer || state.layer;
    var a = token('--r-' + k + '0');
    var b = token('--r-' + k + '1');
    if (!a || !b) return [token('--ramp0'), token('--ramp1')];
    return [a, b];
  }
  var SCALES = {
    ci: d3.scaleLinear().domain([40, 700]).clamp(true),
    ws: d3.scaleLinear().domain([0, 1]).clamp(true),
    aq: d3.scaleLinear().domain([4, 70]).clamp(true)
  };
  function paintLand(){
    paintRamp();
    if (!ready) return;
    var k = state.layer, on = !!SCALES[k];
    if (on){
      var ends = rampColors();
      var interp = d3.interpolateLab(ends[0], ends[1]);
      var expr = ['match', ['get','iso_3166_1']];
      Object.keys(COUNTRY).forEach(function(iso){
        var rec = COUNTRY[iso], v;
        if (k === 'ci') v = SCALES.ci(rec[0] * Math.pow(1 - 0.028, state.year - BASE_YEAR));
        else if (k === 'ws') v = SCALES.ws(rec[1]);
        else v = SCALES.aq(rec[2]);
        expr.push(iso, d3.color(interp(v)).formatHex());
      });
      expr.push(ends[0]);
      map.setPaintProperty('region', 'fill-color', expr);
    }
    map.setPaintProperty('region', 'fill-opacity', on ? 0.94 : 0);
    // With a layer on, relief drops back to a texture so the ramp stays readable.
    map.setPaintProperty('relief', 'hillshade-exaggeration', on ? 0.32 : 0.6);
  }

  function arc(a, b){
    var interp = d3.geoInterpolate(a, b), pts = [], prev = null;
    for (var i=0;i<=48;i++){
      var p = interp(i/48);
      // unwrap across the antimeridian so the line doesn't jump the long way round
      if (prev) while (p[0] - prev[0] > 180) p[0] -= 360;
      if (prev) while (p[0] - prev[0] < -180) p[0] += 360;
      pts.push(p); prev = p;
    }
    return pts;
  }

  function drawFlows(){
    var focus = state.selected;
    var links = [];
    if (focus){
      FLOWS.forEach(function(f){
        if ((f[0]===focus || f[1]===focus) && live(f[0]) && live(f[1])) links.push(f);
      });
    }
    if (ready) map.getSource('flows').setData({type:'FeatureCollection', features: links.map(function(f){
      return {type:'Feature', properties:{}, geometry:{type:'LineString', coordinates: arc(byId[f[0]].c, byId[f[1]].c)}};
    })});
    REL = {};
    links.forEach(function(f){ REL[f[0]]=1; REL[f[1]]=1; });
    placeNodes();
  }

  function placeNodes(){
    Object.keys(marks).forEach(function(id){
      var el = marks[id].el, big = (id===state.selected || id===state.compare);
      el.classList.toggle('sel', id===state.selected);
      el.classList.toggle('cmp', id===state.compare);
      el.classList.toggle('rel', !!REL[id] && !big);
      // selected marks draw last so they clear their neighbours
      el.style.zIndex = big ? 2 : (REL[id] ? 1 : 0);
    });
  }

  /* ================================ CHROME =============================== */
  var stagesHost = document.getElementById('stages');
  STAGES.forEach(function(s){
    var b = document.createElement('button');
    b.type='button'; b.setAttribute('aria-pressed','true');
    b.innerHTML = glyphHTML(s.k, 13) + ' <span></span>';
    b.querySelector('span').textContent = s.label;
    b.addEventListener('click', function(){
      state.active[s.k] = !state.active[s.k];
      b.setAttribute('aria-pressed', String(state.active[s.k]));
      if (state.selected && !visible(byId[state.selected])) select(null);
      if (state.compare && !visible(byId[state.compare])) state.compare = null;
      refresh();
    });
    stagesHost.appendChild(b);
  });

  var layerBtn = document.getElementById('layer-btn');
  var layerMenu = document.getElementById('layer-menu');
  LAYERS.forEach(function(L){
    var b = document.createElement('button');
    b.type='button'; b.setAttribute('role','menuitemradio');
    b.textContent = L.label;
    if (L.todo){ b.className = 'todo'; b.appendChild(el0('span','tag','placeholder')); }
    b.setAttribute('aria-checked', String(L.k === state.layer));
    b.addEventListener('click', function(){
      state.layer = L.k;
      layerBtn.textContent = 'Layer: ' + L.label.toLowerCase();
      Array.prototype.forEach.call(layerMenu.children, function(c){ c.setAttribute('aria-checked','false'); });
      b.setAttribute('aria-checked','true');
      closeLayer();
      var ramp = document.getElementById('ramp');
      ramp.style.visibility = (L.k==='none') ? 'hidden' : 'visible';
      ramp.classList.toggle('pending', !!L.todo);
      document.getElementById('ramp-lo').textContent = L.todo ? 'no data bound yet' : L.lo;
      document.getElementById('ramp-hi').textContent = L.todo ? '' : L.hi;
      paintLand();
    });
    layerMenu.appendChild(b);
  });
  function closeLayer(){ layerMenu.classList.remove('open'); layerBtn.setAttribute('aria-expanded','false'); }
  layerBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var on = !layerMenu.classList.contains('open');
    layerMenu.classList.toggle('open', on);
    layerBtn.setAttribute('aria-expanded', String(on));
  });
  document.addEventListener('click', function(){
    closeLayer(); closeResults();
    if (Date.now() - ctxOpenedAt > 350) closeCtx();
  });

  function paintRamp(){
    var sw = document.getElementById('ramp-sw');
    var ends = rampColors(), interp = d3.interpolateLab(ends[0], ends[1]);
    sw.innerHTML = '';
    for (var i=0;i<6;i++){
      var seg = document.createElement('i');
      seg.style.background = interp(i/5);
      sw.appendChild(seg);
    }
  }

  /* -------------------------------- search ------------------------------- */
  var q = document.getElementById('q');
  var results = document.getElementById('results');
  var cursor = -1, matches = [];

  function closeResults(){ results.classList.remove('open'); cursor = -1; }
  function runSearch(){
    var t = q.value.trim().toLowerCase();
    if (!t){ closeResults(); return; }
    matches = SITES.concat(CITIES).filter(function(d){
      var hay = d.n+' '+d.p+' '+(d.s ? stageLabel[d.s] : 'unassigned location')+' '+REGIONS[d.r].n+' '+(d.note||'');
      return hay.toLowerCase().indexOf(t) >= 0;
    }).slice(0, 8);
    results.innerHTML = '';
    if (!matches.length){
      var e = document.createElement('div'); e.className='empty'; e.textContent='No site matches that.';
      results.appendChild(e);
    } else {
      matches.forEach(function(d, i){
        var b = document.createElement('button');
        b.type='button';
        b.innerHTML = (d.s ? glyphHTML(d.s, 12) : '<span class="gl" style="width:12px"></span>')
                    + '<span class="rn"></span><span class="rs"></span>';
        b.querySelector('.rn').textContent = d.n + ', ' + d.p;
        b.querySelector('.rs').textContent = d.s ? stageLabel[d.s] : 'Unassigned';
        b.addEventListener('click', function(ev){ ev.stopPropagation(); choose(d.id); });
        results.appendChild(b);
      });
    }
    results.classList.add('open');
  }
  function choose(id){
    if (byId[id] && !state.active[byId[id].s]){
      state.active[byId[id].s] = true;
      Array.prototype.forEach.call(stagesHost.children, function(b, i){
        if (STAGES[i].k === byId[id].s) b.setAttribute('aria-pressed','true');
      });
    }
    q.value=''; closeResults(); q.blur(); pick(id);
    focusOn((byId[id] || cityById[id]).c);
  }
  q.addEventListener('input', runSearch);
  q.addEventListener('click', function(e){ e.stopPropagation(); if (q.value) runSearch(); });
  q.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ q.value=''; closeResults(); q.blur(); return; }
    if (!matches.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      cursor = (cursor + (e.key==='ArrowDown'?1:-1) + matches.length) % matches.length;
      Array.prototype.forEach.call(results.children, function(c,i){ c.classList.toggle('cursor', i===cursor); });
    } else if (e.key === 'Enter'){
      choose(matches[Math.max(0,cursor)].id);
    }
  });
  document.addEventListener('keydown', function(e){
    if (e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); }
    if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)){ e.preventDefault(); q.focus(); }
    // ContextMenu key or Shift+F10 opens the menu for the selected mark
    if ((e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')) && state.selected && marks[state.selected]){
      e.preventDefault();
      var r = glHost.getBoundingClientRect(), pt = map.project(marks[state.selected].d.c);
      contextAt(r.left + pt.x, r.top + pt.y, marks[state.selected].el, true);
      return;
    }
    if (e.key === 'Escape'){
      if (!ctx.hidden){ closeCtx(); return; }
      if (state.comparing){ toggleCompare(); }
      else if (state.selected){ select(null); }
    }
  });

  /* -------------------------------- panel -------------------------------- */
  var panel = document.getElementById('panel');
  var pbody = document.getElementById('panel-body');
  var pactions = document.getElementById('panel-actions');
  document.getElementById('close').addEventListener('click', function(){
    if (state.comparing) toggleCompare();
    select(null);
  });

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function metricBlock(site){
    var wrap = el('div','metrics' + (state.formulas ? ' show-f' : ''));
    rows(site, state.year).forEach(function(r){
      var m = el('div','m');
      var top = el('div','m-top');
      top.appendChild(el('span','m-lbl', r.k));
      top.appendChild(el('span','m-dots'));
      var v = el('span','m-val');
      v.textContent = r.d[0];
      v.appendChild(el('span','u', r.d[1]));
      top.appendChild(v);
      m.appendChild(top);
      var bar = el('div','m-bar'); var fill = el('i'); fill.style.width = (r.frac*100).toFixed(1)+'%';
      bar.appendChild(fill); m.appendChild(bar);
      m.appendChild(el('div','m-f', r.f));
      wrap.appendChild(m);
    });
    return wrap;
  }

  function inputsBlock(site){
    var mm = metrics(site, state.year);
    var d = el('div','inputs');
    d.innerHTML =
      'Sample inputs · <b>P</b> ' + mm.cap.toFixed(0) + ' MW · <b>u</b> ' + mm.u.toFixed(2) +
      ' · <b>PUE</b> ' + mm.pue.toFixed(2) + '<br>' +
      '<b>CI</b> ' + mm.ci.toFixed(0) + ' g/kWh · <b>WUE</b> ' + mm.R.wue.toFixed(1) +
      ' L/kWh · ' + mm.R.n;
    return d;
  }

  function chainBlock(site){
    var wrap = el('div','chain');
    var ups = FLOWS.filter(function(f){ return f[1]===site.id && live(f[0]); }).map(function(f){ return f[0]; });
    var dns = FLOWS.filter(function(f){ return f[0]===site.id && live(f[1]); }).map(function(f){ return f[1]; });
    function add(list, mark){
      list.slice(0,3).forEach(function(t){
        var b = el('button','lk'); b.type='button';
        b.appendChild(el('span','ar', mark));
        b.appendChild(el('span','nm', byId[t].n));
        b.addEventListener('click', function(ev){ ev.stopPropagation(); pick(t); });
        wrap.appendChild(b);
      });
    }
    add(ups,'←'); add(dns,'→');
    if (!wrap.children.length) return null;
    return wrap;
  }

  function singleView(site){
    pbody.innerHTML = '';
    var eb = el('span','eyebrow');
    eb.innerHTML = glyphHTML(site.s, 12) + ' ';
    eb.appendChild(document.createTextNode(stageLabel[site.s]));
    pbody.appendChild(eb);
    pbody.appendChild(el('h2','p-name', site.n));
    pbody.appendChild(el('div','p-place', site.p + ' · ' + fmtCoord(site.c)));
    var note = el('p','p-note', site.note); note.style.marginTop = '12px';
    pbody.appendChild(note);

    var lbl = el('div','sec-lbl'); lbl.style.marginTop = '14px';
    lbl.appendChild(el('span','eyebrow','Per year · ' + state.year));
    var fbtn = el('button', null, 'formulas');
    fbtn.type='button'; fbtn.setAttribute('aria-pressed', String(state.formulas));
    fbtn.title = 'Show the equation behind each value · bars are scaled against the largest site';
    fbtn.addEventListener('click', function(){ state.formulas = !state.formulas; renderPanel(); });
    lbl.appendChild(fbtn);
    pbody.appendChild(lbl);

    pbody.appendChild(metricBlock(site));
    var ib = inputsBlock(site); ib.style.marginTop = '10px';
    pbody.appendChild(ib);

    var ch = chainBlock(site);
    if (ch){
      var cl = el('span','eyebrow','Chain'); cl.style.marginTop = '14px'; cl.style.marginBottom = '5px';
      pbody.appendChild(cl); pbody.appendChild(ch);
    }
  }

  function compareView(a, b){
    pbody.innerHTML = '';
    var head = el('div','cmp-grid');
    [[a,'a'],[b,'b']].forEach(function(pair){
      var col = el('div','cmp-col ' + pair[1]);
      if (!pair[0]){
        col.appendChild(el('span','eyebrow','Region B'));
        col.appendChild(el('div','cmp-hint','Click any site on the map to compare it against ' + a.n + '.'));
      } else {
        col.appendChild(el('span','eyebrow', stageLabel[pair[0].s]));
        var h = el('h2','p-name', pair[0].n); h.style.fontSize = '19px';
        col.appendChild(h);
        col.appendChild(el('div','p-place', pair[0].p));
      }
      head.appendChild(col);
    });
    pbody.appendChild(head);

    if (b){
      var ra = rows(a, state.year), rb = rows(b, state.year);
      var ma = metrics(a, state.year), mb = metrics(b, state.year);
      var raw = [[ma.E,mb.E],[ma.C,mb.C],[ma.W,mb.W],[ma.Araw,mb.Araw]];
      var grid = el('div','cmp-rows'); grid.style.marginTop = '14px';
      ra.forEach(function(r, i){
        var row = el('div','cmp-row');
        var av = el('span','a-v'); av.textContent = r.d[0];
        var k = el('span','k', r.k);
        var bv = el('span','b-v'); bv.textContent = rb[i].d[0];
        row.appendChild(av); row.appendChild(k); row.appendChild(bv);
        grid.appendChild(row);

        var pct = raw[i][0] === 0 ? 0 : ((raw[i][1] - raw[i][0]) / raw[i][0]) * 100;
        var dl = el('div','cmp-row');
        var sp = el('span','delta ' + (pct >= 0 ? 'up' : 'down'));
        sp.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(0) + '% in ' + b.n;
        sp.style.gridColumn = '1 / -1';
        sp.style.textAlign = 'right';
        dl.style.borderBottom = 'none'; dl.style.padding = '0 0 6px';
        dl.appendChild(sp);
        grid.appendChild(dl);
      });
      pbody.appendChild(grid);

      var foot = el('div','inputs'); foot.style.marginTop = '10px';
      foot.innerHTML = '<b>' + ma.R.n + '</b> ' + ma.ci.toFixed(0) + ' g/kWh · WUE ' + ma.R.wue.toFixed(1) +
                       '<br><b>' + mb.R.n + '</b> ' + mb.ci.toFixed(0) + ' g/kWh · WUE ' + mb.R.wue.toFixed(1);
      pbody.appendChild(foot);
    }
  }

  function renderPanel(){ drawPanel(); syncPadding(); }

  // Keep the map centred in the part the panel leaves visible.
  var padLeft = 0;
  function syncPadding(){
    var w = !panel.classList.contains('open') ? 0
          : Math.min(panel.classList.contains('wide') ? 452 : 302, box.clientWidth * 0.88);
    if (w === padLeft) return;
    padLeft = w;
    map.easeTo({padding: {left: w, top: 0, right: 0, bottom: 0}, duration: ready ? 400 : 0});
  }

  function drawPanel(){
    var id = state.selected;
    if (!id){ panel.classList.remove('open','wide'); return; }
    if (cityById[id]){
      panel.classList.add('open'); panel.classList.remove('wide');
      cityView(cityById[id]);
      pactions.innerHTML = ''; pactions.style.display = 'none';
      return;
    }
    pactions.style.display = '';
    var a = byId[id];
    if (!a){ panel.classList.remove('open','wide'); return; }
    panel.classList.add('open');
    panel.classList.toggle('wide', state.comparing);
    if (state.comparing) compareView(a, state.compare ? byId[state.compare] : null);
    else singleView(a);

    pactions.innerHTML = '';
    var cb = el('button', null, state.comparing ? 'Exit' : 'Compare');
    cb.type='button'; cb.setAttribute('aria-pressed', String(state.comparing));
    cb.addEventListener('click', function(ev){ ev.stopPropagation(); toggleCompare(); });
    pactions.appendChild(cb);
    var ub = el('button', null, 'Upstream');
    ub.type='button';
    ub.addEventListener('click', function(ev){
      ev.stopPropagation();
      var up = FLOWS.filter(function(f){ return f[1]===state.selected && live(f[0]); });
      if (up.length) pick(up[0][0]);
    });
    pactions.appendChild(ub);
    var rb = el('button','danger','Remove');
    rb.type='button';
    rb.title = 'Removes the node and leaves the location on the map';
    rb.addEventListener('click', function(ev){ ev.stopPropagation(); removeNode(a); });
    pactions.appendChild(rb);
  }

  /* ------------------------ add and remove nodes ------------------------- */
  function addNode(city, stage){
    var site = {
      id: city.id, n: city.n, p: city.p, s: stage, c: city.c, r: city.r,
      note: 'Added by hand · starting from sample inputs for ' + stageLabel[stage].toLowerCase() + '.',
      in: {p:DEFAULT_INPUTS[stage].p, u:DEFAULT_INPUTS[stage].u, pue:DEFAULT_INPUTS[stage].pue,
           g:DEFAULT_INPUTS[stage].g, pop:DEFAULT_INPUTS[stage].pop},
      added: true, placed: city.placed
    };
    SITES = SITES.concat([site]);
    byId[site.id] = site;
    CITIES = CITIES.filter(function(c){ return c.id !== city.id; });
    delete cityById[city.id];
    if (!state.active[stage]){
      state.active[stage] = true;
      Array.prototype.forEach.call(stagesHost.children, function(b, i){
        if (STAGES[i].k === stage) b.setAttribute('aria-pressed','true');
      });
    }
    state.selected = site.id;
    refresh();
  }

  function removeNode(site){
    var city = {id:site.id, n:site.n, p:site.p, c:site.c, r:site.r, placed:site.placed};
    SITES = SITES.filter(function(x){ return x.id !== site.id; });
    delete byId[site.id];
    CITIES = CITIES.concat([city]);
    cityById[city.id] = city;
    if (state.compare === site.id) state.compare = null;
    state.comparing = false;
    state.selected = city.id;
    refresh();
  }

  function cityView(city){
    pbody.innerHTML = '';
    pbody.appendChild(el('span','eyebrow','Unassigned location'));
    pbody.appendChild(el('h2','p-name', city.n));
    pbody.appendChild(el('div','p-place', city.p + ' · ' + fmtCoord(city.c)));
    var note = el('p','p-note', 'No node here yet. Add one to model it on the ' + REGIONS[city.r].n + ' grid.');
    note.style.marginTop = '12px';
    pbody.appendChild(note);

    var lbl = el('span','eyebrow','Add node'); lbl.style.marginTop = '14px';
    pbody.appendChild(lbl);
    var row = el('div','addrow'); row.style.marginTop = '6px';
    STAGES.forEach(function(st){
      var b = el('button'); b.type = 'button';
      b.innerHTML = glyphHTML(st.k, 15);
      b.appendChild(el('span', null, st.label));
      b.appendChild(el('span','plus','+'));
      b.addEventListener('click', function(ev){ ev.stopPropagation(); addNode(city, st.k); });
      row.appendChild(b);
    });
    pbody.appendChild(row);

    var foot = el('div','inputs'); foot.style.marginTop = '10px';
    foot.innerHTML = 'Starts from sample inputs · <b>CI</b> ' +
      ciFor(city.r, state.year).toFixed(0) + ' g/kWh · <b>WUE</b> ' +
      REGIONS[city.r].wue.toFixed(1) + ' L/kWh';
    pbody.appendChild(foot);
  }

  function toggleCompare(){
    state.comparing = !state.comparing;
    if (!state.comparing) state.compare = null;
    drawFlows(); renderPanel();
  }

  function pick(id){
    hideTip();
    if (cityById[id]){ state.comparing = false; state.compare = null; state.selected = id; }
    else if (state.comparing && state.selected && id !== state.selected){ state.compare = id; }
    else { state.selected = id; }
    drawFlows(); renderPanel();
  }
  function select(id){
    state.selected = id;
    if (!id) state.compare = null;
    drawFlows(); renderPanel();
  }

  /* ----------------------------- context menu ----------------------------
     Right-click (or long-press) the map for actions on whatever is under
     the pointer: a site, a placeholder, or open ground.
     ----------------------------------------------------------------------- */
  var ctx = document.getElementById('ctx');
  var toast = document.getElementById('toast');
  var glHost = document.getElementById('gl');
  var ctxOpenedAt = 0;

  // 12px line icons, drawn like the search glyph.
  var CI = {
    open:    'M1.5 2.5h9v7h-9z M4.5 2.5v7',
    add:     'M6 2v8 M2 6h8',
    compare: 'M1.5 4h8.5 M8 2l2 2-2 2 M10.5 8H2 M4 6l-2 2 2 2',
    up:      'M6 10.5V2 M3 5l3-3 3 3',
    zoom:    'M8.4 5a3.4 3.4 0 1 1-6.8 0a3.4 3.4 0 1 1 6.8 0 M7.6 7.6l2.9 2.9 M5 3.5v3 M3.5 5h3',
    copy:    'M4 4h6.5v6.5H4z M2 8V1.5h6.5',
    remove:  'M3 3l6 6 M9 3l-6 6'
  };
  function ctxIcon(k){
    return '<svg class="ci" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="' + CI[k] + '"></path></svg>';
  }

  function closeCtx(){
    if (ctx.hidden) return;
    ctx.hidden = true; ctx.innerHTML = '';
  }

  function openCtx(x, y, head, items, viaKeyboard){
    hideTip(); closeLayer(); closeResults();
    ctx.innerHTML = '';
    var h = el('div','ctx-head');
    if (head.eyebrow){
      var eb = el('span','eyebrow');
      eb.innerHTML = head.glyph || '';
      eb.appendChild(document.createTextNode(head.eyebrow));
      h.appendChild(eb);
    }
    h.appendChild(el('div','ctx-name', head.name));
    if (head.sub) h.appendChild(el('div','ctx-sub', head.sub));
    ctx.appendChild(h);
    ctx.setAttribute('aria-label', head.name);

    items.forEach(function(it){
      if (it === '-'){ ctx.appendChild(el('div','ctx-sep')); return; }
      var b = el('button', it.danger ? 'danger' : null);
      b.type = 'button'; b.tabIndex = -1;
      b.setAttribute('role','menuitem');
      b.innerHTML = ctxIcon(it.icon);
      b.appendChild(el('span','ctx-lbl', it.label));
      if (it.hint) b.appendChild(el('span','ctx-hint', it.hint));
      if (it.disabled) b.setAttribute('aria-disabled','true');
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        if (it.disabled) return;
        closeCtx(); it.run();
      });
      ctx.appendChild(b);
    });

    ctx.hidden = false;
    ctxOpenedAt = Date.now();
    // keep it inside the map; open upward near the bottom edge
    var W = box.clientWidth, H = box.clientHeight, w = ctx.offsetWidth, hh = ctx.offsetHeight;
    var left = Math.max(8, Math.min(x, W - w - 8));
    var up = y + hh > H - 8;
    var top = up ? Math.max(8, y - hh) : y;
    ctx.style.left = left + 'px'; ctx.style.top = top + 'px';
    ctx.style.transformOrigin = (x - left) + 'px ' + (up ? hh + 'px' : '0');
    var first = ctx.querySelector('button:not([aria-disabled])');
    (viaKeyboard && first ? first : ctx).focus({preventScroll: true});
  }

  ctx.addEventListener('keydown', function(e){
    var btns = Array.prototype.filter.call(ctx.querySelectorAll('button'), function(b){
      return !b.hasAttribute('aria-disabled');
    });
    var i = btns.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      var step = e.key === 'ArrowDown' ? 1 : -1;
      var n = i < 0 ? (step > 0 ? 0 : btns.length - 1) : (i + step + btns.length) % btns.length;
      if (btns[n]) btns[n].focus();
    } else if (e.key === 'Home' || e.key === 'End'){
      e.preventDefault();
      if (btns.length) btns[e.key === 'Home' ? 0 : btns.length - 1].focus();
    } else if (e.key === 'Escape' || e.key === 'Tab'){
      e.preventDefault(); e.stopPropagation(); closeCtx();
    }
  });
  ctx.addEventListener('click', function(e){ e.stopPropagation(); });
  ctx.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  var toastTimer = null;
  function showToast(text){
    toast.textContent = text;
    toast.style.marginLeft = (padLeft / 2) + 'px';   // centre in the visible map
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('on'); }, 1600);
  }

  function zoomItem(c){
    return {icon:'zoom', label:'Zoom to', run:function(){ focusOn(c, 5.5); }};
  }
  function copyItem(c){
    return {icon:'copy', label:'Copy coordinates', run:function(){
      var text = c[1].toFixed(4) + ', ' + c[0].toFixed(4);
      var done = function(){ showToast('Copied ' + fmtCoord(c)); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done, function(){ showToast(text); });
      } else showToast(text);
    }};
  }

  function siteItems(d){
    var cur = (state.selected && byId[state.selected] && state.selected !== d.id) ? byId[state.selected] : null;
    var up = FLOWS.filter(function(f){ return f[1] === d.id && live(f[0]); });
    var items = [{icon:'open', label:'Open details', run:function(){ pick(d.id); }}];
    if (cur) items.push({icon:'compare', label:'Compare with ' + cur.n, run:function(){
      state.comparing = true; state.compare = d.id;
      drawFlows(); renderPanel();
    }});
    if (up.length) items.push({icon:'up', label:'Go upstream', hint: byId[up[0][0]].n, run:function(){
      pick(up[0][0]); focusOn(byId[up[0][0]].c);
    }});
    items.push('-', zoomItem(d.c), copyItem(d.c), '-',
      {icon:'remove', label:'Remove node', danger:true, run:function(){ removeNode(d); }});
    return items;
  }

  function cityItems(d){
    var items = [{icon:'add', label:'Add node…', run:function(){ pick(d.id); }},
                 '-', zoomItem(d.c), copyItem(d.c)];
    if (d.placed) items.push('-', {icon:'remove', label:'Remove location', danger:true, run:function(){ dropCity(d); }});
    return items;
  }

  function groundItems(c, country){
    var r = country ? regionAt(country.iso, c, country.name) : null;
    var items = [];
    if (country) items.push({icon:'add', label:'Add node here', disabled: !r, hint: r ? null : 'No grid data',
                             run:function(){ placeAt(c, country, r); }}, '-');
    items.push({icon:'zoom', label:'Zoom in here', run:function(){
      map.easeTo({center: c, zoom: Math.min(map.getZoom() + 2, 10), duration: still() ? 0 : 600});
    }}, copyItem(c));
    return items;
  }

  // Grid region for a point: the country's only region, the region of the
  // nearest known place when a country has several, or a country-average
  // region built from COUNTRY. Sample values either way.
  function regionIso(k){ var p = k.split('-')[0]; return p === 'uk' ? 'GB' : p.toUpperCase(); }
  function regionAt(iso, c, name){
    var keys = Object.keys(REGIONS).filter(function(k){ return regionIso(k) === iso; });
    if (keys.length === 1) return keys[0];
    if (keys.length > 1){
      var best = keys[0], bd = Infinity;
      SITES.concat(CITIES).forEach(function(s){
        if (keys.indexOf(s.r) < 0) return;
        var dd = d3.geoDistance(s.c, c);
        if (dd < bd){ bd = dd; best = s.r; }
      });
      return best;
    }
    var rec = COUNTRY[iso];
    if (!rec) return null;
    var key = 'avg-' + iso;
    if (!REGIONS[key]) REGIONS[key] = {n: name + ' · country average', ci: rec[0], dec: .03, wue: 1.5,
                                       ws: rec[1], fos: Math.min(.95, rec[0] / 800)};
    return key;
  }

  var placedCount = 0;
  function placeAt(c, country, r){
    placedCount += 1;
    var city = {id: 'pt' + placedCount, n: 'New site ' + placedCount, p: country.name,
                c: [+c[0].toFixed(2), +c[1].toFixed(2)], r: r, placed: true};
    CITIES = CITIES.concat([city]);
    cityById[city.id] = city;
    state.comparing = false; state.compare = null; state.selected = city.id;
    refresh();
  }
  function dropCity(d){
    CITIES = CITIES.filter(function(x){ return x.id !== d.id; });
    delete cityById[d.id];
    if (state.selected === d.id) state.selected = null;
    refresh();
  }

  function contextAt(clientX, clientY, target, viaKeyboard){
    if (Date.now() - ctxOpenedAt < 600 && !ctx.hidden) return;   // long-press + native contextmenu
    var rect = glHost.getBoundingClientRect(), x = clientX - rect.left, y = clientY - rect.top;
    var mk = target && target.closest ? target.closest('.mk') : null;
    var d = mk && marks[mk.dataset.id] ? marks[mk.dataset.id].d : null;
    if (d && d.s){
      openCtx(x, y, {glyph: glyphHTML(d.s, 11) + ' ', eyebrow: stageLabel[d.s], name: d.n, sub: d.p}, siteItems(d), viaKeyboard);
      return;
    }
    if (d){
      openCtx(x, y, {eyebrow: 'Unassigned location', name: d.n, sub: d.p}, cityItems(d), viaKeyboard);
      return;
    }
    var ll = map.unproject([x, y]), c = [ll.lng, ll.lat];
    var f = map.queryRenderedFeatures([x, y], {layers: ['landmass']})[0];
    var country = f ? {iso: f.properties.iso_3166_1, name: f.properties.name_en || f.properties.name} : null;
    openCtx(x, y, {name: country ? country.name : 'Open water', sub: fmtCoord(c)}, groundItems(c, country), viaKeyboard);
  }

  glHost.addEventListener('contextmenu', function(e){
    e.preventDefault();
    contextAt(e.clientX, e.clientY, e.target);
  });

  // Long-press on touch screens.
  var press = null;
  function cancelPress(){ if (press){ clearTimeout(press.t); press = null; } }
  glHost.addEventListener('touchstart', function(e){
    cancelPress();
    if (e.touches.length !== 1) return;
    var t = e.touches[0];
    press = {x: t.clientX, y: t.clientY, target: e.target, fired: false};
    press.t = setTimeout(function(){ press.fired = true; contextAt(press.x, press.y, press.target); }, 550);
  }, {passive: true});
  glHost.addEventListener('touchmove', function(e){
    if (press && !press.fired && Math.hypot(e.touches[0].clientX - press.x, e.touches[0].clientY - press.y) > 8) cancelPress();
  }, {passive: true});
  glHost.addEventListener('touchend', function(e){
    if (press && press.fired) e.preventDefault();   // swallow the click that follows
    cancelPress();
  });

  map.on('movestart', closeCtx);
  window.addEventListener('resize', closeCtx);
  window.addEventListener('blur', closeCtx);

  /* ------------------------------- totals -------------------------------- */
  function refresh(){
    recomputeMaxima(state.year);
    renderMarks();
    paintLand();
    drawFlows();
    renderPanel();
  }

  /* -------------------------------- boot --------------------------------- */
  if (window.matchMedia){
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onTheme = function(){ applyTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', onTheme);
  }
  document.getElementById('ramp-lo').textContent = LAYERS[0].lo;
  document.getElementById('ramp-hi').textContent = LAYERS[0].hi;
  refresh();
})();
</script>
